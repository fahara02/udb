x-udb-broker-env: &udb-broker-env
  UDB_PG_DSN: postgres://udb:udb@postgres:5432/udb
  UDB_REDIS_DSN: redis://redis:6379/0
  UDB_QDRANT_URL: http://qdrant:6333
  UDB_MINIO_ENDPOINT: http://minio:9000
  UDB_MINIO_ACCESS_KEY: minio
  UDB_MINIO_SECRET_KEY: minio123
  UDB_KAFKA_BROKERS: kafka:9092
  UDB_ABAC_DEFAULT_ALLOW: "true"
  RUST_LOG: info

x-udb-broker-depends: &udb-broker-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  minio:
    condition: service_healthy
  kafka:
    condition: service_healthy

x-udb-broker-healthcheck: &udb-broker-healthcheck
  test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:50051"]
  interval: 10s
  timeout: 5s
  start_period: 30s
  retries: 6

x-udb-broker-base: &udb-broker-base
  build:
    context: .
    dockerfile: Dockerfile
  environment: *udb-broker-env
  depends_on: *udb-broker-depends
  healthcheck: *udb-broker-healthcheck

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres-pg-partman/Dockerfile
    image: udb-postgres-pg-partman:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_prepared_transactions=32
    environment:
      POSTGRES_USER: udb
      POSTGRES_PASSWORD: udb
      POSTGRES_DB: udb
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udb -d udb"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two broker listeners: INTERNAL (kafka:9092) for in-Docker clients (the udb
      # broker), EXTERNAL (localhost:59192) advertised so host clients — the
      # integration tests + Spark on the host — can both bootstrap AND reach the
      # advertised address. Single-advertised-listener setups break host clients
      # because the broker advertises its Docker-internal name.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:59192
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:59192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Local SDK-conformance convenience: auto-create topics on first produce so
      # PublishCDC + the CDC relay work without an explicit provisioning step.
      # Production keeps this false (explicit, governed topic management).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_COMPRESSION_TYPE: lz4
    ports:
      - "59192:59192"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF on: the Redis canonical store fail-closes on `appendonly no`
    # (aof_enabled:0) to guarantee durability, so the integration instance
    # must run with it enabled.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  memcached:
    image: memcached:1.6-alpine
    command: ["memcached", "-m", "64", "-I", "4m"]
    ports:
      - "51122:11211"

  udb:
    <<: *udb-broker-base
    profiles: ["broker"]
    ports:
      - "50051:50051"
      - "50052:50052"

  udb-livekit:
    <<: *udb-broker-base
    profiles: ["sfu"]
    environment:
      <<: *udb-broker-env
      UDB_TURN_SECRET: local-turn-secret
      UDB_TURN_URLS: turn:coturn:3478?transport=udp,turn:coturn:3478?transport=tcp
      UDB_LIVEKIT_URL: ws://livekit:7880
      UDB_LIVEKIT_API_KEY: devkey
      UDB_LIVEKIT_API_SECRET: secret
      UDB_LIVEKIT_ALLOW_INSECURE: "1"
      UDB_SESSION_ENABLED: "true"
      UDB_SESSION_HASH_SECRET: local-sfu-session-secret
      UDB_PASSWORD_HASH_SECRET: local-sfu-password-secret
      UDB_JWT_PRIVATE_KEY: src/runtime/testdata/jwt_rs256_private.pem
      UDB_JWT_PUBLIC_KEY: src/runtime/testdata/jwt_rs256_public.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      livekit:
        condition: service_started
      coturn:
        condition: service_started
    ports:
      - "50081:50051"
      - "50082:50052"

  notify-sidecar:
    profiles: ["notify"]
    build:
      context: ./sidecars/notify
      dockerfile: Dockerfile
    environment:
      UDB_NOTIFY_PROVIDER: smtp
      UDB_NOTIFY_DRY_RUN: "1"
    ports:
      - "58080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)); raise SystemExit(0 if data.get('ok') else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  embedding-sidecar:
    profiles: ["embedding"]
    build:
      context: ./sidecars/embedding
      dockerfile: Dockerfile
    environment:
      UDB_EMBED_PROVIDER: deterministic
      UDB_EMBED_DIMS: "16"
    ports:
      - "58090:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)); raise SystemExit(0 if data.get('ok') else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  udb-ha-a:
    <<: *udb-broker-base
    profiles: ["broker-ha"]
    hostname: udb-ha-a
    environment:
      <<: *udb-broker-env
      UDB_PROJECTION_ENABLED: "true"
    ports:
      - "50061:50051"
      - "50062:50052"

  udb-ha-b:
    <<: *udb-broker-base
    profiles: ["broker-ha"]
    hostname: udb-ha-b
    environment:
      <<: *udb-broker-env
      UDB_PROJECTION_ENABLED: "true"
    ports:
      - "50071:50051"
      - "50072:50052"

  livekit:
    profiles: ["sfu"]
    image: livekit/livekit-server:v1.8.4
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "57880:7880"
      - "57881:7881"
      - "57882:7882/udp"

  coturn:
    profiles: ["sfu"]
    image: coturn/coturn:4.6.2
    command:
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=local-turn-secret
      - --realm=udb.local
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
    ports:
      - "53478:3478"
      - "53478:3478/udp"
      - "49160-49200:49160-49200/udp"

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "56333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Apache Spark consumer of the native auth event stream (Kafka → Spark).
  # `--profile spark` runs the Structured Streaming job in `analytics/spark`
  # against the integration Kafka, materializing per-tenant auth metrics. Use
  # SPARK_RUN_ONCE=1 (Trigger.AvailableNow) for a bounded end-to-end test run.
  spark:
    profiles: ["spark"]
    image: apache/spark:3.5.1-scala2.12-java17-python3-ubuntu
    user: root
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      UDB_KAFKA_BOOTSTRAP: kafka:9092
      UDB_SPARK_OUTPUT: /opt/udb/out/auth_metrics
      UDB_SPARK_CHECKPOINT: /opt/udb/out/_chk
      SPARK_RUN_ONCE: ${SPARK_RUN_ONCE:-0}
    volumes:
      - ./analytics/spark:/opt/udb/spark:ro
      - ./analytics/spark/_out:/opt/udb/out
    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      - /opt/udb/spark/auth_events_streaming.py
      - --bootstrap
      - kafka:9092
      - --output
      - /opt/udb/out/auth_metrics
      - --checkpoint
      - /opt/udb/out/_chk
      - --console
