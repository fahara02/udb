// Rotate a key: mint a fresh secret under the same key record + lineage, return
// the new plain key ONCE, and invalidate the old secret. The rotated key keeps
// the same key_id, owner, scopes, tenant, and project (rotation lineage).
message RotateApiKeyRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "apikey"
    generate_minimal_example: true
  };
  string key_id = 1;
  string rotation_reason = 2;
  udb.core.common.v1.RequestContext context = 3;
}

message RotateApiKeyResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "apikey"
    generate_minimal_example: true
  };
  udb.core.apikey.entity.v1.ApiKey key = 1;
  // New plain key returned ONCE; the prior secret is invalidated immediately.
  string plain_key = 2;
  string previous_key_id = 3;
}

// Emergency revoke matching keys by one or more selectors. At least one selector
// must be set. Resolves matching records and revokes each (no prefix-only blind
// mutation): the caller's tenant/owner/admin authority is enforced per record.
message EmergencyRevokeApiKeysRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "apikey"
    generate_minimal_example: true
  };
  string key_prefix = 1;
  string owner_id = 2;
  string tenant_id = 3;
  string project_id = 4;
  string scope = 5;
  google.protobuf.Timestamp created_before = 6;
  string reason = 7;
  udb.core.common.v1.RequestContext context = 8;
}

message EmergencyRevokeApiKeysResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "apikey"
    generate_minimal_example: true
  };
  int64 revoked_count = 1;
  repeated string revoked_key_ids = 2;
  string operation_id = 3;
}

// ============================================================
// Key validation — called by the API gateway on every request
// ============================================================

message ValidateApiKeyRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "apikey"
    generate_minimal_example: true
  };
  string plain_key = 1; // Raw key from Authorization header
  string endpoint = 2; // gRPC method or HTTP path being accessed
  string required_scope = 3; // e.g. "resource:write"
  string ip_address = 4; // source IP for allowlist check
}

message ValidateApiKeyResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "apikey"
    generate_minimal_example: true
  };
  bool valid = 1;
  string key_id = 2;
  string owner_id = 3;
  udb.core.apikey.entity.v1.ApiKeyOwnerType owner_type = 4;
  // Granted scopes list (caller checks required_scope membership)
  repeated string scopes = 5;
  bool rate_limited = 6;
}

