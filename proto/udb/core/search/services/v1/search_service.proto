syntax = "proto3";

package udb.core.search.services.v1;

import "google/api/annotations.proto";
import "udb/core/common/v1/dto.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "udb.core.Search.Services.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/search/services/v1;searchservicev1";
option java_package = "com.udb.core.search.services.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Search\\Services\\V1";
option php_namespace = "Udb\\Core\\Search\\Services\\V1";

// SearchService (master-plan 9.5) — one search box over everything. Registers
// tenant-scoped full-text / vector / hybrid indexes over source entities and
// serves queries. Every query runs through the mediated IR / vector dispatch so
// a server-side tenant predicate is injected into the engine query (Elasticsearch
// body term + Qdrant `must` clause); raw engine queries are never hand-built.
service SearchService {
  option (udb.core.common.v1.native_service) = {
    service_id: "search"
    logical_service_id: "search"
    proto_service_id: "search"
    display_name: "Search"
    category: "search"
    default_enabled: true
    requires_postgres: true
    control_plane_listener_allowed: true
    sdk_facade_name: "search"
    cli_scaffold_group: "search"
    health_check_ref: "search"
    capability_ref: "native.search"
  };
  option (udb.core.common.v1.service_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  option (udb.core.common.v1.service_cli_scaffold) = {
    scaffold_package: "search"
    import_path: "udb/native/search"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
    generated_files: "udb.native.search.config"
    required_native_services: "search"
    secret_placeholders: "UDB_API_KEY"
    smoke_test_command: "udb native lint"
  };
  option (udb.core.common.v1.service_dependency_contract) = {
    required_native_services: "search"
    required_backends: "postgres"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
  };

  // Register a tenant-scoped index over a source entity. Fails closed
  // (failed_precondition) when the source table has no resolvable tenant column.
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:search:create-index"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "search.CreateIndex"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "create_index" rest_operation_id: "createSearchIndex"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "search"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "search"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "search.CreateIndex"
      outbox_topic: "udb.search.index.created.v1"
      partition_key_field: "index_name"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/search/indexes:create"
      body: "*"
    };
  }

  // Delete a tenant-scoped index registration (destructive: drops the engine
  // index resource on the follow-up worker).
  rpc DeleteIndex(DeleteIndexRequest) returns (DeleteIndexResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_DESTRUCTIVE;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:search:delete-index"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "search.DeleteIndex"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "delete_index" rest_operation_id: "deleteSearchIndex"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "search"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "search"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "search.DeleteIndex"
      outbox_topic: "udb.search.index.deleted.v1"
      partition_key_field: "index_name"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/search/indexes:delete"
      body: "*"
    };
  }

  // List the calling tenant's registered indexes.
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:search:list-indexes"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "search.ListIndexes"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "list_indexes" rest_operation_id: "listSearchIndexes"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "search"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "search"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {get: "/v1/search/indexes"};
  }

  // Run a full-text / vector / hybrid query. The tenant predicate is injected
  // server-side from the verified claim into every engine query.
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:search:search"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "search.Search"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "search" rest_operation_id: "search"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "search"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "search"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/search:query"
      body: "*"
    };
  }

  // Request a full rebuild of an index from the source entity. The backfill
  // reads source rows ONLY through the mediated IR path.
  rpc Reindex(ReindexRequest) returns (ReindexResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:search:reindex"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "search.Reindex"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "reindex" rest_operation_id: "reindexSearchIndex"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "search"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "search"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "search.Reindex"
      outbox_topic: "udb.search.index.reindex.requested.v1"
      partition_key_field: "index_name"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/search/indexes:reindex"
      body: "*"
    };
  }
}

// Query mode for a Search request.
enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0;
  // Lexical full-text only (requires query_text).
  SEARCH_MODE_TEXT = 1;
  // Dense-vector nearest-neighbour only (requires query_vector).
  SEARCH_MODE_VECTOR = 2;
  // Hybrid lexical + vector fused with reciprocal-rank fusion.
  SEARCH_MODE_HYBRID = 3;
}

message CreateIndexRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  // Verified against the bearer/claim tenant; cross-tenant values are rejected.
  string tenant_id = 1;
  string index_name = 2;
  // Fully-qualified source entity message type to index.
  string source_message_type = 3;
  // "qdrant" | "elasticsearch".
  string backend = 4;
  // Engine resource name (Qdrant collection / ES index). Optional.
  string resource_name = 5;
  // Dense-vector dimensionality (0 for full-text-only).
  int32 vector_dims = 6;
  string metadata_json = 7; // JSON
}

message CreateIndexResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  string index_id = 1;
  string index_name = 2;
  // The resolved SOURCE-table tenant column the index is scoped by.
  string tenant_column = 3;
  string message = 4;
  // Error information if operation failed
  udb.core.common.v1.ApiError error = 5;
}

message DeleteIndexRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  string tenant_id = 1;
  string index_name = 2;
}

message DeleteIndexResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  bool deleted = 1;
  string message = 2;
  // Error information if operation failed
  udb.core.common.v1.ApiError error = 3;
}

message ListIndexesRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  string tenant_id = 1;
  int32 page_size = 2;
  // Opaque pagination token returned by ListIndexesResponse.next_page_token.
  string page_token = 3;
}

message SearchIndexSummary {
  string index_id = 1;
  string index_name = 2;
  string source_message_type = 3;
  string backend = 4;
  string resource_name = 5;
  int32 vector_dims = 6;
  string status = 7;
}

message ListIndexesResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  repeated SearchIndexSummary indexes = 1;
  string message = 2;
  // Error information if operation failed
  udb.core.common.v1.ApiError error = 3;
  // Opaque token for the next page; empty when no more indexes are available.
  string next_page_token = 4;
}

message SearchRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  string tenant_id = 1;
  // Target a single index, or empty to fuse across all of the tenant's indexes.
  string index_name = 2;
  string query_text = 3;
  repeated float query_vector = 4;
  int32 top_k = 5;
  SearchMode mode = 6;
  // Requested page size. Defaults to top_k and is capped by the search max.
  int32 page_size = 7;
  // Opaque pagination token returned by SearchResponse.next_page_token.
  string page_token = 8;
}

message SearchHit {
  string id = 1;
  double score = 2;
  string index_name = 3;
  string payload_json = 4; // JSON
}

message SearchResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  repeated SearchHit hits = 1;
  string message = 2;
  // Error information if operation failed
  udb.core.common.v1.ApiError error = 3;
  // Opaque token for the next page; empty when no more hits are available.
  string next_page_token = 4;
}

message ReindexRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  string tenant_id = 1;
  string index_name = 2;
}

message ReindexResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "search"
    generate_minimal_example: true
  };
  string reindex_id = 1;
  bool accepted = 2;
  string message = 3;
  // Error information if operation failed
  udb.core.common.v1.ApiError error = 4;
}
