  // PRIVILEGED cross-tenant purge (Bug #2). Unlike PurgeTenant — which forces the
  // body tenant to equal the verified claim (self-purge only) — this RPC lets a
  // delegated operator purge a DIFFERENT `target_tenant_id`. It is gated by a
  // DISTINCT, default-deny scope (`udb:tenant:admin-purge`) SEPARATE from the
  // self-purge scope, is DESTRUCTIVE, and demands an explicit confirmation token
  // plus an idempotency key. The handler routes the movement with
  // `privileged_cross_tenant=true`, binds the VERIFIED delegated actor, treats
  // control-plane / tenant-less tables explicitly (retained + reported, never
  // blind-deleted), and writes an immutable audit/outcome record. `tenant_field`
  // names the body tenant the action targets (`target_tenant_id`); the handler —
  // not the transport gate — authorizes the cross-tenant reach via the scope.
  rpc AdminPurgeTenant(AdminPurgeTenantRequest) returns (AdminPurgeTenantResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_DESTRUCTIVE;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:tenant:admin-purge"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "tenant.AdminPurgeTenant"
      request_context_required: true
      tenant_required: true
      tenant_field: "target_tenant_id"
      idempotency_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "admin_purge_tenant" rest_operation_id: "adminPurgeTenant"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "tenant"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_cli_scaffold) = {
      scaffold_package: "tenant"
      import_path: "udb/native/tenant"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
      generated_files: "udb.native.tenant.admin_purge_tenant.boilerplate"
      route_name: "admin_purge_tenant"
      middleware_name: "udb_tenant"
      required_native_services: "tenant"
      secret_placeholders: "UDB_API_KEY"
      smoke_test_command: "udb native smoke"
    };
    option (udb.core.common.v1.method_dependency_contract) = {
