// `udb:cache:<tenant>:<ns>:` prefix is stripped before it leaves the server).
message CacheItem {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "cache"
    generate_minimal_example: true
  };
  string key = 1;
  bytes value = 2;
  int64 ttl_remaining_seconds = 3;
}

message CreateNamespaceRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "cache"
    generate_minimal_example: true
