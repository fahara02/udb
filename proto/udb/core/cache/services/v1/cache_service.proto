  int64 max_bytes = 3;
  // Default TTL applied to a Set that does not specify one. 0 = no default.
  int64 default_ttl_seconds = 4;
}

message CreateNamespaceResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
