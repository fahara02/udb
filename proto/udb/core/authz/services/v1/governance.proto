// ── Progressive rollout: canary + metric-based auto-rollback ────────────────

// Activate a policy version to a CANARY scope (a subset of the fleet) rather
// than fleet-wide. The version is served only to in-scope nodes/tenants (or a
// percentage slice) while a metric-based evaluator watches the success window;
// it then either promotes fleet-wide, auto-rolls back on breach, or pauses on
// an inconclusive signal. Additive to the Phase-K activation surface.
message ActivateCanaryRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  GovernanceActor actor = 1;
  string policy_version_id = 2;
  udb.core.authz.entity.v1.CanaryScopeKind scope_kind = 3;
  // NODE/TENANT: explicit id list. PERCENT: a single value 1..=100.
  repeated string scope_values = 4;
  // Evaluator settings (zero = service defaults).
  int64 success_window_secs = 5;
  double metric_threshold = 6;
  int64 min_samples = 7;
  // Optimistic concurrency over the candidate version's own revision.
  int64 expected_revision = 8;
}

message CanaryResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  udb.core.authz.entity.v1.PolicyCanary canary = 1;
  udb.core.authz.entity.v1.PolicyVersion version = 2;
  udb.core.authz.entity.v1.PolicySet policy_set = 3;
}

// Promote a baked (within-threshold) canary to fleet-wide. Fails unless the
// canary is promote-eligible (ACTIVE and its success window has elapsed within
// threshold). On success the canaried version becomes the active version of its
// policy set fleet-wide and the canary moves to PROMOTED.
message PromoteCanaryRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  GovernanceActor actor = 1;
  string canary_id = 2;
  int64 expected_revision = 3;
}

message GetCanaryStatusRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  GovernanceActor actor = 1;
  string canary_id = 2;
}

message GetCanaryStatusResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  udb.core.authz.entity.v1.PolicyCanary canary = 1;
  // True when the success window has elapsed and the canary is ACTIVE within
  // threshold — i.e. PromoteCanary would succeed right now.
  bool promote_eligible = 2;
  // Seconds remaining in the success window (0 once elapsed).
  int64 window_remaining_secs = 3;
}

// ── Simulation / explain ───────────────────────────────────────────────────

message SimulationCase {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  Principal principal = 1;
  ResourceRef resource = 2;
  string action = 3;
  string purpose = 4;
  map<string, string> attributes = 5;
  // Optional label echoed in the result for batch correlation.
  string label = 6;
}

message SimulatePolicyRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  GovernanceActor actor = 1;
  string tenant_id = 2;
  string project_id = 3;
  // Draft to evaluate the candidate decision against (its document is loaded
  // in-memory). Empty + candidate set = simulate an ad-hoc document.
  string draft_id = 4;
  // Candidate authz inputs evaluated in-memory WITHOUT mutating durable state.
  PolicyDocument candidate = 5;
  // One or more cases to evaluate (single + batch share one shape).
  repeated SimulationCase cases = 6;
  // Persist a PolicySimulation row per case (impact-analysis record).
  bool persist = 7;
  // Optional draft version id to stamp on persisted PolicySimulation rows.
  string policy_version_id = 8;
}

message SimulationResult {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  string label = 1;
  Decision active_decision = 2;
  Decision draft_decision = 3;
  // True when active and draft decisions differ on `allowed`.
  bool changed = 4;
  string diff_json = 5;
}

message SimulatePolicyResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  repeated SimulationResult results = 1;
  // Aggregate machine-readable diff over all cases.
  string diff_json = 2;
}

message ExplainPolicyRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  GovernanceActor actor = 1;
  string tenant_id = 2;
  string project_id = 3;
  // Empty = explain against the active snapshot.
  string draft_id = 4;
  PolicyDocument candidate = 5;
  SimulationCase test_case = 6;
}

message ExplainPolicyResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  Decision decision = 1;
  // Ids of every policy that matched the request (post ABAC pre-filter).
  repeated string matched_policy_ids = 2;
  // Human-readable deny reason (empty on allow).
  string deny_reason = 3;
  // Per-matched-policy explanation lines.
  repeated string explanation = 4;
}

message ListPolicyVersionsRequest {
