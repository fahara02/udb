option csharp_namespace = "udb.core.Authz.Services.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/authz/services/v1;authzservicev1";
option java_package = "com.udb.core.authz.services.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Authz\\Services\\V1";
option php_namespace = "Udb\\Core\\Authz\\Services\\V1";

// The governance actor whose authorization is checked under
// `native.authz.governance` for every governance mutation. Carries the scopes
// the broker resolved for the caller so the service can require an explicit
// `authz:admin` / `authz:policy:write` / `authz:role:write` capability rather
// than trusting a bare bearer token.
message GovernanceActor {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  string subject = 1;
  string tenant_id = 2;
  string project_id = 3;
  repeated string scopes = 4;
  repeated string roles = 5;
  // Break-glass: when set, a short-TTL emergency bypass with a recorded reason.
  bool break_glass = 6;
  string break_glass_reason = 7;
  int64 break_glass_expires_at_unix = 8;
}

// A candidate policy document the governance APIs operate on (drafts and
// simulations). Unifies the full field richness of CreatePolicyRule and
// PutAuthzPolicy (role, purpose, relationship, priority, required scopes,
// conditions, tenant, project, domain) so every governed surface is parity.
message PolicyDocument {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  repeated AuthzPolicyRecord policies = 1;
  repeated RoleBinding role_bindings = 2;
  repeated RelationshipTuple relationship_tuples = 3;
}

message CreatePolicyDraftRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  GovernanceActor actor = 1;
  string tenant_id = 2;
  string project_id = 3;
  string policy_set_name = 4;
  string title = 5;
  string change_reason = 6;
  bool high_risk = 7;
  // Initial document. Empty + branch_from_active=true clones the active snapshot.
  PolicyDocument document = 8;
  bool branch_from_active = 9;
}

message PolicyDraftResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  udb.core.authz.entity.v1.PolicyDraft draft = 1;
  udb.core.authz.entity.v1.PolicySet policy_set = 2;
  // Document parsed back from the stored draft (convenience).
  PolicyDocument document = 3;
}

message UpdatePolicyDraftRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    server_only: true
    boilerplate_recipe_tags: "authz"
  };
  GovernanceActor actor = 1;
  string draft_id = 2;
  PolicyDocument document = 3;
  string change_reason = 4;
  // Optimistic concurrency: must equal the draft's current updated_at epoch.
  int64 expected_updated_at_unix = 5;
  bool high_risk = 6;
  string title = 7;
}

