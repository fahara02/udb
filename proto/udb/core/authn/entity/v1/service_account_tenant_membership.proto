syntax = "proto3";

package udb.core.authn.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "Udb.Core.Authn.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/authn/entity/v1;authnv1";
option java_package = "com.udb.core.authn.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Authn\\Entity\\V1";
option php_namespace = "Udb\\Core\\Authn\\Entity\\V1";

// ---------------------------------------------------------------------------
// ServiceAccountTenantMembership — an admin of a TARGET tenant lets a service
// account that lives in another (home) tenant act in the target tenant. The
// service account keeps exactly one typed grant in its home tenant; a
// membership adds no grant. Instead the account exchanges its home bearer for
// a short-lived target-tenant token (ExchangeServiceTokenForTenant) whose
// scopes are bounded by `approved_scopes_json`. Every such token is pinned to
// `membership_id` and `revision` and re-validated on every use, so revoking
// the membership, revoking the home grant or deactivating the account kills
// already-issued tokens. Only an admin of the target tenant creates, lists or
// revokes memberships; a home-tenant admin alone cannot. Rows are isolated by
// the target tenant.
// ---------------------------------------------------------------------------
message ServiceAccountTenantMembership {
  option (udb.core.common.v1.pg_table) = {
    table_name: "service_account_tenant_memberships"
    schema_name: "udb_authn"
    migration_order: 28
    is_table: true
    comment: "Target-tenant approvals letting a service account exchange its home bearer for a target-tenant token"
    soft_delete: false
    audit_fields: true
    enable_rls: true
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(target_tenant_id::text = current_setting('app.current_tenant_id', true)::text)"
      permissive: true
    }
    // One live membership per (service account, target tenant, target
    // project). Revoked and expired rows stay for audit and do not block a new
    // approval.
    indexes: {
      index_name: "idx_service_account_tenant_memberships_scope"
      index_type: "BTREE"
      columns: "user_id"
      columns: "target_tenant_id"
      columns: "target_project_id"
      unique: true
      where_clause: "status = 'ACTIVE'"
    }
    cdc_topic: "udb.authn.service_account_tenant_memberships.cdc"
    required_scope: "authn:grants:read"
    replica_hint: "primary"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "target_tenant_id"
    rls_policy_template: "target_tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "none"
    retention_class: "authn.policy"
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  // Server-assigned UUID identifying this membership.
  string membership_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "membership_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  // The service account (its user id, in its home tenant).
  string user_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "user_id" sql_type: "UUID" not_null: true comment: "FK to udb_authn.users.user_id" index: { index_name: "idx_service_account_tenant_memberships_user" index_type: "BTREE" } foreign_key: { references_table: "users" references_column: "user_id" references_schema: "udb_authn" on_delete: REFERENTIAL_ACTION_CASCADE } }];

  // The tenant the service account and its typed grant live in.
  string home_tenant_id = 3 [(udb.core.common.v1.pg_column) = { column_name: "home_tenant_id" sql_type: "VARCHAR(120)" not_null: true index: { index_name: "idx_service_account_tenant_memberships_home" index_type: "BTREE" } }];

  // The tenant whose admin approved the membership; tokens are minted here.
  string target_tenant_id = 4 [(udb.core.common.v1.pg_column) = { column_name: "target_tenant_id" tenant_column: true sql_type: "VARCHAR(120)" not_null: true index: { index_name: "idx_service_account_tenant_memberships_target" index_type: "BTREE" } }];

  // The project tokens are bound to inside the target tenant ('' = none).
  string target_project_id = 5 [(udb.core.common.v1.pg_column) = { column_name: "target_project_id" sql_type: "VARCHAR(255)" not_null: true default_value: "''" }];

  // Approved scopes (JSON array of strings): the most a target-tenant token
  // can carry. Admin/owner/wildcard scopes are rejected at write time and
  // again on every use.
  string approved_scopes_json = 6 [(udb.core.common.v1.pg_column) = { column_name: "approved_scopes_json" sql_type: "JSONB" is_json: true not_null: true default_value: "'[]'" }];

  // ACTIVE | REVOKED | EXPIRED. Only an ACTIVE, unexpired membership mints or
  // validates tokens.
  string status = 7 [(udb.core.common.v1.pg_column) = { column_name: "status" sql_type: "VARCHAR(20)" not_null: true default_value: "'ACTIVE'" index: { index_name: "idx_service_account_tenant_memberships_status" index_type: "BTREE" } }];

  // Incremented on every change (revoke). Issued tokens carry it and stop
  // validating once it moves.
  int64 revision = 8 [(udb.core.common.v1.pg_column) = { column_name: "revision" sql_type: "BIGINT" not_null: true default_value: "1" }];

  // The target-tenant administrator who approved (or last changed) the
  // membership, and why.
  string approved_by = 9 [(udb.core.common.v1.pg_column) = { column_name: "approved_by" sql_type: "VARCHAR(255)" not_null: true default_value: "''" }];
  string reason = 10 [(udb.core.common.v1.pg_column) = { column_name: "reason" sql_type: "VARCHAR(1024)" not_null: true default_value: "''" }];

  // Hard end of the membership: at most one year after approval. Tokens never
  // outlive it.
  google.protobuf.Timestamp expires_at = 11 [(udb.core.common.v1.pg_column) = { column_name: "expires_at" sql_type: "TIMESTAMPTZ" not_null: true }];

  google.protobuf.Timestamp created_at = 12 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "now()" }];
  google.protobuf.Timestamp updated_at = 13 [(udb.core.common.v1.pg_column) = { column_name: "updated_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "now()" }];
}
