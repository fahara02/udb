syntax = "proto3";

package udb.core.authn.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "Udb.Core.Authn.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/authn/entity/v1;authnv1";
option java_package = "com.udb.core.authn.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Authn\\Entity\\V1";
option php_namespace = "Udb\\Core\\Authn\\Entity\\V1";

// ---------------------------------------------------------------------------
// OidcLoginState — one pending "Sign in with <provider>" redirect.
// StartOidcLogin writes a row and sends the browser to the provider with the
// row's `state`, PKCE (S256) challenge and nonce. FinishOidcLogin consumes the
// row exactly once: the `state` returned by the provider selects it, the PKCE
// verifier goes to the token endpoint, the nonce must be inside the ID token.
// Rows live 10 minutes. Only a keyed hash of `state` is stored, and the PKCE
// verifier is sealed at rest, so a database reader cannot finish a sign-in.
// A row started for an invitation can only be redeemed by invitation
// acceptance, never by a plain FinishOidcLogin.
// ---------------------------------------------------------------------------
message OidcLoginState {
  option (udb.core.common.v1.pg_table) = {
    table_name: "oidc_login_states"
    schema_name: "udb_authn"
    migration_order: 30
    is_table: true
    comment: "Pending OIDC authorization-code sign-ins (state, PKCE verifier, nonce); single use, 10 minute lifetime"
    soft_delete: false
    audit_fields: false
    enable_rls: true
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true)::text)"
      permissive: true
    }
    indexes: {
      index_name: "idx_oidc_login_states_expires"
      index_type: "BTREE"
      columns: "expires_at"
    }
    cdc_topic: "udb.authn.oidc_login_states.cdc"
    required_scope: "authn:sessions:read"
    replica_hint: "primary"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "tenant_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "none"
    retention_class: "authn.operational"
    retention_days: 1
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  // Server-assigned UUID of this pending sign-in.
  string oidc_login_state_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "oidc_login_state_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  // Keyed HMAC of the `state` value sent to the provider; the lookup key on
  // the way back. The raw state is never stored.
  string state_hash = 2 [(udb.core.common.v1.pg_column) = { column_name: "state_hash" sql_type: "VARCHAR(128)" not_null: true unique: true comment: "Keyed HMAC digest of the OAuth state parameter" }, (udb.core.common.v1.sensitive) = true, (udb.core.common.v1.log_redacted) = true, (udb.core.common.v1.db_column_security) = { secret_classification: SECRET_CLASSIFICATION_TOKEN output_view: OUTPUT_VIEW_STORAGE_ONLY redaction_strategy: REDACTION_STRATEGY_REDACT hashing_algorithm: "hmac-sha256" encryption_key_class: "authn-token" uniqueness_scope: "global" }];

  // Tenant whose identity provider runs this sign-in.
  string tenant_id = 3 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" tenant_column: true sql_type: "VARCHAR(120)" not_null: true index: { index_name: "idx_oidc_login_states_tenant_id" index_type: "BTREE" } }];

  // The tenant's IdentityProvider (udb_idp.identity_providers.provider_id).
  string provider_id = 4 [(udb.core.common.v1.pg_column) = { column_name: "provider_id" sql_type: "UUID" not_null: true comment: "udb_idp.identity_providers.provider_id" }];

  // Exact redirect URI sent in the authorization request; the token request
  // must repeat it byte for byte.
  string redirect_uri = 5 [(udb.core.common.v1.pg_column) = { column_name: "redirect_uri" sql_type: "VARCHAR(2048)" not_null: true }];

  // OpenID nonce the ID token must carry.
  string nonce = 6 [(udb.core.common.v1.pg_column) = { column_name: "nonce" sql_type: "VARCHAR(128)" not_null: true }];

  // PKCE code_verifier (RFC 7636), sealed at rest; sent only to the token
  // endpoint.
  string code_verifier = 7 [(udb.core.common.v1.pg_column) = { column_name: "code_verifier" sql_type: "VARCHAR(1024)" not_null: true comment: "PKCE code_verifier, sealed at rest" }, (udb.core.common.v1.sensitive) = true, (udb.core.common.v1.log_redacted) = true, (udb.core.common.v1.encrypted_security) = true, (udb.core.common.v1.db_column_security) = { secret_classification: SECRET_CLASSIFICATION_TOKEN output_view: OUTPUT_VIEW_STORAGE_ONLY redaction_strategy: REDACTION_STRATEGY_REDACT encryption_key_class: "tenant" }];

  // Invitation this sign-in proves an identity for ('' = ordinary sign-in).
  string invitation_id = 8 [(udb.core.common.v1.pg_column) = { column_name: "invitation_id" sql_type: "VARCHAR(64)" not_null: true default_value: "''" }];

  // When the pending sign-in stops being redeemable (10 minutes after start).
  google.protobuf.Timestamp expires_at = 9 [(udb.core.common.v1.pg_column) = { column_name: "expires_at" sql_type: "TIMESTAMPTZ" not_null: true }];

  // Set when the row is redeemed; a consumed row is never redeemed again.
  google.protobuf.Timestamp consumed_at = 10 [(udb.core.common.v1.pg_column) = { column_name: "consumed_at" sql_type: "TIMESTAMPTZ" comment: "Set on the single redemption" }];

  google.protobuf.Timestamp created_at = 11 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true exclude_from_update: true }];
}
