syntax = "proto3";

package udb.core.authn.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "udb.core.Authn.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/authn/entity/v1;authnv1";
option java_package = "com.udb.core.authn.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Authn\\Entity\\V1";
option php_namespace = "Udb\\Core\\Authn\\Entity\\V1";

message WebAuthnCredential {
  option (udb.core.common.v1.pg_table) = {
    table_name: "webauthn_credentials"
    schema_name: "udb_authn"
    migration_order: 4
    is_table: true
    comment: "Server-side WebAuthn passkeys bound to UDB users"
    enable_rls: true
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true)::text)"
      permissive: true
    }
    required_scope: "authn:mfa:write"
    replica_hint: "primary"
  };

  string credential_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "credential_id" sql_type: "VARCHAR(512)" primary_key: true not_null: true }];
  string user_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "user_id" sql_type: "UUID" not_null: true foreign_key: { references_table: "users" references_schema: "udb_authn" references_column: "user_id" on_delete: REFERENTIAL_ACTION_CASCADE constraint_name: "fk_webauthn_credentials_user_id" } index: { index_name: "idx_webauthn_credentials_user" index_type: "BTREE" } }];
  string passkey_json = 3 [(udb.core.common.v1.pg_column) = { column_name: "passkey_json" sql_type: "JSONB" is_json: true not_null: true }, (udb.core.common.v1.sensitive) = true, (udb.core.common.v1.log_redacted) = true];
  string label = 4 [(udb.core.common.v1.pg_column) = { column_name: "label" sql_type: "VARCHAR(160)" }];
  string tenant_id = 5 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" sql_type: "VARCHAR(120)" not_null: true index: { index_name: "idx_webauthn_credentials_tenant" index_type: "BTREE" } }];
  string project_id = 6 [(udb.core.common.v1.pg_column) = { column_name: "project_id" sql_type: "VARCHAR(120)" }];
  google.protobuf.Timestamp created_at = 7 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true exclude_from_update: true }];
  google.protobuf.Timestamp updated_at = 8 [(udb.core.common.v1.pg_column) = { column_name: "updated_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true }];
  google.protobuf.Timestamp last_used_at = 9 [(udb.core.common.v1.pg_column) = { column_name: "last_used_at" sql_type: "TIMESTAMPTZ" }];
}

message WebAuthnChallenge {
  option (udb.core.common.v1.pg_table) = {
    table_name: "webauthn_challenges"
    schema_name: "udb_authn"
    migration_order: 5
    is_table: true
    comment: "Server-side WebAuthn ceremony state; never returned to clients"
    enable_rls: true
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true)::text)"
      permissive: true
    }
    required_scope: "authn:mfa:write"
    replica_hint: "primary"
  };

  string challenge_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "challenge_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];
  string user_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "user_id" sql_type: "UUID" not_null: true index: { index_name: "idx_webauthn_challenges_user" index_type: "BTREE" } }];
  string ceremony = 3 [(udb.core.common.v1.pg_column) = { column_name: "ceremony" sql_type: "VARCHAR(24)" not_null: true comment: "registration or authentication" }];
  string state_json = 4 [(udb.core.common.v1.pg_column) = { column_name: "state_json" sql_type: "JSONB" is_json: true not_null: true }, (udb.core.common.v1.sensitive) = true, (udb.core.common.v1.log_redacted) = true];
  string tenant_id = 5 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" sql_type: "VARCHAR(120)" not_null: true index: { index_name: "idx_webauthn_challenges_tenant" index_type: "BTREE" } }];
  string project_id = 6 [(udb.core.common.v1.pg_column) = { column_name: "project_id" sql_type: "VARCHAR(120)" }];
  google.protobuf.Timestamp expires_at = 7 [(udb.core.common.v1.pg_column) = { column_name: "expires_at" sql_type: "TIMESTAMPTZ" not_null: true index: { index_name: "idx_webauthn_challenges_expires" index_type: "BTREE" } }];
  google.protobuf.Timestamp consumed_at = 8 [(udb.core.common.v1.pg_column) = { column_name: "consumed_at" sql_type: "TIMESTAMPTZ" }];
  google.protobuf.Timestamp created_at = 9 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true exclude_from_update: true }];
}
