syntax = "proto3";

package udb.core.authn.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "udb.core.Authn.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/authn/entity/v1;authnv1";
option java_package = "com.udb.core.authn.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Authn\\Entity\\V1";
option php_namespace = "Udb\\Core\\Authn\\Entity\\V1";

// ---------------------------------------------------------------------------
// MfaPolicy — per-tenant MFA enforcement.
//
// Migration order 7. One row per tenant. When require_mfa is true, password-only
// login is rejected for that tenant's users until they enrol a second factor.
// ---------------------------------------------------------------------------
message MfaPolicy {
  option (udb.core.common.v1.pg_table) = {
    table_name: "mfa_policies"
    schema_name: "udb_authn"
    migration_order: 7
    is_table: true
    comment: "Per-tenant MFA enforcement policy"
    soft_delete: false
    audit_fields: false
    enable_rls: false
    replica_hint: "primary"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "tenant_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "none"
    retention_class: "authn.operational"
    retention_days: 2555
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  string policy_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "policy_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  string tenant_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" sql_type: "VARCHAR(120)" not_null: true index: { index_name: "idx_mfa_policies_tenant" index_type: "BTREE" unique: true } }];

  bool require_mfa = 3 [(udb.core.common.v1.pg_column) = { column_name: "require_mfa" sql_type: "BOOLEAN" not_null: true default_value: "false" comment: "When true, the tenant's users must enrol MFA before password login succeeds" }];

  google.protobuf.Timestamp created_at = 4 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true exclude_from_update: true }];

  google.protobuf.Timestamp updated_at = 5 [(udb.core.common.v1.pg_column) = { column_name: "updated_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" }];
}
