// ===========================================================================
// Phase L (Compliance Audit) — required security-sensitive authn events.
// Each carries the compliance-relevant fields (actor, outcome, reason,
// correlation/trace ids); credential material is never present.
// ===========================================================================

// Kafka topic: udb.authn.user.login.failed.v1
message LoginFailedEvent {
  option (udb.core.common.v1.message_event_contract) = {
    event_type: "udb.core.authn.events.v1.LoginFailedEvent"
    outbox_topic: "udb.authn.user.login.failed.v1"
    partition_key_field: "tenant_id"
    payload_redaction_profile: "standard"
    delivery_guarantee: "at_least_once"
    replay_compatibility: "stable"
  };
  string event_id = 1;
  string user_id = 2;
  string contact_address = 3; // masked identifier
  string tenant_id = 4;
  string project_id = 5;
  string reason_code = 6; // e.g. bad_password, unknown_user, mfa_required
  string auth_method = 7;
  string ip_address = 8; // masked
  string correlation_id = 9;
  google.protobuf.Timestamp occurred_at = 10;
}

