message LoginRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  string username = 1;
  string password = 2;
  udb.core.authn.entity.v1.DeviceType device_type = 3;
  string device_name = 4; // human-readable
  string ip_address = 5; // forwarded by gateway
  string user_agent = 6;
  string device_id = 7; // client device fingerprint (optional; for JWT device binding)

  // MFA step-2 fields — set on the second Login call after receiving mfa_required=true.
  // The password (first factor) is ALWAYS verified; these only supply the second
  // factor and never substitute for it. Provide totp_code for an authenticator app,
  // or mfa_otp_id plus the one-time code (carried in totp_code) for a LOGIN_2FA
  // email/SMS code previously issued to this same user.
  string mfa_otp_id = 8; // id of a LOGIN_2FA OTP issued to this user (email/SMS second factor)
  string totp_code = 9; // 6-digit TOTP code, or the one-time code when mfa_otp_id is set
  string tenant_hint = 10;
  string project_hint = 11;
  string access_surface = 12;
  string recovery_code = 13; // single-use MFA recovery/backup code (alternative second factor)

  // Passkey second factor (alternative to totp_code / mfa_otp_id / recovery_code).
  // After a Login answered mfa_required=true, call StartWebAuthnAuthentication with
  // the returned user_id, sign the options with the user's passkey, then re-call
  // Login with username + password + these two fields. The challenge must have been
  // issued for this same user and is single use.
  string webauthn_challenge_id = 14; // challenge_id from StartWebAuthnAuthentication
  string webauthn_assertion_json = 15; // the PublicKeyCredential assertion JSON from navigator.credentials.get()
}

message LoginResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  string user_id = 1;
  string session_id = 2;

  // JWT fields (only when device_type != WEB)
  string access_token = 3;
  string refresh_token = 4;
  int32 access_token_expires_in = 5; // seconds

  // Server-side session fields (only when device_type = WEB)
  // session_token returned to gateway which sets it as HttpOnly cookie
  string session_token = 6;
  string csrf_token = 7; // injected into a readable cookie

  bool mfa_required = 8; // true = client must re-call Login with password + second factor
  string mfa_otp_id = 9; // reserved for a future server-issued MFA challenge id (currently empty)

  // Absolute lifetime (seconds) of the rotating refresh token (field 4). The
  // refresh token is a token-family credential (rt_<family>.<jti>), rotated on
  // every RefreshToken call; reuse of a superseded value revokes the family.
  int32 refresh_token_expires_in = 10;

  // Stable, NON-SECRET public id of this login session (`sesspub_…`). Unlike
  // `session_id` (the session handle, a credential), it is safe to store and
  // log, and ValidateToken / RefreshToken report the same value for every token
  // of this session — use it to recognise "this device's" session.
  string session_public_id = 11;
}

message RefreshTokenRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  string refresh_token = 1;
  string session_id = 2;
}

message RefreshTokenResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  string access_token = 1;
  int32 access_token_expires_in = 2;

  // Rotated refresh token (token-family credential). Issued on every successful
  // refresh: the presented refresh token is single-use and is invalidated as the
  // new one is minted (atomic rotation). Empty when the caller refreshed with a
  // legacy server-side session id rather than a token-family credential.
  string refresh_token = 3;
  int32 refresh_token_expires_in = 4;
  // The refreshed session's stable public id (same value LoginResponse and
  // ValidateToken report); empty for a legacy session-id refresh.
  string session_public_id = 5;
}

