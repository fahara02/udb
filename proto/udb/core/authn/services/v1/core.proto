    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  string principal_id = 1;
  string subject = 2;
  string user_id = 3;
  string service_identity = 4;
  string tenant_id = 5;
  string project_id = 6;
  repeated string scopes = 7;
  repeated string roles = 8;
  string provider_id = 9;
  string auth_method = 10;
  int64 expires_at_unix = 11;
  udb.core.authn.entity.v1.AccountKind account_kind = 12;
  string domain = 13;
  map<string, string> attributes = 14;
  // Login name of the authenticated account, read from the live user row at
  // the moment of the call (never from a token claim), so a rename or
  // suspension is never served stale. Empty when the credential has no native
  // user row (external-IdP mapping, OIDC).
  string username = 15;
}

