// An authenticated caller, normalized to the claims UDB and project services
// need after token/session/API-key validation.
message Principal {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
