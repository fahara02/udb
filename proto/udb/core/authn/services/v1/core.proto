// ============================================================
// Token validation (called by API gateway and service interceptors)
// ============================================================

message ValidateTokenRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  string token = 1; // raw JWT or session_token
  udb.core.authn.entity.v1.TokenType token_type = 2;
}

message ValidateTokenResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  bool valid = 1;
  string user_id = 2;
  // The raw session handle, only for a token minted directly by a login. A
  // token refreshed from a refresh-token family returns it empty: the broker
  // keeps only a hash of the session. Use session_public_id to identify the
  // session across refreshes.
  string session_id = 3;
  udb.core.authn.entity.v1.AccountKind account_kind = 4;
  string tenant_id = 5;
  // Resolved roles (from authz domain)
  repeated string roles = 6;
  google.protobuf.Timestamp expires_at = 7;
  string access_surface = 8;
  string device_id = 9; // device fingerprint (JWT sessions only)
  string token_id = 10; // JWT jti (JWT sessions) or session_token SHA256 prefix
  udb.core.authn.entity.v1.SessionType session_type = 11;
  Principal principal = 12;
  string project_id = 13;
  repeated string scopes = 14;
  map<string, string> attributes = 15;
  // Stable, NON-SECRET public id of the login session this token belongs to
  // (`sesspub_…`). Identical for the login token and every token refreshed from
  // it, and equal to LoginResponse.session_public_id; empty for tokens not
  // minted from a login session (API-key exchange, service accounts).
  string session_public_id = 16;
  // JWTs only. Assurance level the token states: `aal2` after a second factor
  // or a passkey, else `aal1`. Empty for sessions, API keys and tokens minted
  // before 0.6.6 by external issuers that omit it.
  string acr = 17;
  // JWTs only. How the user authenticated (RFC 8176 values such as `pwd`,
  // `otp`, `sms`, plus `webauthn` for a passkey and `fed` for an OIDC
  // provider). Empty for refreshed tokens: a refresh does not re-authenticate.
  repeated string amr = 18;
  // JWTs only. Unix seconds when the user authenticated; 0 when the token
  // does not say (refreshed tokens, API-key exchange, service accounts).
  int64 auth_time = 19;
  // Set only when `token` is a step-up token from VerifyMfaChallenge: the
  // action it was minted for. Such a token carries no scopes; use
  // CheckStepUp to enforce it.
  string step_up_action = 20;
}

// ============================================================
