  udb.core.authn.entity.v1.DeviceType device_type = 3;
  string device_name = 4; // human-readable
  string device_id = 5; // client device fingerprint (optional; for JWT device binding)
  string ip_address = 6; // forwarded by gateway
  string user_agent = 7;
  string access_surface = 8;
