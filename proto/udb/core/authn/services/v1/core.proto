// ============================================================

message CreateUserRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  string username = 1;
  string email = 2;
  string password = 3; // Min 10 chars; 1 upper, 1 lower, 1 digit, 1 special
  string tenant_id = 4;
  string full_name = 5;
  udb.core.common.v1.RequestContext context = 6;
  udb.core.authn.entity.v1.AccountKind account_kind = 7;
  string project_id = 8;
  // Stable public IdP provider id. Caller-chosen format is provider-specific,
  // bounded to 120 characters by the user store, and scoped by tenant.
  string external_provider_id = 9;
  string external_subject = 10;
  map<string, string> profile_attributes = 11;
  // Invite instead of register: leave `password` empty. The account is created
  // in USER_STATUS_PASSWORD_SETUP_REQUIRED with no usable password and a
  // password-reset code is sent to `email`; the user sets a password with
  // ResetPassword(otp_id, code, new_password), which activates the account.
  // `CreateUserResponse.otp_id` is that reset code's id.
  bool password_setup_required = 12;
  // E.164 phone number (`+` then 7 to 15 digits). A username plus `email` or
  // `phone` (or both) is required. With `phone` and no `email` the account is
  // phone-only: its verification code (or, for an invite, its password-reset
  // code) is sent by SMS, and VerifyOTP on that code activates it. A phone-only
  // CreateUser is refused (FAILED_PRECONDITION, `sms_delivery_unavailable`)
  // unless SMS can be delivered: a NotificationService with SMS templates or
  // UDB_OTP_DELIVERY_WEBHOOK_URL. With both, the phone is stored unverified.
  string phone = 13;
  // The language of this account's messages (auth codes, magic links), as a
  // BCP 47 tag such as `bn` or `en-US`; empty = English.
  string locale = 14;
}

message CreateUserResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
