    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  string challenge_id = 1;
  string public_key_credential_json = 2;
  udb.core.common.v1.RequestContext context = 3;
  // Optional client details recorded on the session and device list, like Login.
  string device_name = 4; // human-readable device name
  string ip_address = 5; // forwarded by the gateway
  string user_agent = 6;
  string device_id = 7; // client device fingerprint (registers the device for ListDevices)
}

message FinishWebAuthnAuthenticationResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "authn"
    generate_minimal_example: true
  };
  Principal principal = 1;
  string session_id = 2;
  string access_token = 3;
  int64 expires_at_unix = 4; // when access_token expires (unix seconds)
  string credential_id = 5;

  // A passkey sign-in returns the same credentials as Login (fields below).
  // Rotating refresh token (rt_<family>.<jti>) for RefreshToken; empty for
  // service accounts.
  string refresh_token = 6;
  int32 access_token_expires_in = 7; // seconds
  int32 refresh_token_expires_in = 8; // absolute lifetime of refresh_token, seconds
  string session_token = 9; // server-side session handle (WEB: set as an HttpOnly cookie)
  string csrf_token = 10; // double-submit CSRF token bound to this session
  // Stable non-secret session id (`sesspub_…`), as Login / ValidateToken report it.
  string session_public_id = 11;
  // The signed-in user (on a usernameless sign-in, the user the passkey belongs to).
  string user_id = 12;
}

