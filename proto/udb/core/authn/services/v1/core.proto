  option (udb.core.common.v1.message_sdk_surface) = { include_in_facade: true required_credential_provider: "udb" default_deadline_ms: 30000 default_max_attempts: 3 server_only: true boilerplate_recipe_tags: "authn" generate_minimal_example: true };
