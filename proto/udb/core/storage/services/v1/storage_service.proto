  // Finalize an upload after the object has been written to the store
  rpc FinalizeUpload(FinalizeUploadRequest) returns (FinalizeUploadResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    // Verified: storage_service::finalize_upload transitions the File from
    // PENDING to ACTIVE (status set to 'ACTIVE'); a re-finalize of an already
    // ACTIVE file is rejected with ALREADY_FINALIZED, so PENDING is the only
    // legal source state. The uploaded object bytes are consumed (HEAD-checked)
    // as part of the transition. ACTIVE is the steady terminal of this RPC.
    option (udb.core.common.v1.method_lifecycle_contract) = {
      entity: "File"
      legal_source_states: "PENDING"
      target_state: "ACTIVE"
      terminal_states: "ACTIVE"
      input_consumed: true
    };
    // Verified: finalize_upload re-reads and returns the finalized File row
    // in-band (FinalizeUploadResponse.file), and the same row is gettable by
    // GetFile(file_id). Primary read.
    option (udb.core.common.v1.method_readback_contract) = {
      readback_rpc: "GetFile"
      readback_request_field: "file_id"
      requires_primary_read: true
    };
    // Verified against the status_with_reason(...) call sites in
    // storage_service::finalize_upload — every code below is emitted with the
    // listed gRPC status and the canonical_code carried in the error-reason
    // trailer. None are server-retryable (a retry would hit the same condition).
    option (udb.core.common.v1.method_error_contract) = {
      cases: { canonical_code: "STORAGE_QUOTA_EXCEEDED" grpc_status: "RESOURCE_EXHAUSTED" retryable: false }
      cases: { canonical_code: "ALREADY_FINALIZED" grpc_status: "FAILED_PRECONDITION" retryable: false }
      cases: { canonical_code: "OBJECT_NOT_PRESENT" grpc_status: "FAILED_PRECONDITION" retryable: false }
      cases: { canonical_code: "UPLOAD_SIZE_MISMATCH" grpc_status: "FAILED_PRECONDITION" retryable: false }
    };
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:storage:finalize-upload"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "storage.FinalizeUpload"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "finalize_upload"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "storage"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_cli_scaffold) = {
      scaffold_package: "storage"
      import_path: "udb/native/storage"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
      generated_files: "udb.native.storage.finalize_upload.boilerplate"
      route_name: "finalize_upload"
      middleware_name: "udb_storage"
      required_native_services: "storage"
      secret_placeholders: "UDB_API_KEY"
      smoke_test_command: "udb native smoke"
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "storage"
      required_backends: "postgres"
      required_backends: "object_store"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "storage.FinalizeUpload"
      outbox_topic: "storage.events"
      partition_key_field: "tenant_id"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
      emits: { topic: "udb.storage.file.finalized.v1" partition_key_field: "file_id" delivery_guarantee: "at_least_once" payload_redaction_profile: "standard" conditional: true }
    };
