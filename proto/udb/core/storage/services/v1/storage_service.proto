    // PENDING) via native_entity_write_for_service BEFORE the response is built,
    // and GetFile reads the live row by (tenant_id, file_id). The returned
    // file_id is therefore immediately gettable. Primary read (no replica lag).
    option (udb.core.common.v1.method_readback_contract) = {
      returned_id_field: "file_id"
      readback_rpc: "GetFile"
      readback_request_field: "file_id"
      requires_primary_read: true
    };
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:storage:register-upload"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "storage.RegisterUpload"
      request_context_required: true
      tenant_required: true
    };
