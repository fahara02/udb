syntax = "proto3";

package udb.core.vault.services.v1;

import "google/api/annotations.proto";
import "udb/core/common/v1/dto.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "udb.core.Vault.Services.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/vault/services/v1;vaultservicev1";
option java_package = "com.udb.core.vault.services.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Vault\\Services\\V1";
option php_namespace = "Udb\\Core\\Vault\\Services\\V1";

// VaultService (master-plan 9.1, flagship) — secrets management built into the
// broker. Three engines, one crypto stack (the broker AES-256-GCM-SIV envelope,
// reused from `runtime::encryption`):
//   * KV       — versioned, envelope-encrypted secrets at hierarchical paths
//                with compare-and-swap, soft delete, and crypto-shred destroy.
//   * Transit  — encrypt/decrypt/sign/verify/hmac by key NAME; key material is
//                never exported; versioned keys with ACTIVE/VERIFYING rotation.
//   * Seal     — every handler fails closed (failed_precondition) when the
//                master key is unavailable; SealStatus reports the seal state.
// The sensitive reads (GetSecret, Decrypt) are audited via the outbox compliance
// envelope. Dynamic database credentials are a declared follow-up.
service VaultService {
  option (udb.core.common.v1.native_service) = {
    service_id: "vault"
    logical_service_id: "vault"
    proto_service_id: "vault"
    display_name: "Vault"
    category: "vault"
    default_enabled: true
    requires_postgres: true
    control_plane_listener_allowed: true
    sdk_facade_name: "vault"
    cli_scaffold_group: "vault"
    health_check_ref: "vault"
    capability_ref: "native.vault"
  };
  option (udb.core.common.v1.service_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "vault"
    generate_minimal_example: true
  };
  option (udb.core.common.v1.service_cli_scaffold) = {
    scaffold_package: "vault"
    import_path: "udb/native/vault"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
    generated_files: "udb.native.vault.config"
    required_native_services: "vault"
    secret_placeholders: "UDB_API_KEY"
    smoke_test_command: "udb native lint"
  };
  option (udb.core.common.v1.service_dependency_contract) = {
    required_native_services: "vault"
    required_backends: "postgres"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
  };

  // ── KV engine ─────────────────────────────────────────────────────────────

  // Write a new secret version. Compare-and-swap: `expected_version` must equal
  // the current latest version (0 for a brand-new path) or the write is rejected.
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:vault:put-secret"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "vault.PutSecret"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "put_secret" rest_operation_id: "putSecret"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "vault"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "vault"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "vault.PutSecret"
      outbox_topic: "udb.vault.secret.put.v1"
      partition_key_field: "secret_path"
      payload_redaction_profile: "strict"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/vault/secrets:put"
      body: "*"
    };
  }

  // Read the secret value (latest active version, or a specific version). This
  // is the sensitive vault read: it is AUDITED via the outbox compliance envelope.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:vault:get-secret"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "vault.GetSecret"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "get_secret" rest_operation_id: "getSecret"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "vault"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "vault"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "vault.GetSecret"
      outbox_topic: "udb.vault.secret.accessed.v1"
      partition_key_field: "secret_path"
      payload_redaction_profile: "strict"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {get: "/v1/vault/secrets/{secret_path=**}"};
  }

  // List secret paths under an optional prefix. Returns metadata only — NEVER
  // any secret value.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:vault:list-secrets"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "vault.ListSecrets"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "list_secrets" rest_operation_id: "listSecrets"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "vault"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "vault"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "vault.ListSecrets"
      outbox_topic: "udb.vault.secret.listed.v1"
      partition_key_field: "tenant_id"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {get: "/v1/vault/secrets"};
  }

  // Soft-delete the latest version (recoverable bookkeeping state). The ciphertext
  // is retained; use DestroySecret to crypto-shred.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:vault:delete-secret"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "vault.DeleteSecret"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "delete_secret" rest_operation_id: "deleteSecret"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "vault"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "vault"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
