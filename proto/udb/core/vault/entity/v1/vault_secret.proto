syntax = "proto3";

package udb.core.vault.entity.v1;

import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "udb.core.Vault.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/vault/entity/v1;vaultv1";
option java_package = "com.udb.core.vault.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Vault\\Entity\\V1";
option php_namespace = "Udb\\Core\\Vault\\Entity\\V1";

// ---------------------------------------------------------------------------
// VaultSecret — one VERSION of a hierarchical KV secret (master-plan 9.1).
//
// Envelope encryption: the secret VALUE is sealed under a per-secret random
// data-encryption key (DEK) with the SAME `aes_gcm_siv` primitive the broker
// already uses (`runtime::encryption`); the DEK itself is wrapped by the master
// key-encryption key via `DataBrokerRuntime::encrypt_secret_at_rest`. Only the
// two ciphertext columns are stored — `ciphertext` (value sealed by the DEK)
// and `data_key_wrapped` (the DEK sealed by the master KEK). Neither cleartext
// values nor unwrapped DEKs ever touch the row. Both carry
// OUTPUT_VIEW_STORAGE_ONLY (copied from `session.session_token_hash`) so the
// generated read/redaction surface never returns them. RLS scopes rows to the
// current tenant. A logical secret at `tenant/<t>/app/<path>` has many version
// rows; CAS is enforced on (tenant_id, secret_path, version).
// ---------------------------------------------------------------------------
message VaultSecret {
  option (udb.core.common.v1.pg_table) = {
    table_name: "vault_secrets"
    schema_name: "udb_vault"
    migration_order: 1
    is_table: true
    comment: "Versioned, envelope-encrypted KV secrets (master-plan 9.1)"
    soft_delete: false
    audit_fields: true
    enable_rls: true
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true)::text)"
      permissive: true
    }
    indexes: {
      index_name: "idx_vault_secrets_tenant_path_version_unique"
      index_type: "BTREE"
      unique: true
      columns: "tenant_id"
      columns: "secret_path"
      columns: "version"
    }
    indexes: {
      index_name: "idx_vault_secrets_tenant_path"
      index_type: "BTREE"
      columns: "tenant_id"
      columns: "secret_path"
    }
    cdc_topic: "udb.vault.vault_secrets.cdc"
    required_scope: "vault:read"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "tenant_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "none"
    retention_class: "vault.operational"
    retention_days: 2555
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  string secret_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "secret_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  string tenant_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" tenant_column: true sql_type: "VARCHAR(64)" not_null: true index: { index_name: "idx_vault_secrets_tenant" index_type: "BTREE" } }];

  // Application-relative hierarchical path (`app/<path>`); the tenant prefix is
  // the separate `tenant_id` column, never embedded here from the request body.
  string secret_path = 3 [(udb.core.common.v1.pg_column) = { column_name: "secret_path" sql_type: "VARCHAR(512)" not_null: true }];

  // Monotone version number per (tenant_id, secret_path). Each PutSecret writes
  // a new version; CAS uses the prior version as the expected guard.
  int32 version = 4 [(udb.core.common.v1.pg_column) = { column_name: "version" sql_type: "INTEGER" not_null: true default_value: "1" }];

  // The secret VALUE sealed under the per-secret DEK (AES-256-GCM-SIV envelope).
  // STORAGE_ONLY: never surfaced by the generated read/redaction layer.
  string ciphertext = 5 [(udb.core.common.v1.pg_column) = { column_name: "ciphertext" sql_type: "TEXT" not_null: true comment: "Secret value sealed under the per-secret DEK" }, (udb.core.common.v1.sensitive) = true, (udb.core.common.v1.log_redacted) = true, (udb.core.common.v1.db_column_security) = { secret_classification: SECRET_CLASSIFICATION_TOKEN output_view: OUTPUT_VIEW_STORAGE_ONLY redaction_strategy: REDACTION_STRATEGY_REDACT encryption_key_class: "vault-data" uniqueness_scope: "tenant" }];

  // The per-secret DEK wrapped by the master KEK (envelope key wrapping). On
  // DestroySecret this is cleared so the value is cryptographically shredded.
  string data_key_wrapped = 6 [(udb.core.common.v1.pg_column) = { column_name: "data_key_wrapped" sql_type: "TEXT" not_null: true comment: "Per-secret DEK wrapped by the master KEK" }, (udb.core.common.v1.sensitive) = true, (udb.core.common.v1.log_redacted) = true, (udb.core.common.v1.db_column_security) = { secret_classification: SECRET_CLASSIFICATION_TOKEN output_view: OUTPUT_VIEW_STORAGE_ONLY redaction_strategy: REDACTION_STRATEGY_REDACT encryption_key_class: "vault-kek" uniqueness_scope: "tenant" }];

  // ACTIVE | DELETED (soft) | DESTROYED (value shredded, irreversible).
  string state = 7 [(udb.core.common.v1.pg_column) = { column_name: "state" sql_type: "VARCHAR(20)" not_null: true default_value: "'ACTIVE'" index: { index_name: "idx_vault_secrets_state" index_type: "BTREE" } }];

  string metadata_json = 8 [(udb.core.common.v1.pg_column) = { column_name: "metadata_json" sql_type: "JSONB" is_json: true not_null: true default_value: "'{}'::jsonb" comment: "Non-secret metadata for audit and routing" }];
}
