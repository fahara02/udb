syntax = "proto3";

package udb.core.vault.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "udb.core.Vault.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/vault/entity/v1;vaultv1";
option java_package = "com.udb.core.vault.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Vault\\Entity\\V1";
option php_namespace = "Udb\\Core\\Vault\\Entity\\V1";

// ---------------------------------------------------------------------------
// VaultDbCredentialLease — one short-lived database login minted by Vault.
//
// The password is returned only in GenerateDatabaseCredentialsResponse. A
// master-KEK-wrapped recovery envelope is stored so an authenticated replay of
// the same idempotent request can recover the original one-time response without
// creating a second login. The durable STARTING/ACTIVE/REVOKING/REVOKED/FAILED
// state machine lets WORKER_VAULT_LEASE_REAPER reconcile every split boundary.
// RLS scopes rows to the current tenant and project.
// ---------------------------------------------------------------------------
message VaultDbCredentialLease {
  option (udb.core.common.v1.pg_table) = {
    table_name: "vault_db_credential_leases"
    schema_name: "udb_vault"
    migration_order: 3
    is_table: true
    comment: "Short-lived database credentials minted by Vault (master-plan 9.1)"
    soft_delete: false
    audit_fields: true
    enable_rls: true
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true)::text AND project_id::text = current_setting('app.current_project_id', true)::text)"
      permissive: true
    }
    indexes: {
      index_name: "idx_vault_db_credential_leases_username_unique"
      index_type: "BTREE"
      unique: true
      columns: "username"
    }
    indexes: {
      index_name: "idx_vault_db_credential_leases_tenant_role"
      index_type: "BTREE"
      columns: "tenant_id"
      columns: "project_id"
      columns: "role_name"
    }
    indexes: {
      index_name: "idx_vault_db_credential_leases_idempotency_unique"
      index_type: "BTREE"
      unique: true
      columns: "tenant_id"
      columns: "project_id"
      columns: "idempotency_key"
      where_clause: "idempotency_key <> ''"
    }
    indexes: {
      index_name: "idx_vault_db_credential_leases_expiry"
      index_type: "BTREE"
      columns: "state"
      columns: "expires_at"
    }
    cdc_topic: "udb.vault.db_credential_leases.cdc"
    required_scope: "vault:read"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    project_isolation_mode: "project"
    tenant_column: "tenant_id"
    project_column: "project_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id') AND project_id = current_setting('app.current_project_id')"
    soft_delete_mode: "none"
    retention_class: "vault.operational"
    retention_days: 90
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  string lease_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "lease_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  string tenant_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" tenant_column: true sql_type: "VARCHAR(64)" not_null: true index: { index_name: "idx_vault_db_credential_leases_tenant" index_type: "BTREE" } }];

  // Operator-configured alias from UDB_VAULT_DB_ROLES_JSON.
  string role_name = 3 [(udb.core.common.v1.pg_column) = { column_name: "role_name" sql_type: "VARCHAR(128)" not_null: true }];

  // Generated login role. Password is never persisted.
  string username = 4 [(udb.core.common.v1.pg_column) = { column_name: "username" sql_type: "VARCHAR(63)" not_null: true }];

  // Existing Postgres role granted to the generated login.
  string parent_role = 5 [(udb.core.common.v1.pg_column) = { column_name: "parent_role" sql_type: "VARCHAR(63)" not_null: true }];

  string backend = 6 [(udb.core.common.v1.pg_column) = { column_name: "backend" sql_type: "VARCHAR(32)" not_null: true default_value: "'postgres'" }];

  google.protobuf.Timestamp issued_at = 7 [(udb.core.common.v1.pg_column) = { column_name: "issued_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" }];

  google.protobuf.Timestamp expires_at = 8 [(udb.core.common.v1.pg_column) = { column_name: "expires_at" sql_type: "TIMESTAMPTZ" not_null: true }];

  google.protobuf.Timestamp revoked_at = 9 [(udb.core.common.v1.pg_column) = { column_name: "revoked_at" sql_type: "TIMESTAMPTZ" }];

  // STARTING | ACTIVE | REVOKING | REVOKED | FAILED. Every non-terminal state,
  // plus FAILED rows with a pending revocation, is owned by the reconciliation
  // worker. REVOKED is set only after session termination and role-absence proof.
  string state = 10 [(udb.core.common.v1.pg_column) = { column_name: "state" sql_type: "VARCHAR(20)" not_null: true default_value: "'STARTING'" }];

  string metadata_json = 11 [(udb.core.common.v1.pg_column) = { column_name: "metadata_json" sql_type: "JSONB" is_json: true not_null: true default_value: "'{}'::jsonb" comment: "Non-secret issuance metadata for audit and routing" }];

  string project_id = 12 [(udb.core.common.v1.pg_column) = { column_name: "project_id" project_column: true sql_type: "VARCHAR(255)" not_null: true default_value: "'default'" }];

  // Caller-supplied idempotency key. Its unique scope is tenant+project so a
  // response-loss replay can never mint a second physical login.
  string idempotency_key = 13 [(udb.core.common.v1.pg_column) = { column_name: "idempotency_key" sql_type: "VARCHAR(128)" not_null: true default_value: "''" }];

  // Hash of every authority-relevant issuance input; the same idempotency key
  // with different inputs is a conflict, never a replay.
  string request_hash = 14 [(udb.core.common.v1.pg_column) = { column_name: "request_hash" sql_type: "VARCHAR(128)" not_null: true default_value: "''" }];

  // Password encrypted by the broker's master KEK. STORAGE_ONLY ensures it can
  // only be selected by the trusted recovery path and never appears in normal
  // entity/SDK output, logs, CDC payloads, or audit events.
  string credential_ciphertext = 15 [(udb.core.common.v1.pg_column) = { column_name: "credential_ciphertext" sql_type: "TEXT" not_null: true default_value: "''" comment: "Master-KEK-wrapped recovery envelope for idempotent response replay" }, (udb.core.common.v1.sensitive) = true, (udb.core.common.v1.log_redacted) = true, (udb.core.common.v1.db_column_security) = { secret_classification: SECRET_CLASSIFICATION_CREDENTIAL output_view: OUTPUT_VIEW_STORAGE_ONLY redaction_strategy: REDACTION_STRATEGY_REDACT encryption_key_class: "vault-db" uniqueness_scope: "none" }];

  // Immutable physical authority selected at issuance. Reconciliation must use
  // this exact instance and fails closed if it is no longer routable.
  string target_instance = 16 [(udb.core.common.v1.pg_column) = { column_name: "target_instance" sql_type: "VARCHAR(255)" not_null: true default_value: "''" }];

  string last_error = 17 [(udb.core.common.v1.pg_column) = { column_name: "last_error" sql_type: "TEXT" not_null: true default_value: "''" }];
  string revoke_reason = 18 [(udb.core.common.v1.pg_column) = { column_name: "revoke_reason" sql_type: "TEXT" not_null: true default_value: "''" }];
  string revocation_operation_id = 19 [(udb.core.common.v1.pg_column) = { column_name: "revocation_operation_id" sql_type: "UUID" }];
  google.protobuf.Timestamp revocation_requested_at = 20 [(udb.core.common.v1.pg_column) = { column_name: "revocation_requested_at" sql_type: "TIMESTAMPTZ" }];
}
