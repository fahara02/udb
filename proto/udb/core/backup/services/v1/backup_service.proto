// BackupService (master-plan 9.10) — tenant-level logical backup and restore.
// A backup enumerates the tenant's owned tables via the SAME shared resolver the
// purge ripple uses, streams each table's tenant rows as JSONL, encrypts them at
// rest, and writes them plus a checksummed manifest to object storage. Tables
// without a resolvable tenant column are REPORTED as excluded, never silently
// skipped. A restore validates the cross-tenant movement scope, refuses to write
// over a live (non-empty) target tenant, and rewrites the tenant column to the
// target on insert.
service BackupService {
  option (udb.core.common.v1.native_service) = {
    service_id: "backup"
    logical_service_id: "backup"
    proto_service_id: "backup"
    display_name: "Backup"
    category: "backup"
    default_enabled: true
    requires_postgres: true
    control_plane_listener_allowed: true
    sdk_facade_name: "backup"
    cli_scaffold_group: "backup"
    health_check_ref: "backup"
    capability_ref: "native.backup"
  };
  option (udb.core.common.v1.service_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "backup"
    generate_minimal_example: true
  };
  option (udb.core.common.v1.service_cli_scaffold) = {
    scaffold_package: "backup"
    import_path: "udb/native/backup"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
    generated_files: "udb.native.backup.config"
    required_native_services: "backup"
    secret_placeholders: "UDB_API_KEY"
    smoke_test_command: "udb native lint"
  };
  option (udb.core.common.v1.service_dependency_contract) = {
    required_native_services: "backup"
    required_backends: "postgres"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
  };

  // Start a logical backup of the calling tenant. Enumerates tenant-owned tables
  // via the shared resolver, encrypts each table's rows to object storage, and
  // journals the run. Tenant-less tables are reported as excluded.
  rpc StartTenantBackup(StartTenantBackupRequest) returns (StartTenantBackupResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:backup:start-tenant-backup"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "backup.StartTenantBackup"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "start_tenant_backup" rest_operation_id: "startTenantBackup"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "backup"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "backup"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "backup.StartTenantBackup"
      outbox_topic: "udb.backup.run.completed.v1"
      partition_key_field: "tenant_id"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/backups:start"
      body: "*"
    };
  }

  // Restore a tenant's backup into a FRESH target tenant. DESTRUCTIVE: requires
  // an explicit confirmation token, the cross-tenant movement scope check, and a
  // target tenant that holds no rows (restoring over a live tenant is refused).
