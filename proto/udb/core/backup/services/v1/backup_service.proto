// ── Shared detail messages ───────────────────────────────────────────────────

// One backed-up tenant table: where its encrypted JSONL artifact lives and its
// integrity anchor.
message BackupTableEntry {
  string schema = 1;
  string table = 2;
  string tenant_column = 3;
  string object_key = 4;
  int64 row_count = 5;
  string checksum_sha256 = 6;
}

// A table excluded from the backup because it has no resolvable tenant column.
// Reported, never silently skipped.
message BackupExcludedTable {
  string schema = 1;
  string table = 2;
  string reason = 3;
}

// A backup/restore journal row.
message BackupRunSummary {
  string backup_id = 1;
  string tenant_id = 2;
  string kind = 3;
  string status = 4;
  string object_prefix = 5;
  string manifest_checksum = 6;
  int32 table_count = 7;
  int64 total_rows = 8;
  int32 excluded_count = 9;
  string source_tenant_id = 10;
  string target_tenant_id = 11;
  int64 created_at_unix = 12;
  int64 completed_at_unix = 13;
}

// A backup retention/schedule policy.
message BackupPolicyView {
  string policy_id = 1;
  string tenant_id = 2;
  string policy_name = 3;
  string schedule_cron = 4;
  int32 retention_days = 5;
  int32 max_retained_backups = 6;
  bool enabled = 7;
  string object_backend = 8;
  string object_bucket = 9;
  int64 created_at_unix = 10;
  int64 updated_at_unix = 11;
}

// ── Request / response envelopes ─────────────────────────────────────────────

message StartTenantBackupRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
