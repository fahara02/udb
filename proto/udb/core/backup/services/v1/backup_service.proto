    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "backup"
    generate_minimal_example: true
  };
  // The tenant whose backup is the source.
  string source_tenant_id = 1;
  // The FRESH tenant the rows are restored INTO. Verified against the claim; an
  // existing (non-empty) tenant is refused.
  string target_tenant_id = 2;
  // The backup run id to restore (resolved to its object prefix).
  string backup_id = 3;
  // Required explicit confirmation token (DESTRUCTIVE).
  string confirmation_token = 4;
  // When the target differs from the source this must be set: a cross-tenant
  // restore needs explicit privileged approval (fail closed otherwise).
  bool allow_cross_tenant = 5;
  string metadata_json = 6;
}

