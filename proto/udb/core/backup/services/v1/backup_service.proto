    boilerplate_recipe_tags: "backup"
    generate_minimal_example: true
  };
  // Verified against the bearer/claim tenant; cross-tenant values are rejected.
  string tenant_id = 1;
  // Optional policy name whose object backend/bucket are used when set.
  string policy_name = 2;
  // Optional object-store overrides; fall back to the policy or service default.
  string object_backend = 3;
  string object_bucket = 4;
  string metadata_json = 5;
}

message StartTenantBackupResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "backup"
    generate_minimal_example: true
  };
  string backup_id = 1;
  string object_prefix = 2;
  string manifest_checksum = 3;
  int32 table_count = 4;
  int64 total_rows = 5;
  int32 excluded_count = 6;
  repeated BackupTableEntry tables = 7;
  repeated BackupExcludedTable excluded = 8;
  string message = 9;
  udb.core.common.v1.ApiError error = 10;
}

message RestoreTenantRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
