    server_only: true
    boilerplate_recipe_tags: "backup"
    generate_minimal_example: true
  };
  // The restore journal row id.
  string backup_id = 1;
  string source_object_prefix = 2;
  int32 restored_table_count = 3;
  int64 restored_rows = 4;
  string message = 5;
  udb.core.common.v1.ApiError error = 6;
}

