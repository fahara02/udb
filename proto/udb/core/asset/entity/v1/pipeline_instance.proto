syntax = "proto3";

package udb.core.asset.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";
import "udb/core/common/v1/types.proto";
import "udb/core/asset/entity/v1/enums.proto";

option csharp_namespace = "udb.core.Asset.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/asset/entity/v1;assetv1";
option java_package = "com.udb.core.asset.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Asset\\Entity\\V1";
option php_namespace = "Udb\\Core\\Asset\\Entity\\V1";

// PipelineInstance is a single execution of a PipelineDefinition against an Asset.
message PipelineInstance {
  option (udb.core.common.v1.pg_table) = {
    table_name: "pipeline_instances"
    schema_name: "udb_asset"
    migration_order: 3
    is_table: true
    soft_delete: false
    audit_fields: true
    enable_rls: true
    force_rls: true
    rls_policies: {
      policy_name: "pipeline_instances_tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true) OR current_setting('app.platform_admin', true) = 'true')"
      permissive: true
    }
    indexes: {
      index_name: "idx_pipeline_instance_correlation_unique"
      index_type: "BTREE"
      unique: true
      columns: "correlation_id"
    }
    indexes: {
      index_name: "idx_pipeline_instance_asset"
      index_type: "BTREE"
      columns: "asset_id"
    }
    cdc_topic: "udb.asset.pipeline_instances.cdc"
    required_scope: "asset:read"
    comment: "Pipeline execution instances tracking per-asset processing runs"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "tenant_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "none"
    retention_class: "asset.operational"
    retention_days: 2555
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  string instance_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "instance_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];
  // @inject_tag: gorm:"primaryKey;column:instance_id;not null"

  string definition_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "definition_id" sql_type: "UUID" not_null: true }];
  // @inject_tag: gorm:"column:definition_id;not null"

  string asset_id = 3 [(udb.core.common.v1.pg_column) = { column_name: "asset_id" sql_type: "UUID" not_null: true }];
  // @inject_tag: gorm:"column:asset_id;not null"

  string tenant_id = 4 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" sql_type: "UUID" not_null: true }];
  // @inject_tag: gorm:"column:tenant_id;not null"

  PipelineStatus status = 5 [(udb.core.common.v1.pg_column) = { column_name: "status" sql_type: "VARCHAR(20)" not_null: true default_value: "'PENDING'" index: { index_name: "idx_pipeline_instance_status" index_type: "BTREE" } }];
  // @inject_tag: gorm:"column:status;not null;serializer:proto_enum"

  string current_step = 6 [(udb.core.common.v1.pg_column) = { column_name: "current_step" sql_type: "VARCHAR(160)" }];
  // @inject_tag: gorm:"column:current_step"

  string context = 7 [(udb.core.common.v1.pg_column) = { column_name: "context" sql_type: "JSONB" is_json: true comment: "Pipeline execution context" }];
  // @inject_tag: gorm:"column:context"

  string correlation_id = 8 [(udb.core.common.v1.pg_column) = { column_name: "correlation_id" sql_type: "VARCHAR(200)" unique: true comment: "Idempotency key enforcing single re-trigger per correlation" }];
  // @inject_tag: gorm:"column:correlation_id"

  google.protobuf.Timestamp started_at = 9 [(udb.core.common.v1.pg_column) = { column_name: "started_at" sql_type: "TIMESTAMPTZ" }];
  // @inject_tag: gorm:"column:started_at"

  google.protobuf.Timestamp completed_at = 10 [(udb.core.common.v1.pg_column) = { column_name: "completed_at" sql_type: "TIMESTAMPTZ" }];
  // @inject_tag: gorm:"column:completed_at"

  udb.core.common.v1.AuditInfo audit_info = 11 [(udb.core.common.v1.pg_column) = { column_name: "audit_info" sql_type: "JSONB" not_null: true default_value: "'{}'::jsonb" is_json: true comment: "Audit trail stored as JSON" }];
  // @inject_tag: gorm:"column:audit_info;not null"
}
