syntax = "proto3";

package udb.core.idp.services.v1;

import "google/api/annotations.proto";
import "udb/core/idp/services/v1/core.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "udb.core.Idp.Services.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/idp/services/v1;idpservicev1";
option java_package = "com.udb.core.idp.services.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Idp\\Services\\V1";
option php_namespace = "Udb\\Core\\Idp\\Services\\V1";

// ---------------------------------------------------------------------------
// IdentityProviderService — Enterprise identity-provider lifecycle, SAML 2.0
// web SSO (metadata import + ACS), SCIM 2.0 provisioning, JIT user
// provisioning, and external-identity linking. All RPCs are tenant-scoped and
// server-only (control-plane); they run on the isolated native auth listener.
// ---------------------------------------------------------------------------
service IdentityProviderService {
  option (udb.core.common.v1.native_service) = {
    service_id: "idp"
    logical_service_id: "idp"
    proto_service_id: "idp"
    display_name: "Identity Providers"
    category: "auth"
    default_enabled: true
    requires_postgres: true
    control_plane_listener_allowed: true
    sdk_facade_name: "identityProviders"
    cli_scaffold_group: "auth"
    health_check_ref: "idp"
    capability_ref: "native.idp"
  };
  option (udb.core.common.v1.service_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "idp"
    generate_minimal_example: true
  };
  option (udb.core.common.v1.service_dependency_contract) = {
    required_native_services: "idp"
    required_backends: "postgres"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
  };

  // ── Provider administration (J2.6) ────────────────────────────────────────
  rpc CreateProvider(CreateProviderRequest) returns (CreateProviderResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:idp:create-provider"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "idp.CreateProvider"
      request_context_required: true
      tenant_required: true
    };
    option (google.api.http) = {
      post: "/v1/idp/providers"
      body: "*"
    };
  }

  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
