// MessagingService: the delivery service and key directory for end-to-end
// encrypted user-to-user messaging over MLS (RFC 9420, ciphersuite
// MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519). Clients do all cryptography. The
// broker stores opaque ciphertext plus the PUBLIC group state, validates every
// handshake commit against that public state (linear epochs, an authoritative
// roster), and fans messages out to per-device inboxes. It never holds a group
// secret and never sees plaintext. Handshake metadata (who joined or left, group
// sizes, timing) is visible to the broker by design.
service MessagingService {
  option (udb.core.common.v1.native_service) = {
    service_id: "messaging"
    logical_service_id: "messaging"
    proto_service_id: "messaging"
    display_name: "Messaging"
    category: "messaging"
    default_enabled: true
    requires_postgres: true
    control_plane_listener_allowed: true
    sdk_facade_name: "messaging"
    cli_scaffold_group: "messaging"
    health_check_ref: "messaging"
    capability_ref: "native.messaging"
  };
  option (udb.core.common.v1.service_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "messaging"
    generate_minimal_example: true
  };
  option (udb.core.common.v1.service_cli_scaffold) = {
    scaffold_package: "messaging"
    import_path: "udb/native/messaging"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
    generated_files: "udb.native.messaging.config"
    required_native_services: "messaging"
    secret_placeholders: "UDB_API_KEY"
    smoke_test_command: "udb native lint"
  };
  option (udb.core.common.v1.service_dependency_contract) = {
    required_native_services: "messaging"
    required_backends: "postgres"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
  };

  // Register one device of the calling principal: its device id, its Ed25519
  // signature public key, and its MLS BasicCredential naming
  // `<tenant>/<subject>/<device_id>`. Re-registering the same device with the same
  // key is idempotent; a different key for an existing device id is refused (a key
  // change is a new device).
  rpc RegisterMessagingDevice(RegisterMessagingDeviceRequest) returns (RegisterMessagingDeviceResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    // Verified: GENUINE keyed dedup. device_id is unique per tenant
    // (unique-index on (tenant_id, device_id) in the project's messaging
    // store); the insert is ON CONFLICT DO NOTHING inside one transaction, and
    // a replay of the identical request returns the existing row with
    // created=false, while a conflicting one is ALREADY_EXISTS.
    option (udb.core.common.v1.method_idempotency_contract) = {
      request_key_field: "device_id"
      server_generated_key: false
      replay_safe: true
    };
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:messaging:register-messaging-device"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      allowed_credential_types: CREDENTIAL_TYPE_SERVICE_ACCOUNT
      decision_resource: "messaging.RegisterMessagingDevice"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "register_messaging_device" rest_operation_id: "messagingRegisterMessagingDevice"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "messaging"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "messaging"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/messaging/devices"
      body: "*"
    };
  }

