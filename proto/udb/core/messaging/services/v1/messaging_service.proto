  // Submit an MLS PublicMessage commit (plus the Welcome for any added devices).
  // Accepted only when its epoch is the group's current epoch and it validates
  // against the public group state; concurrent commits linearize and the loser
  // receives FAILED_PRECONDITION carrying the current epoch so it can re-base.
  rpc SubmitCommit(SubmitCommitRequest) returns (SubmitCommitResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    // Verified: GENUINE keyed dedup. A non-empty client_message_id is scoped to
    // (tenant, group) in the project's messaging store; the handler takes a
    // transaction-scoped advisory lock on that key and returns the original
    // result if an inbox row with the key exists, inside the same transaction
    // that would append the fan-out, so a retry is never delivered twice. An
    // empty key disables dedup, so server_generated_key=false.
    option (udb.core.common.v1.method_idempotency_contract) = {
      request_key_field: "client_message_id"
      server_generated_key: false
      replay_safe: true
    };
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:messaging:submit-commit"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      allowed_credential_types: CREDENTIAL_TYPE_SERVICE_ACCOUNT
      decision_resource: "messaging.SubmitCommit"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "submit_commit" rest_operation_id: "messagingSubmitCommit"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "messaging"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "messaging"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "messaging.SubmitCommit"
      outbox_topic: "udb.messaging.inbox.appended.v1"
      partition_key_field: "tenant_id"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/messaging/groups/{group_id}:commit"
      body: "*"
    };
  }

