  // Close a room
  rpc CloseRoom(CloseRoomRequest) returns (CloseRoomResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    // Verified: webrtc RoomService::close_room runs UPDATE ... SET state =
    // 'CLOSED', participant_count = 0 WHERE room_id = ... — driving the room to
    // the CLOSED terminal state. join_room_inner then refuses any join on a
    // CLOSED room (WHERE state <> 'CLOSED'), so CLOSED is genuinely terminal.
    option (udb.core.common.v1.method_lifecycle_contract) = {
      entity: "Room"
      target_state: "CLOSED"
      terminal_states: "CLOSED"
    };
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:webrtc:room:close-room"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "webrtc.room.CloseRoom"
      request_context_required: true
      tenant_required: true
