syntax = "proto3";

package udb.core.webrtc.events.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "udb.core.Webrtc.Events.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/webrtc/events/v1;webrtceventsv1";
option java_package = "com.udb.core.webrtc.events.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Webrtc\\Events\\V1";
option php_namespace = "Udb\\Core\\Webrtc\\Events\\V1";

// Emitted when a room is created.
message RoomCreated {
  option (udb.core.common.v1.message_event_contract) = {
    event_type: "udb.core.webrtc.events.v1.RoomCreated"
    outbox_topic: "udb.webrtc.room_created.v1"
    partition_key_field: "tenant_id"
    payload_redaction_profile: "standard"
    delivery_guarantee: "at_least_once"
    replay_compatibility: "stable"
  };
  string event_id = 1;
  string room_id = 2;
  string tenant_id = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// Emitted when a room is closed.
message RoomClosed {
  option (udb.core.common.v1.message_event_contract) = {
    event_type: "udb.core.webrtc.events.v1.RoomClosed"
    outbox_topic: "udb.webrtc.room_closed.v1"
    partition_key_field: "tenant_id"
    payload_redaction_profile: "standard"
    delivery_guarantee: "at_least_once"
    replay_compatibility: "stable"
  };
  string event_id = 1;
  string room_id = 2;
  string tenant_id = 3;
  google.protobuf.Timestamp timestamp = 4;
}

