syntax = "proto3";

package udb.core.control.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/control/entity/v1/enums.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "udb.core.Control.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/control/entity/v1;controlv1";
option java_package = "com.udb.core.control.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Control\\Entity\\V1";
option php_namespace = "Udb\\Core\\Control\\Entity\\V1";

// ---------------------------------------------------------------------------
// ControlPlaneResource — One versioned control-plane configuration resource
// (a routing policy, method-security policy, RLS/tenant policy, native-service
// enablement record, or backend-target definition) in the xDS-style registry.
//
// The version is content-addressed: `content_hash` is a deterministic,
// order-independent hash of `payload_json`; `version` echoes it. Re-upserting
// identical content does NOT bump the version, so nodes do not re-apply
// unchanged config. `tenant_id`/`project_id` are nullable: a null tenant means
// the resource is fleet-wide; a set tenant scopes on-demand tenant policy fetch.
//
// Unique (resource_type, name, tenant_id). RLS scopes tenant-scoped rows to the
// current tenant; fleet-wide rows (NULL tenant) are visible to admin readers.
//
// Migration order 60 — late, after the auth/idp/tenant control-plane tables.
// ---------------------------------------------------------------------------
message ControlPlaneResource {
  option (udb.core.common.v1.pg_table) = {
    table_name: "control_plane_resources"
    schema_name: "udb_control"
    migration_order: 60
    is_table: true
    comment: "Versioned control-plane resources distributed xDS-style to nodes"
    soft_delete: false
    audit_fields: false
    enable_rls: true
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(tenant_id IS NULL OR tenant_id::text = current_setting('app.current_tenant_id', true)::text)"
      permissive: true
    }
    indexes: {
      index_name: "uq_control_resources_type_name_tenant"
      index_type: "BTREE"
      unique: true
      columns: "resource_type"
      columns: "name"
      columns: "tenant_id"
    }
    indexes: {
      index_name: "idx_control_resources_type"
      index_type: "BTREE"
      columns: "resource_type"
    }
    cdc_topic: "udb.control.control_plane_resources.cdc"
    required_scope: "control:resources:read"
    replica_hint: "primary"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "tenant_id"
    rls_policy_template: "tenant_id IS NULL OR tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "none"
    retention_class: "control.operational"
    retention_days: 2555
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "none"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  string resource_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "resource_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  ResourceType resource_type = 2 [(udb.core.common.v1.pg_column) = { column_name: "resource_type" sql_type: "VARCHAR(48)" not_null: true index: { index_name: "idx_control_resources_resource_type" index_type: "BTREE" } }];

  // Logical name, unique within (resource_type, tenant_id). For a backend
  // target this is the cluster id a routing policy references.
  string name = 3 [(udb.core.common.v1.pg_column) = { column_name: "name" sql_type: "VARCHAR(200)" not_null: true }];

  // Nullable: NULL == fleet-wide; set == tenant-scoped (on-demand fetch).
  string tenant_id = 4 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" sql_type: "VARCHAR(120)" comment: "NULL means fleet-wide; set scopes the resource to one tenant" }];

  // Nullable project/application namespace.
  string project_id = 5 [(udb.core.common.v1.pg_column) = { column_name: "project_id" sql_type: "VARCHAR(160)" comment: "Optional project/application namespace" }];

  // Monotonic content-addressed version string; equals `content_hash` and only
  // changes when `payload_json` content changes.
  string version = 6 [(udb.core.common.v1.pg_column) = { column_name: "version" sql_type: "VARCHAR(96)" not_null: true comment: "Content-addressed version (== content_hash); stable under identical content" }];

  // Deterministic, order-independent hash of the payload (xDS resource version).
  string content_hash = 7 [(udb.core.common.v1.pg_column) = { column_name: "content_hash" sql_type: "VARCHAR(96)" not_null: true }];

  // The resource body delivered to nodes (opaque to the distribution core).
  string payload_json = 8 [(udb.core.common.v1.pg_column) = { column_name: "payload_json" sql_type: "JSONB" is_json: true not_null: true default_value: "'{}'::jsonb" comment: "Opaque resource payload distributed to nodes" }];

  string updated_by = 9 [(udb.core.common.v1.pg_column) = { column_name: "updated_by" sql_type: "VARCHAR(200)" comment: "Principal that last upserted this resource" }];

  google.protobuf.Timestamp created_at = 10 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true exclude_from_update: true }];

  google.protobuf.Timestamp updated_at = 11 [(udb.core.common.v1.pg_column) = { column_name: "updated_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" }];
}
