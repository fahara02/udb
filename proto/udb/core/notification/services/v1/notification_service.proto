  // Send a notification (or enqueue it for async delivery).
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    // Verified: notification_service::send_notification writes one
    // NotificationLog per channel, each persisted (ConflictStrategy::Error)
    // before the response is built. channel_send_decision sets the initial
    // status to PENDING (queued for delivery) or SUPPRESSED (recipient opted
    // out). No single returned-id readback contract: the response carries
    // repeated logs, not one id (each log_id is gettable via GetNotification).
    option (udb.core.common.v1.method_lifecycle_contract) = {
      entity: "NotificationLog"
      target_state: "PENDING"
      terminal_states: "SUPPRESSED"
    };
    // Verified against the status_with_reason(...) call sites in
    // notification_service::send_notification. VARIABLE_MISSING also attaches an
    // error-variable trailer naming the missing field.
    option (udb.core.common.v1.method_error_contract) = {
      cases: { canonical_code: "TEMPLATE_NOT_FOUND" grpc_status: "NOT_FOUND" retryable: false }
      cases: { canonical_code: "VARIABLE_MISSING" grpc_status: "INVALID_ARGUMENT" retryable: false }
    };
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:notification:send-notification"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "notification.SendNotification"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "send_notification" rest_operation_id: "sendNotification"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "notification"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_cli_scaffold) = {
      scaffold_package: "notification"
      import_path: "udb/native/notification"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
      generated_files: "udb.native.notification.send_notification.boilerplate"
      route_name: "send_notification"
      middleware_name: "udb_notification"
      required_native_services: "notification"
      secret_placeholders: "UDB_API_KEY"
      smoke_test_command: "udb native smoke"
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "notification"
      required_backends: "postgres"
      required_backends: "kafka"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "notification.SendNotification"
      outbox_topic: "notification.events"
      partition_key_field: "tenant_id"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
      emits: { topic: "udb.notification.sent.v1" partition_key_field: "recipient_id" delivery_guarantee: "at_least_once" payload_redaction_profile: "standard" conditional: false }
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
