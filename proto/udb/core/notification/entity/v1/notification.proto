syntax = "proto3";

package udb.core.notification.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/notification/entity/v1/enums.proto";

option csharp_namespace = "udb.core.Notification.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/notification/entity/v1;notificationv1";
option java_package = "com.udb.core.notification.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Notification\\Entity\\V1";
option php_namespace = "Udb\\Core\\Notification\\Entity\\V1";

// Notification is the core domain entity for a queued or sent notification.
message Notification {
  string notification_id = 1;
  string recipient_id = 2;
  NotificationType type = 3;
  NotificationChannel channel = 4;
  string subject = 5;
  string message = 6;
  map<string, string> template_data = 7;
  NotificationPriority priority = 8;
  NotificationStatus status = 9;
  google.protobuf.Timestamp scheduled_at = 10;
  google.protobuf.Timestamp sent_at = 11;
  google.protobuf.Timestamp delivered_at = 12;
  google.protobuf.Timestamp read_at = 13;
  google.protobuf.Timestamp created_at = 14;
  int32 retry_count = 15;
  string error_message = 16;
  string tenant_id = 17;
}
