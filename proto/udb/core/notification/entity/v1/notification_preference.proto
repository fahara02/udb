syntax = "proto3";

package udb.core.notification.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";
import "udb/core/notification/entity/v1/enums.proto";

option csharp_namespace = "udb.core.Notification.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/notification/entity/v1;notificationv1";
option java_package = "com.udb.core.notification.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Notification\\Entity\\V1";
option php_namespace = "Udb\\Core\\Notification\\Entity\\V1";

// ---------------------------------------------------------------------------
// NotificationPreference — Per-project user/channel/event opt-out settings.
// Queried before delivery to enforce USER_OPT_OUT suppression. Tenant and
// project ownership are both first-class so shared physical stores cannot make
// one project's preference suppress another project's notification.
// ---------------------------------------------------------------------------

message NotificationPreference {
  option (udb.core.common.v1.pg_table) = {
    table_name: "notification_preferences"
    schema_name: "udb_notification"
    migration_order: 3
    is_table: true
    comment: "Per-project user/channel/event-type notification opt-out settings"
    soft_delete: false
    audit_fields: true
    enable_rls: true
    force_rls: true
    rls_policies: {
      policy_name: "tenant_project_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true)::text AND project_id::text = current_setting('app.current_project_id', true)::text)"
      permissive: true
    }
    indexes: {
      index_name: "idx_notif_prefs_tenant_project_user_channel_event"
      index_type: "BTREE"
      unique: true
      columns: "tenant_id"
      columns: "project_id"
      columns: "user_id"
      columns: "channel"
      columns: "event_type"
    }
    sql_artifacts: {
      name: "touch_updated_at_function"
      backend: "postgres"
      phase: "before_triggers"
      sql:
        "CREATE OR REPLACE FUNCTION udb_notification.touch_updated_at()\n"
        "RETURNS trigger\n"
        "LANGUAGE plpgsql\n"
        "AS $$\n"
        "BEGIN\n"
        "  NEW.updated_at = CURRENT_TIMESTAMP;\n"
        "  RETURN NEW;\n"
        "END;\n"
        "$$;"
    }
    triggers: {
      trigger_name: "trg_notification_preferences_touch_updated_at"
      timing: "BEFORE"
      event: "UPDATE"
      function_name: "udb_notification.touch_updated_at()"
      for_each: "ROW"
    }
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    project_isolation_mode: "project"
    tenant_column: "tenant_id"
    project_column: "project_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id') AND project_id = current_setting('app.current_project_id')"
    soft_delete_mode: "none"
    retention_class: "notification.operational"
    retention_days: 2555
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  string preference_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "preference_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  string user_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "user_id" sql_type: "UUID" not_null: true }];

  string tenant_id = 3 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" tenant_column: true sql_type: "VARCHAR(120)" not_null: true index: { index_name: "idx_notif_prefs_tenant_id" index_type: "BTREE" } }];

  NotificationChannel channel = 4 [(udb.core.common.v1.pg_column) = { column_name: "channel" sql_type: "VARCHAR(20)" not_null: true }];

  // Empty string = channel-wide opt-out; non-empty = opt-out of specific event type.
  string event_type = 5 [(udb.core.common.v1.pg_column) = { column_name: "event_type" sql_type: "VARCHAR(80)" not_null: true default_value: "''" comment: "'' = channel-wide; e.g. 'REVIEW_ASSIGNED' = per-event opt-out" }];

  bool is_opted_out = 6 [(udb.core.common.v1.pg_column) = { column_name: "is_opted_out" sql_type: "BOOLEAN" not_null: true default_value: "FALSE" }];

  google.protobuf.Timestamp created_at = 7 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true exclude_from_update: true }];

  google.protobuf.Timestamp updated_at = 8 [(udb.core.common.v1.pg_column) = { column_name: "updated_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true }];

  string created_by = 9 [(udb.core.common.v1.pg_column) = { column_name: "created_by" sql_type: "VARCHAR(120)" comment: "Identity that created this record." }];

  // First-class project owner. Blank is reserved for quarantined legacy rows;
  // serving paths persist only an explicitly active resolved project.
  string project_id = 10 [(udb.core.common.v1.pg_column) = { column_name: "project_id" project_column: true sql_type: "VARCHAR(120)" not_null: true default_value: "''" index: { index_name: "idx_notif_prefs_project_id" index_type: "BTREE" } }];
}
