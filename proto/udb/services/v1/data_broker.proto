    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "get_catalog_manifest" rest_operation_id: "getCatalogManifest" };
  }
  // Runtime schema lookup for SDK/data operation compatibility negotiation.
  rpc LookupMessageSchema(udb.entity.v1.MessageSchemaLookupRequest) returns (udb.entity.v1.MessageSchemaLookupResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "lookup_message_schema" rest_operation_id: "lookupMessageSchema" };
  }
  rpc ListMessageSchemas(udb.entity.v1.MessageSchemaListRequest) returns (udb.entity.v1.MessageSchemaListResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "list_message_schemas" rest_operation_id: "listMessageSchemas" };
  }
  rpc GetHealthReport(udb.entity.v1.HealthReportRequest) returns (udb.entity.v1.HealthReportResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "get_health_report" rest_operation_id: "getHealthReport" };
  }

  // Multi-project registry.
  // Ensure a project namespace exists (idempotent).
  // Requires scope: udb:admin
  rpc EnsureProject(udb.entity.v1.EnsureProjectRequest) returns (udb.entity.v1.MutationResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "ensure_project" rest_operation_id: "ensureProject" };
  }
  // List all registered project namespaces.
  // Requires scope: udb:admin
  rpc ListProjects(udb.entity.v1.ProjectListRequest) returns (udb.entity.v1.ProjectListResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "list_projects" rest_operation_id: "listProjects" };
  }

  // ── Unified Admin Surface ────────────────────────────────────────────────
  // Returns a single snapshot covering catalog, CDC, saga, backend, and policy
  // state for the admin console. Requires scope: udb:admin.
  rpc GetAdminSummary(udb.entity.v1.AdminSummaryRequest) returns (udb.entity.v1.AdminSummaryResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "get_admin_summary" rest_operation_id: "getAdminSummary" };
  }
  // Paginated admin audit log view for the admin console.
  // Requires scope: udb:admin, udb:admin:viewer, or legacy udb:portal:viewer.
  rpc ListAdminAuditLogs(udb.entity.v1.AdminAuditLogRequest) returns (udb.entity.v1.AdminAuditLogResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "list_admin_audit_logs" rest_operation_id: "listAdminAuditLogs" };
  }
  // Verifies the admin audit log hash chain and reports the first broken link.
  // Requires scope: udb:admin, udb:admin:viewer, or legacy udb:portal:viewer.
  rpc VerifyAdminAuditLog(udb.entity.v1.AdminAuditVerifyRequest) returns (udb.entity.v1.AdminAuditVerifyResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "verify_admin_audit_log" rest_operation_id: "verifyAdminAuditLog" };
  }
}

// Request to seed a baseline manual-review saga + retryable DLQ row. The
// tenant/project are NEVER taken from this body; they are derived from the
// VERIFIED principal (security.tenant_id / security.project_id) on the server.
message EnsureBaselineRequest {
  udb.entity.v1.RequestContext context = 1;
}

// Identifiers of the seeded (or already-present, idempotent) rows.
message EnsureBaselineResponse {
  repeated string saga_ids = 1;
  repeated string dlq_ids = 2;
  string device_id = 3;
}
