  rpc ReloadPolicies(udb.entity.v1.CapabilitiesRequest) returns (udb.entity.v1.MutationResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_DESTRUCTIVE;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "reload_policies" rest_operation_id: "reloadPolicies" };
  }
  rpc LintPolicies(udb.entity.v1.CapabilitiesRequest) returns (udb.entity.v1.PolicyLintResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "lint_policies" rest_operation_id: "lintPolicies" };
  }

  // ── Admin API ─────────────────────────────────────────────────────────────
  rpc GetCapabilities(udb.entity.v1.CapabilitiesRequest) returns (udb.entity.v1.CapabilitiesResponse) {
