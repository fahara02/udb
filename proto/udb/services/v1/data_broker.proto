  // Idempotently seed a baseline manual-review saga row and a retryable DLQ row
  // for the VERIFIED principal's tenant/project. Privilege-creating: fail-closed,
  // env-gated (UDB_ENABLE_ADMIN_SEED) and requires scope: udb:admin.
  rpc EnsureBaseline(EnsureBaselineRequest) returns (EnsureBaselineResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "ensure_baseline" rest_operation_id: "ensureBaseline" };
  }

  // Policy administration.
  rpc ListPolicies(udb.entity.v1.PolicyListRequest) returns (udb.entity.v1.PolicyListResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "list_policies" rest_operation_id: "listPolicies" };
