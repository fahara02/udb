syntax = "proto3";

package udb.entity.v1;

option go_package = "github.com/udb-project/udb/gen/go/udb/entity/v1;entityv1";
option java_package      = "com.udb.entity.v1";
option csharp_namespace = "Udb.Entity.V1";
option php_namespace = "Udb\\Entity\\V1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Entity\\V1";

import "udb/entity/v1/context.proto";

// Where a durable consumer name starts the first time it subscribes.
enum CdcConsumerStart {
  // Same as CDC_CONSUMER_START_LATEST.
  CDC_CONSUMER_START_UNSPECIFIED = 0;
  // Start at the journal head: only events committed after the first
  // subscription are delivered.
  CDC_CONSUMER_START_LATEST = 1;
  // Start before the earliest retained event and replay the retained history.
  CDC_CONSUMER_START_EARLIEST = 2;
}

message CDCSubscriptionRequest {
  RequestContext context = 1;
  string topic_pattern = 2;
  // Resume after this event: a retained event id, or a progress marker's
  // token (see CDCEnvelope.progress_only), which stays valid after retention.
  string since_event_id = 3;
  // A durable consumer's name (1-120 chars of [A-Za-z0-9_.:-]). When set and
  // since_event_id is empty, the stream resumes after the last event this
  // consumer acknowledged with AckCdcEvents for this topic_pattern, so a
  // restarted (or reconnected) consumer resumes its acknowledged position.
  // A new name starts where `start` says. Positions survive journal retention.
  // Names are owned by the verified principal within its tenant and project;
  // another principal cannot subscribe or acknowledge under the same name.
  string consumer_name = 4;
  // Interleave progress markers with events (CDCEnvelope.progress_only). Set
  // it only if the client recognizes markers and keeps them away from event
  // handlers. One marker follows the end of replay; later ones follow polls
  // that read past events this stream did not deliver, at most every few
  // seconds or every thousand journal positions.
  bool progress_markers = 5;
  // Where a consumer_name starts on its first subscription. Ignored once the
  // name has a stored position, and for anonymous streams.
  CdcConsumerStart start = 6;
}

// AckCdcEvents records how far a durable consumer has processed a stream.
message AckCdcEventsRequest {
  RequestContext context = 1;
  // The consumer named in CDCSubscriptionRequest.consumer_name.
  string consumer_name = 2;
  // The topic_pattern the consumer subscribed with.
  string topic_pattern = 3;
  // The last event the consumer has fully handled. The next subscription
  // under this consumer name resumes after it. The event must be retained and
  // match the caller's tenant/project and topic pattern. An older acknowledgment
  // succeeds without moving the stored cursor backward. A progress marker's
  // token is also accepted: it moves the cursor to the marker's position.
  // NackCdcEvents refuses a token (InvalidArgument).
  string event_id = 4;
}

message AckCdcEventsResponse {
  string consumer_name = 1;
  string topic_pattern = 2;
  string event_id = 3;
  int64 acked_at_unix = 4;
}

// Atomically retain a failed consumer event in the ordinary DLQ and advance
// this consumer's cursor. Other consumers and the journal event are unchanged.
// Repeating the same consumer/topic/event settlement is safe. The broker reads
// the canonical retained event; callers cannot supply or replace its payload.
message NackCdcEventsRequest {
  RequestContext context = 1;
  string consumer_name = 2;
  string topic_pattern = 3;
  string event_id = 4;
  // Completed handler attempts, from 1 through 1000.
  uint32 attempts = 5;
  // Operator diagnostic, at most 2048 UTF-8 bytes. Do not include credentials.
  string failure_reason = 6;
}

// CDC control plane.

message CdcControlRequest {
  RequestContext context = 1;
  string slot_name = 2;
  string reason = 3;
}

message CdcStatusResponse {
  string slot_name = 1;
  bool is_leader = 2;
  bool paused = 3;
  string pause_reason = 4;
  string last_event_id = 5;
  double lag_seconds = 6;
  int64 outbox_depth = 7;
  int64 updated_at_unix = 8;
  // Durable consumers in the caller's tenant/project. Lag compares each stored
  // watermark with its own topic head and remains valid after journal pruning.
  repeated CdcConsumerStatus consumers = 9;
}

message CdcConsumerStatus {
  string consumer_name = 1;
  string topic_pattern = 2;
  string last_event_id = 3;
  double lag_seconds = 4;
  int64 acked_at_unix = 5;
  int64 last_published_at_unix = 6;
  string tenant_id = 7;
  string project_id = 8;
  string owner_identity = 9;
  // A legacy cursor has no verified owner; migrate it before resuming delivery.
  bool owner_migration_required = 10;
}
