syntax = "proto3";

package udb.entity.v1;

option csharp_namespace = "Udb.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/entity/v1;entityv1";
option java_package = "com.udb.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Entity\\V1";
option php_namespace = "Udb\\Entity\\V1";

// ── Typed error details ───────────────────────────────────────────────────────
//
// `ErrorDetail` is the machine-readable companion to a `tonic::Status`. The
// broker prost-encodes one of these and attaches it to refusal/error statuses
// under the binary trailer metadata key `udb-error-detail-bin`. SDKs decode it
// instead of string-parsing the human-readable status message, so capability,
// policy, quota, schema, and retry decisions are typed end-to-end.
//
// All fields are optional in the proto3 sense: a field left at its default
// (empty string / 0 / false) simply means "not applicable for this error".

// A single invalid input field. `field` is the protobuf field path relative to
// the request message (for example "tenant_id" or "policy.rules[0].action");
// `description` is stable enough for operators but is not a machine enum.
message ErrorFieldViolation {
  string field = 1;
  string description = 2;
}

// Coarse classification of why a request failed. SDKs branch on `kind` to pick
// retry / surface-to-user / escalate behavior without parsing messages.
enum ErrorKind {
  // Unset / unknown — treat as a generic failure.
  ERROR_KIND_UNSPECIFIED = 0;
  // The target backend does not support the requested operation/capability.
  // Maps to gRPC FailedPrecondition. Never retryable.
  ERROR_KIND_CAPABILITY = 1;
  // An authorization / policy decision denied the request. `policy_decision_id`
  // identifies the decision in audit logs.
  ERROR_KIND_POLICY = 2;
  // A quota / rate limit was exceeded. `retry_after_ms` may suggest a backoff.
  ERROR_KIND_QUOTA = 3;
  // A schema / catalog mismatch or compile-time validation failure (carries the
  // CompileError code in `capability_required` when applicable).
  ERROR_KIND_SCHEMA = 4;
  // A transient failure the caller may retry. Maps to gRPC Unavailable.
  ERROR_KIND_RETRYABLE = 5;
  // An unexpected internal error. Generally not retryable without investigation.
  ERROR_KIND_INTERNAL = 6;
  // Malformed or semantically invalid request fields. Maps to gRPC
  // InvalidArgument and carries `field_violations`.
  ERROR_KIND_VALIDATION = 7;
  // A compare-and-swap / revision precondition did not hold: the row changed
  // since the caller read it. Re-read and retry. Maps to FailedPrecondition.
  ERROR_KIND_CONFLICT = 8;
  // The addressed row or resource does not exist (or is not visible to the
  // caller). Maps to NotFound.
  ERROR_KIND_NOT_FOUND = 9;
  // A unique constraint was violated; `constraint` names it. Maps to
  // AlreadyExists.
  ERROR_KIND_UNIQUE = 10;
  // A NOT NULL column received no value; `column` names it.
  ERROR_KIND_NOT_NULL = 11;
  // A foreign-key constraint was violated; `constraint` names it.
  ERROR_KIND_FOREIGN_KEY = 12;
  // The caller lacks a scope, grant or policy rule; `missing` names it.
  ERROR_KIND_PERMISSION = 13;
  // A value was redacted for this caller (PII without the read scope), or a
  // write tried to store a redacted placeholder.
  ERROR_KIND_REDACTED = 14;
  // A rate limit was hit; `retry_after_ms` and `missing` describe the bucket.
  ERROR_KIND_RATE_LIMITED = 15;
}

message ErrorDetail {
  // Backend selector base this error originated from (e.g. "postgres",
  // "qdrant"). Empty when the error is not backend-specific.
  string backend = 1;
  // Logical operation that failed (e.g. "ensure_resource", "query",
  // "mutate", "search"). Empty when not operation-specific.
  string operation = 2;
  // For capability/schema refusals: the capability or compile-error code that
  // was required but missing (e.g. "supports_resource_lifecycle",
  // "operation_not_supported"). Empty otherwise.
  string capability_required = 3;
  // Whether the caller may retry the same request as-is.
  bool retryable = 4;
  // Suggested backoff before retrying, in milliseconds. 0 means "no suggestion".
  int64 retry_after_ms = 5;
  // Identifier of the authorization decision that produced this error, for
  // correlating with the policy/audit log. Empty when not a policy decision.
  string policy_decision_id = 6;
  // Request correlation id, echoed so the caller can stitch the typed error to
  // its originating request in logs/traces.
  string correlation_id = 7;
  // Coarse classification of the failure.
  ErrorKind kind = 8;
  // Structured invalid-field details for INVALID_ARGUMENT responses. Empty for
  // non-validation errors.
  repeated ErrorFieldViolation field_violations = 9;
  // Stable machine reason, `UDB_` + upper snake case (for example
  // `UDB_CAS_CONFLICT`, `UDB_CAS_KEY_NOT_PK`, `UDB_NO_ROWS_AFFECTED`). The set is
  // listed in docs/error-reasons.md; a reason is never renamed once shipped.
  // Branch on this, never on the message text.
  string reason = 10;
  // The constraint involved (unique, foreign key, check), when known.
  string constraint = 11;
  // The column involved (not null, coercion, decode), when known.
  string column = 12;
  // One sentence telling the caller how to fix the request.
  string fix_hint = 13;
  // What the caller is missing, as key/value pairs: for example
  // `{"scope": "udb:pii:read"}`, `{"purpose": ""}`,
  // `{"rule": "Select acme.notes.v1.Note"}`.
  map<string, string> missing = 14;
}
