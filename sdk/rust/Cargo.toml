[package]
name = "udb-client"
version = "0.5.22"
edition = "2021"
rust-version = "1.88"
description = "Rust client for UDB — a proto-driven gRPC broker over multiple databases. Typed tonic clients plus the tenant/project metadata and token lifecycle the broker expects."
license = "MIT OR Apache-2.0"
repository = "https://github.com/fahara02/udb"
homepage = "https://github.com/fahara02/udb"
documentation = "https://docs.rs/udb-client"
readme = "README.md"
keywords = ["udb", "grpc", "database", "multi-tenant", "client"]
categories = ["database", "api-bindings"]

# The stubs are generated from the protos at build time rather than committed, so
# this crate cannot drift from the wire contract it ships with. `proto/` and
# `third_party/` are packaged so `cargo publish` produces a crate that builds
# standalone off the registry, with no repo checkout.
#
# Those two are gitignored (the release workflow vendors them; the repo keeps one
# copy under /proto). Cargo lists package files through git, so an ignored path is
# skipped even when `include` names it — the release workflow force-adds them, and
# `Verify the packaged crate builds standalone` fails the release if that ever
# stops working.
include = [
    "src/**",
    "examples/**",
    "build.rs",
    "README.md",
    "proto/**",
    "third_party/**",
]

[lib]
# google/api's proto comments embed indented HTTP and proto examples, and rustdoc
# reads an indented block in a doc comment as a RUST doctest — so `cargo test`
# tries to compile Google's prose and fails on it. tonic-build's
# `disable_comments` does not strip them here. Usage is compile-checked by
# `examples/` instead (see `cargo build --examples`), which is a stronger check
# than a `no_run` doctest: the example is a real program, not a fragment.
doctest = false

# CURRENT tonic/prost, deliberately NOT the broker's older pins.
#
# 0.5.21 pinned tonic 0.12 / prost 0.13 "to match the broker", reasoning that a
# consumer linking both would get one set of generated types. That optimises for a
# rare consumer — almost nobody links a gRPC SERVER as a library beside its client
# — and penalises the common one, who is on current prost and cannot pass their own
# `prost_types::Struct` into `UpsertRequest.payload` because it is a different
# nominal type. The client is a separate artifact with separate consumers and
# tracks the ecosystem, not the broker.
[dependencies]
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-native-roots"] }
# tonic 0.14 moved the prost codec into its own runtime crate; the generated
# clients reference `tonic_prost`, so it is a normal dependency, not a build one.
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["sync", "time"] }

[build-dependencies]
# tonic 0.14 split codegen out of `tonic-build` into `tonic-prost-build`.
tonic-prost-build = "0.14"
# Vendored protoc, matching the broker: building this crate must not require a
# system protoc install.
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
