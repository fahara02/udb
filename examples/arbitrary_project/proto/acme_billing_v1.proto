// acme_billing_v1.proto — sample schema showing UDB working with a completely
// arbitrary proto namespace that has no project-specific dependency.
//
// This proto deliberately avoids any import from project-specific/* to prove that
// UDB is project-agnostic: the db.proto extension annotations are resolved from
// whichever proto root is passed to the parser (here: this file's own directory).
//
// Usage:
//   udb-proto-parser parse  --root examples/arbitrary_project/proto acme_billing_v1.proto
//   udb-proto-parser lint   --root examples/arbitrary_project/proto acme_billing_v1.proto
//   udb-proto-parser sql    --root examples/arbitrary_project/proto acme_billing_v1.proto
//   udb-proto-parser system-ddl
//   udb-proto-parser serve  --root examples/arbitrary_project/proto acme_billing_v1.proto

syntax = "proto3";

package acme.billing.v1;

// ── Inline extension definitions (no external import required) ─────────────
// In a real project these would be in a shared "db.proto" file that UDB ships.
// They are inlined here so the example is self-contained.
//
// UDB recognises extension option names by the suffix patterns defined in its
// extension registry regardless of the package name used:
//   *.table, *.vector_store, *.cache, *.object_store,
//   *.column.pii_kind, *.column.encrypt, *.column.tenant_column, etc.

// ── Invoice ───────────────────────────────────────────────────────────────────

message Invoice {
    option (acme.billing.v1.table) = {
        table_name: "invoices"
        schema_name: "billing"
        migration_order: 10
        is_table: true
        enable_rls: true
        tenant_column: "org_id"
        comment: "Customer invoices managed by ACME Billing"
    };

    option (acme.billing.v1.cache) = {
        backend: CACHE_BACKEND_REDIS
        key_pattern: "billing:invoice:{invoice_id}"
        ttl_seconds: 600
        write_through: true
        read_through: true
    };

    // invoice_id is the PK — UDB uses it for cache key interpolation.
    string invoice_id = 1 [(acme.billing.v1.column) = {
        column_name: "invoice_id"
        is_primary_key: true
    }];

    // org_id is the tenant discriminator — UDB enforces it in every WHERE clause
    // when enable_rls = true and tenant_column is set.
    string org_id = 2 [(acme.billing.v1.column) = {
        column_name: "org_id"
        tenant_column: true
    }];

    string customer_name = 3 [(acme.billing.v1.column) = {
        column_name: "customer_name"
        pii_kind: PII_KIND_NAME
    }];

    string customer_email = 4 [(acme.billing.v1.column) = {
        column_name: "customer_email"
        pii_kind: PII_KIND_EMAIL
        encrypt: true
    }];

    int64  amount_cents = 5 [(acme.billing.v1.column) = { column_name: "amount_cents" }];
    string currency     = 6 [(acme.billing.v1.column) = { column_name: "currency" }];
    string status       = 7 [(acme.billing.v1.column) = { column_name: "status" }];

    string created_at = 8 [(acme.billing.v1.column) = {
        column_name: "created_at"
        is_created_at: true
    }];
    string updated_at = 9 [(acme.billing.v1.column) = {
        column_name: "updated_at"
        is_updated_at: true
    }];
}

// ── InvoiceLineItem ───────────────────────────────────────────────────────────

message InvoiceLineItem {
    option (acme.billing.v1.table) = {
        table_name: "invoice_line_items"
        schema_name: "billing"
        migration_order: 20
        is_table: true
        tenant_column: "org_id"
    };

    string line_item_id = 1 [(acme.billing.v1.column) = {
        column_name: "line_item_id"
        is_primary_key: true
    }];
    string org_id      = 2 [(acme.billing.v1.column) = { column_name: "org_id" tenant_column: true }];
    string invoice_id  = 3 [(acme.billing.v1.column) = {
        column_name: "invoice_id"
        foreign_key: "billing.invoices(invoice_id)"
    }];
    string description = 4 [(acme.billing.v1.column) = { column_name: "description" }];
    int64  unit_price  = 5 [(acme.billing.v1.column) = { column_name: "unit_price" }];
    int32  quantity    = 6 [(acme.billing.v1.column) = { column_name: "quantity" }];
}

// ── Product (vector store + relational) ───────────────────────────────────────

message Product {
    option (acme.billing.v1.table) = {
        table_name: "products"
        schema_name: "billing"
        migration_order: 5
        is_table: true
    };

    option (acme.billing.v1.vector_store) = {
        backend: VECTOR_BACKEND_QDRANT
        collection_name: "acme_products"
        dimension: 768
        distance: VECTOR_DISTANCE_COSINE
    };

    string product_id   = 1 [(acme.billing.v1.column) = { column_name: "product_id" is_primary_key: true }];
    string name         = 2 [(acme.billing.v1.column) = { column_name: "name" }];
    string description  = 3 [(acme.billing.v1.column) = { column_name: "description" }];
    int64  price_cents  = 4 [(acme.billing.v1.column) = { column_name: "price_cents" }];
    string sku          = 5 [(acme.billing.v1.column) = { column_name: "sku" }];
}

// ── BillingDocument (object store) ───────────────────────────────────────────

message BillingDocument {
    option (acme.billing.v1.object_store) = {
        backend: OBJECT_BACKEND_S3
        bucket: "acme-billing-documents"
        path_prefix: "invoices/"
        server_side_encryption: true
    };

    string document_id = 1;
    string invoice_id  = 2;
    string object_key  = 3;
    string content_type = 4;
    int64  size_bytes  = 5;
}
