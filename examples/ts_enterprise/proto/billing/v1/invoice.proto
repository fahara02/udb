syntax = "proto3";

package billing.v1;

// The broker embeds this same UDB annotation contract, so serving proto/billing
// creates exactly the table described here. (No `udb proto export` needed to
// serve; the TS SDK works with plain JS objects, so no `buf generate` either.)
import "udb/core/common/v1/db.proto";

// A tenant-scoped billing table. `tenant_id` (tenant_column) makes the broker
// enforce tenant isolation on every read AND write — a logged-in principal can
// only ever see/modify rows for ITS tenant, regardless of what the client sends.
message Invoice {
  option (udb.core.common.v1.table) = {
    table_name: "invoices"
    schema_name: "billing"
    migration_order: 10
    is_table: true
    comment: "Invoices for the UDB enterprise TypeScript example"
  };

  string invoice_id = 1 [(udb.core.common.v1.column) = {
    column_name: "invoice_id"
    sql_type: "UUID"
    primary_key: true
    default_value: "gen_random_uuid()"
  }];

  string tenant_id = 2 [(udb.core.common.v1.column) = {
    column_name: "tenant_id"
    sql_type: "UUID"
    tenant_column: true
    not_null: true
  }];

  string customer_email = 3 [(udb.core.common.v1.column) = {
    column_name: "customer_email"
    sql_type: "VARCHAR(320)"
    not_null: true
  }];

  int64 amount_cents = 4 [(udb.core.common.v1.column) = {
    column_name: "amount_cents"
    sql_type: "BIGINT"
    not_null: true
    default_value: "0"
  }];

  string status = 5 [(udb.core.common.v1.column) = {
    column_name: "status"
    sql_type: "VARCHAR(32)"
    not_null: true
    default_value: "'pending'"
  }];

  string created_at = 6 [(udb.core.common.v1.column) = {
    column_name: "created_at"
    sql_type: "TIMESTAMPTZ"
    not_null: true
    default_value: "now()"
    exclude_from_insert: true
    exclude_from_update: true
  }];
}
