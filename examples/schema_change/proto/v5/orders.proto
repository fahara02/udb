syntax = "proto3";

package shop.v1;

import "udb/core/common/v1/db.proto";

// v5: rename status to state and keep every value. previous_column_name tells the diff
// this is the same column, so it is renamed in place instead of dropped and re-added.
// The protobuf field keeps its number (3); only the name changes.
message Order {
  option (udb.core.common.v1.pg_table) = {
    table_name: "orders"
    schema_name: "shop"
  };

  reserved 4;
  reserved "customer_note";

  string order_id = 1 [(udb.core.common.v1.pg_column) = {
    column_name: "order_id" sql_type: "UUID" primary_key: true
  }];
  string tenant_id = 2 [(udb.core.common.v1.pg_column) = {
    column_name: "tenant_id" sql_type: "UUID" tenant_column: true not_null: true
  }];
  string state = 3 [(udb.core.common.v1.pg_column) = {
    column_name: "state" sql_type: "VARCHAR(32)" not_null: true previous_column_name: "status"
  }];
  string region = 5 [(udb.core.common.v1.pg_column) = {
    column_name: "region" sql_type: "VARCHAR(16)" not_null: true default_value: "'unknown'"
  }];
}
