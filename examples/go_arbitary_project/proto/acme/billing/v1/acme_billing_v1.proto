syntax = "proto3";

package acme.billing.v1;

import "google/protobuf/descriptor.proto";

extend google.protobuf.MessageOptions {
  TableOptions table = 51001;
  CacheOptions cache = 51002;
  VectorStoreOptions vector_store = 51003;
  ObjectStoreOptions object_store = 51004;
}

extend google.protobuf.FieldOptions {
  ColumnOptions column = 51005;
}

enum CacheBackend {
  CACHE_BACKEND_UNSPECIFIED = 0;
  CACHE_BACKEND_REDIS = 1;
}

enum VectorBackend {
  VECTOR_BACKEND_UNSPECIFIED = 0;
  VECTOR_BACKEND_QDRANT = 1;
}

enum VectorDistance {
  VECTOR_DISTANCE_UNSPECIFIED = 0;
  VECTOR_DISTANCE_COSINE = 1;
}

enum ObjectBackend {
  OBJECT_BACKEND_UNSPECIFIED = 0;
  OBJECT_BACKEND_S3 = 1;
}

enum PiiKind {
  PII_KIND_UNSPECIFIED = 0;
  PII_KIND_NAME = 1;
  PII_KIND_EMAIL = 2;
}

message TableOptions {
  string table_name = 1;
  string schema_name = 2;
  int32 migration_order = 3;
  bool is_table = 4;
  bool enable_rls = 5;
  string tenant_column = 6;
  string comment = 7;
}

message CacheOptions {
  CacheBackend backend = 1;
  string key_pattern = 2;
  int32 ttl_seconds = 3;
  bool write_through = 4;
  bool read_through = 5;
}

message VectorStoreOptions {
  VectorBackend backend = 1;
  string collection_name = 2;
  int32 dimension = 3;
  VectorDistance distance = 4;
}

message ObjectStoreOptions {
  ObjectBackend backend = 1;
  string bucket = 2;
  string path_prefix = 3;
  bool server_side_encryption = 4;
  bool presigned_read = 5;
  bool presigned_write = 6;
  int32 presigned_ttl_seconds = 7;
}

message ColumnOptions {
  string column_name = 1;
  bool is_primary_key = 2;
  bool tenant_column = 3;
  PiiKind pii_kind = 4;
  bool encrypt = 5;
  string foreign_key = 6;
  bool is_created_at = 7;
  bool is_updated_at = 8;
}

message Invoice {
  option (acme.billing.v1.table) = {
    table_name: "invoices"
    schema_name: "billing"
    migration_order: 10
    is_table: true
    enable_rls: true
    tenant_column: "org_id"
    comment: "Customer invoices managed by ACME Billing"
  };

  option (acme.billing.v1.cache) = {
    backend: CACHE_BACKEND_REDIS
    key_pattern: "billing:invoice:{invoice_id}"
    ttl_seconds: 600
    write_through: true
    read_through: true
  };

  string invoice_id = 1 [(acme.billing.v1.column) = {
    column_name: "invoice_id"
    is_primary_key: true
  }];
  string org_id = 2 [(acme.billing.v1.column) = {
    column_name: "org_id"
    tenant_column: true
  }];
  string customer_name = 3 [(acme.billing.v1.column) = {
    column_name: "customer_name"
    pii_kind: PII_KIND_NAME
  }];
  string customer_email = 4 [(acme.billing.v1.column) = {
    column_name: "customer_email"
    pii_kind: PII_KIND_EMAIL
    encrypt: true
  }];
  int64 amount_cents = 5 [(acme.billing.v1.column) = { column_name: "amount_cents" }];
  string currency = 6 [(acme.billing.v1.column) = { column_name: "currency" }];
  string status = 7 [(acme.billing.v1.column) = { column_name: "status" }];
  string created_at = 8 [(acme.billing.v1.column) = {
    column_name: "created_at"
    is_created_at: true
  }];
  string updated_at = 9 [(acme.billing.v1.column) = {
    column_name: "updated_at"
    is_updated_at: true
  }];
}

message InvoiceLineItem {
  option (acme.billing.v1.table) = {
    table_name: "invoice_line_items"
    schema_name: "billing"
    migration_order: 20
    is_table: true
    tenant_column: "org_id"
  };

  string line_item_id = 1 [(acme.billing.v1.column) = {
    column_name: "line_item_id"
    is_primary_key: true
  }];
  string org_id = 2 [(acme.billing.v1.column) = {
    column_name: "org_id"
    tenant_column: true
  }];
  string invoice_id = 3 [(acme.billing.v1.column) = {
    column_name: "invoice_id"
    foreign_key: "billing.invoices(invoice_id)"
  }];
  string description = 4 [(acme.billing.v1.column) = { column_name: "description" }];
  int64 unit_price = 5 [(acme.billing.v1.column) = { column_name: "unit_price" }];
  int32 quantity = 6 [(acme.billing.v1.column) = { column_name: "quantity" }];
}

message Product {
  option (acme.billing.v1.table) = {
    table_name: "products"
    schema_name: "billing"
    migration_order: 5
    is_table: true
  };

  option (acme.billing.v1.vector_store) = {
    backend: VECTOR_BACKEND_QDRANT
    collection_name: "acme_products"
    dimension: 768
    distance: VECTOR_DISTANCE_COSINE
  };

  string product_id = 1 [(acme.billing.v1.column) = {
    column_name: "product_id"
    is_primary_key: true
  }];
  string name = 2 [(acme.billing.v1.column) = { column_name: "name" }];
  string description = 3 [(acme.billing.v1.column) = { column_name: "description" }];
  int64 price_cents = 4 [(acme.billing.v1.column) = { column_name: "price_cents" }];
  string sku = 5 [(acme.billing.v1.column) = { column_name: "sku" }];
}

message BillingDocument {
  option (acme.billing.v1.object_store) = {
    backend: OBJECT_BACKEND_S3
    bucket: "acme-billing-documents"
    path_prefix: "invoices/"
    server_side_encryption: true
    presigned_read: true
    presigned_write: true
    presigned_ttl_seconds: 300
  };

  string document_id = 1;
  string invoice_id = 2;
  string object_key = 3;
  string content_type = 4;
  int64 size_bytes = 5;
}
