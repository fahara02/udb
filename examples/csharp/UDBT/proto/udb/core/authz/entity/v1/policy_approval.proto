syntax = "proto3";

package udb.core.authz.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "Udb.Core.Authz.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/authz/entity/v1;authzv1";
option java_package = "com.udb.core.authz.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Authz\\Entity\\V1";
option php_namespace = "Udb\\Core\\Authz\\Entity\\V1";

// A single reviewer/approver decision recorded against a PolicyDraft (Phase K
// draft/approval workflow). Separation of duties is enforced in the handler: the
// draft author cannot record an APPROVE decision (author != approver). Each row
// is one actor's REVIEWER/APPROVER decision with a mandatory reason.
//
// ⚠️ CROSS-SESSION: field set reconstructed to EXACTLY match the governance
// session's `governance_store.rs::load_approval` struct literal (the source of
// truth). The governance-session owner should confirm / restore their canonical
// file.
message PolicyApproval {
  option (udb.core.common.v1.pg_table) = {
    table_name: "policy_approvals"
    schema_name: "udb_authz"
    migration_order: 32
    is_table: true
    comment: "Reviewer/approver decisions over policy drafts"
    soft_delete: false
    audit_fields: true
    enable_rls: true
    indexes: {
      index_name: "idx_policy_approvals_tenant_draft"
      index_type: "BTREE"
      columns: "tenant_id"
      columns: "draft_id"
    }
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true)::text)"
      permissive: true
    }
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "tenant_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "none"
    retention_class: "authz.governance"
    retention_days: 2555
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  string approval_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "approval_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];
  string draft_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "draft_id" sql_type: "UUID" not_null: true comment: "FK to policy_drafts.draft_id" foreign_key: { references_table: "policy_drafts" references_schema: "udb_authz" references_column: "draft_id" on_delete: REFERENTIAL_ACTION_CASCADE constraint_name: "fk_policy_approvals_draft_id" } index: { index_name: "idx_policy_approvals_draft" index_type: "BTREE" columns: "draft_id" } }];
  string tenant_id = 3 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" tenant_column: true sql_type: "VARCHAR(64)" not_null: true index: { index_name: "idx_policy_approvals_tenant" index_type: "BTREE" } }];
  string actor = 4 [(udb.core.common.v1.pg_column) = { column_name: "actor" sql_type: "VARCHAR(160)" not_null: true comment: "Reviewer/approver principal" }];
  string role = 5 [(udb.core.common.v1.pg_column) = { column_name: "role" sql_type: "VARCHAR(20)" not_null: true comment: "REVIEWER/APPROVER" }];
  string decision = 6 [(udb.core.common.v1.pg_column) = { column_name: "decision" sql_type: "VARCHAR(20)" not_null: true comment: "APPROVE/REJECT/REQUEST_CHANGES" }];
  string reason = 7 [(udb.core.common.v1.pg_column) = { column_name: "reason" sql_type: "VARCHAR(500)" not_null: true comment: "Mandatory justification for the decision" }];
  google.protobuf.Timestamp created_at = 8 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true exclude_from_update: true }];
}
