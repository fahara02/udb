syntax = "proto3";

package udb.core.authz.events.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "Udb.Core.Authz.Events.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/authz/events/v1;authzeventsv1";
option java_package = "com.udb.core.authz.events.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Authz\\Events\\V1";
option php_namespace = "Udb\\Core\\Authz\\Events\\V1";

// ---------------------------------------------------------------------------
// Authz Domain Events
// Topics: udb.core.authz.<noun>.<verb>.v1
// ---------------------------------------------------------------------------

// Kafka topic: udb.authz.role.assigned.v1
message RoleAssignedEvent {
  option (udb.core.common.v1.message_event_contract) = {
    event_type: "udb.core.authz.events.v1.RoleAssignedEvent"
    outbox_topic: "udb.authz.role.assigned.v1"
    partition_key_field: "tenant_id"
    payload_redaction_profile: "standard"
    delivery_guarantee: "at_least_once"
    replay_compatibility: "stable"
  };
  string event_id = 1;
  string user_role_id = 2;
  string user_id = 3;
  string role_id = 4;
  string role_code = 5;
  string tenant_id = 6;
  string assigned_by = 7;
  google.protobuf.Timestamp occurred_at = 8;
  string domain = 9;
  string project_id = 10;
  string access_surface = 11;
}

