    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:embedding:delete-source"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "embedding.DeleteSource"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "delete_source" rest_operation_id: "deleteEmbeddingSource"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "embedding"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "embedding"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "embedding.DeleteSource"
      outbox_topic: "udb.embedding.source.deleted.v1"
      partition_key_field: "source_name"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/embedding/sources:delete"
      body: "*"
    };
  }

  // Enqueue embedding work for the source's EXISTING rows. The per-row work
  // enumeration runs in the leader-spawned work emitter, which calls the same
  // `udb.embedding.work.v1` emit path the CDC change handler uses.
  rpc Backfill(BackfillRequest) returns (BackfillResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:embedding:backfill"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "embedding.Backfill"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "backfill" rest_operation_id: "backfillEmbeddingSource"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "embedding"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "embedding"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "embedding.Backfill"
      outbox_topic: "udb.embedding.backfill.requested.v1"
      partition_key_field: "source_name"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/embedding/sources:backfill"
      body: "*"
    };
  }

  // SIDECAR CALLBACK (internal only). A sidecar that computed an embedding for a
  // source row returns the dense vector here; the broker upserts it through the
  // shared asset vector-upsert seam, tagged with the VERIFIED claim tenant (a
  // vector with no/foreign tenant is rejected — no fail-open). `internal_grpc_only`
  // restricts this to a loopback peer; it is never exposed in an SDK facade.
  rpc ReportEmbedding(ReportEmbeddingRequest) returns (ReportEmbeddingResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:embedding:report-embedding"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "embedding.ReportEmbedding"
      request_context_required: true
      tenant_required: true
      internal_grpc_only: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: false
      method_alias: "report_embedding"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "embedding"
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "embedding"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
  }

  // Deadline-bounded semantic search over a source's vector collection. DELEGATES
  // to the SearchService (9.5) hybrid-search seam with a server-side tenant filter
  // injected from the verified claim. The broker never embeds the query (the
  // caller supplies an already-embedded `query_vector`); it never issues a raw
  // engine query. Returns `deadline_exceeded` if the gRPC deadline is past.
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:embedding:retrieve"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "embedding.Retrieve"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "retrieve" rest_operation_id: "retrieveEmbedding"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "embedding"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "embedding"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/embedding:retrieve"
      body: "*"
    };
  }

  rpc RegisterModel(RegisterModelRequest) returns (RegisterModelResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = { mode: AUTH_MODE_BEARER scopes: "udb:embedding:register-model" allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT allowed_credential_types: CREDENTIAL_TYPE_SESSION decision_resource: "embedding.RegisterModel" request_context_required: true tenant_required: true };
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "register_model" rest_operation_id: "registerEmbeddingModel" required_credential_provider: "udb" default_deadline_ms: 30000 default_max_attempts: 3 server_only: true boilerplate_recipe_tags: "embedding" generate_minimal_example: true };
    option (udb.core.common.v1.method_dependency_contract) = { required_native_services: "embedding" required_backends: "postgres" required_env: "UDB_NATIVE_SERVICES_ENABLED" required_env: "UDB_GRPC_TARGET" };
    option (google.api.http) = { post: "/v1/embedding/models:register" body: "*" };
  }

