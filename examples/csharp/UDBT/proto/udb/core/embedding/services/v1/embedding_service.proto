enum FusionStrategy {
  FUSION_STRATEGY_UNSPECIFIED = 0;
  FUSION_STRATEGY_RRF = 1;
  FUSION_STRATEGY_WEIGHTED = 2;
  FUSION_STRATEGY_DBSF = 3;
}

enum RerankStrategy {
  RERANK_STRATEGY_UNSPECIFIED = 0;
  RERANK_STRATEGY_CROSS_ENCODER = 1;
  RERANK_STRATEGY_LATE_INTERACTION = 2;
}

