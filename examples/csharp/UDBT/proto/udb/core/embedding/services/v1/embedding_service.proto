syntax = "proto3";

package udb.core.embedding.services.v1;

import "google/api/annotations.proto";
import "udb/core/common/v1/dto.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "Udb.Core.Embedding.Services.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/embedding/services/v1;embeddingservicev1";
option java_package = "com.udb.core.embedding.services.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Embedding\\Services\\V1";
option php_namespace = "Udb\\Core\\Embedding\\Services\\V1";

// EmbeddingService (master-plan 9.11) — the AI data plane. Registers tenant-scoped
// source entities to vector-index on change. INFERENCE RUNS IN SIDECARS ONLY: no
// embedding model is ever linked into the broker. On a source row change (and on
// Backfill) the broker emits a `udb.embedding.work.v1` event carrying ONLY the row
// primary key + extracted text (NEVER credentials); a sidecar computes the vector
// and returns it via the internal-only `ReportEmbedding` callback, which upserts
// it through the shared asset vector-upsert seam tagged with the verified tenant.
// `Retrieve` delegates to the SearchService (9.5) hybrid-search seam with a
// server-side tenant filter — never a raw vector query.
service EmbeddingService {
  option (udb.core.common.v1.native_service) = {
    service_id: "embedding"
    logical_service_id: "embedding"
    proto_service_id: "embedding"
    display_name: "Embeddings"
    category: "embedding"
    default_enabled: true
    requires_postgres: true
    control_plane_listener_allowed: true
    sdk_facade_name: "embedding"
    cli_scaffold_group: "embedding"
    health_check_ref: "embedding"
    capability_ref: "native.embedding"
  };
  option (udb.core.common.v1.service_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "embedding"
    generate_minimal_example: true
  };
  option (udb.core.common.v1.service_cli_scaffold) = {
    scaffold_package: "embedding"
    import_path: "udb/native/embedding"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
    generated_files: "udb.native.embedding.config"
    required_native_services: "embedding"
    secret_placeholders: "UDB_API_KEY"
    smoke_test_command: "udb native lint"
  };
  option (udb.core.common.v1.service_dependency_contract) = {
    required_native_services: "embedding"
    required_backends: "postgres"
    required_env: "UDB_NATIVE_SERVICES_ENABLED"
    required_env: "UDB_GRPC_TARGET"
  };

  // Register a tenant-scoped source to vector-index on change. Fails closed
  // (failed_precondition) when the source table has no resolvable tenant column.
  rpc RegisterSource(RegisterSourceRequest) returns (RegisterSourceResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:embedding:register-source"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "embedding.RegisterSource"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "register_source" rest_operation_id: "registerEmbeddingSource"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "embedding"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "embedding"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.method_event_contract) = {
      event_type: "embedding.RegisterSource"
      outbox_topic: "udb.embedding.source.registered.v1"
      partition_key_field: "source_name"
      payload_redaction_profile: "standard"
      delivery_guarantee: "at_least_once"
      replay_compatibility: "stable"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {
      post: "/v1/embedding/sources:register"
      body: "*"
    };
  }

  // List the calling tenant's registered sources.
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse) {
    option (udb.core.common.v1.operation_kind) = OPERATION_KIND_READ_ONLY;
    option (udb.core.common.v1.endpoint_security) = {
      mode: AUTH_MODE_BEARER
      scopes: "udb:embedding:list-sources"
      allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT
      allowed_credential_types: CREDENTIAL_TYPE_SESSION
      decision_resource: "embedding.ListSources"
      request_context_required: true
      tenant_required: true
    };
    option (udb.core.common.v1.sdk_surface) = {
      include_in_facade: true
      method_alias: "list_sources" rest_operation_id: "listEmbeddingSources"
      required_credential_provider: "udb"
      default_deadline_ms: 30000
      default_max_attempts: 3
      server_only: true
      boilerplate_recipe_tags: "embedding"
      generate_minimal_example: true
    };
    option (udb.core.common.v1.method_dependency_contract) = {
      required_native_services: "embedding"
      required_backends: "postgres"
      required_env: "UDB_NATIVE_SERVICES_ENABLED"
      required_env: "UDB_GRPC_TARGET"
    };
    option (udb.core.common.v1.rest_contract) = {
      response_envelope: true
      api_error: true
      explicit_nulls: true
    };
    option (google.api.http) = {get: "/v1/embedding/sources"};
  }

