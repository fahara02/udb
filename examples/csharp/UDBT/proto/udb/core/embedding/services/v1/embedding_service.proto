    option (udb.core.common.v1.endpoint_security) = { mode: AUTH_MODE_BEARER scopes: "udb:embedding:update-model" allowed_credential_types: CREDENTIAL_TYPE_BEARER_JWT allowed_credential_types: CREDENTIAL_TYPE_SESSION decision_resource: "embedding.SetModelStatus" request_context_required: true tenant_required: true };
    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "set_model_status" rest_operation_id: "setEmbeddingModelStatus" required_credential_provider: "udb" default_deadline_ms: 30000 default_max_attempts: 3 server_only: true boilerplate_recipe_tags: "embedding" };
