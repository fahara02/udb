message RetrieveRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "embedding"
    generate_minimal_example: true
  };
  string tenant_id = 1;
  string source_name = 2;
  // Optional lexical query; when present alongside query_vector, the delegated
  // search runs hybrid (lexical + vector) fusion.
  string query_text = 3;
  // Already-embedded query vector (the broker never embeds the query).
  repeated float query_vector = 4;
  int32 top_k = 5;
  // Optional caller-supplied metadata filter (Qdrant-style JSON object with
  // `must` / `should` / `must_not` condition arrays), merged UNDER the mandatory
  // server-side tenant clause. The verified `_tenant_id` `must` clause is always
  // applied first and cannot be broadened by this filter; conditions referencing
  // any internal `_`-prefixed payload key are rejected. Example:
  // `{"must":[{"key":"doc_type","match":{"value":"invoice"}}]}`.
  string filter_json = 6;
  // Optional per-query minimum similarity score a hit must clear to be returned.
  // RAISES (never lowers) the server-side floor, so a caller can demand
  // higher-precision results per query; <= 0 uses the server default. Applies to
  // both the vector and hybrid paths.
  double score_threshold = 7;
  bool include_vectors = 8;
  MmrConfig mmr = 9;
  FusionStrategy fusion = 10;
  int32 prefetch_limit = 11;
  RerankConfig rerank = 12;
  string vector_name = 13;
  int32 parent_window = 14;
  bool include_citations = 15;
}

message RetrieveHit {
  string id = 1;
  double score = 2;
  string payload_json = 3; // JSON
  repeated float vector = 4;
  string source_name = 5;
  string parent_pk = 6;
  int32 chunk_seq = 7;
  string document_id = 8;
  string doc_version = 9;
  string vector_name = 10;
  double rerank_score = 11;
}

message RetrieveResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "embedding"
    generate_minimal_example: true
  };
  repeated RetrieveHit hits = 1;
  string message = 2;
  udb.core.common.v1.ApiError error = 3;
  int64 index_lag_ms = 4;
  bool rerank_applied = 5;
  string evaluation_id = 6;
}

