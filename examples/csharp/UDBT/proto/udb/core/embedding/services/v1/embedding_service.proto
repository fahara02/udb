    option (udb.core.common.v1.sdk_surface) = { include_in_facade: true method_alias: "delete_model" rest_operation_id: "deleteEmbeddingModel" required_credential_provider: "udb" default_deadline_ms: 30000 default_max_attempts: 3 server_only: true boilerplate_recipe_tags: "embedding" generate_minimal_example: true };
    option (udb.core.common.v1.method_dependency_contract) = { required_native_services: "embedding" required_backends: "postgres" required_env: "UDB_NATIVE_SERVICES_ENABLED" required_env: "UDB_GRPC_TARGET" };
    option (google.api.http) = { post: "/v1/embedding/models:delete" body: "*" };
  }

  rpc SetModelStatus(SetModelStatusRequest) returns (SetModelStatusResponse) {
