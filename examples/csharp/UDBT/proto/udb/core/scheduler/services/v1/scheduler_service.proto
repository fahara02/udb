message CreateJobRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "scheduler"
    generate_minimal_example: true
  };
  string tenant_id = 1;
  string project_id = 2;
  string name = 3;
  // "CRON" or "ONE_SHOT".
  string schedule_type = 4;
  // Cron expression (required for CRON jobs).
  string cron_expression = 5;
  // RFC3339 first/only fire time (required for ONE_SHOT jobs; optional CRON seed).
  string next_fire_at = 6;
  // Opaque JSON payload delivered with each fired event.
  string payload = 7;
  string target_topic = 8;
  int32 max_attempts = 9;
  int32 backoff_seconds = 10;
}

