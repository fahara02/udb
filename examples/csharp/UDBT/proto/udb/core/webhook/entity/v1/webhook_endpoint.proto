syntax = "proto3";

package udb.core.webhook.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";
import "udb/core/common/v1/types.proto";

option csharp_namespace = "Udb.Core.Webhook.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/webhook/entity/v1;webhookv1";
option java_package = "com.udb.core.webhook.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Webhook\\Entity\\V1";
option php_namespace = "Udb\\Core\\Webhook\\Entity\\V1";

// ---------------------------------------------------------------------------
// WebhookEndpoint — a per-tenant external HTTP delivery target (master-plan
// 9.4). The broker delivers tenant-scoped domain events (CDC/outbox) to the
// outside world by POSTing the event body to `url`, signed with the
// per-endpoint `signing_secret` (HMAC-SHA256 → `X-Udb-Signature`). The
// subscription `topic_pattern` selects which topics this endpoint receives, but
// delivery is ALWAYS bound to this row's `tenant_id` (never pattern-only): an
// event is delivered only when its payload tenant matches `tenant_id`, so a
// tenant can never subscribe to another tenant's events. RLS scopes rows to the
// current tenant. The signing secret is OUTPUT_VIEW_STORAGE_ONLY — it is
// returned exactly once at creation and never surfaced by the read layer again.
// ---------------------------------------------------------------------------
message WebhookEndpoint {
  option (udb.core.common.v1.pg_table) = {
    table_name: "webhook_endpoints"
    schema_name: "udb_webhook"
    migration_order: 1
    is_table: true
    comment: "Per-tenant external webhook delivery targets (master-plan 9.4)"
    soft_delete: true
    audit_fields: true
    enable_rls: true
    force_rls: true
    rls_policies: {
      policy_name: "webhook_tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true) OR current_setting('app.platform_admin', true) = 'true')"
      permissive: true
    }
    indexes: {
      index_name: "idx_webhook_endpoints_tenant"
      index_type: "BTREE"
      columns: "tenant_id"
    }
    indexes: {
      index_name: "idx_webhook_endpoints_tenant_active"
      index_type: "BTREE"
      columns: "tenant_id"
      columns: "active"
    }
    cdc_topic: "udb.webhook.webhook_endpoints.cdc"
    required_scope: "webhook:read"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "tenant_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "soft_delete"
    retention_class: "webhook.operational"
    retention_days: 2555
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  string endpoint_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "endpoint_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  string tenant_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" tenant_column: true sql_type: "UUID" not_null: true }];

  // The external HTTPS delivery target. Validated by the SSRF guard at WRITE
  // time and again (DNS rebinding) at DELIVERY time: https-only, never a host
  // resolving to a private/loopback/link-local/CGNAT range.
  string url = 3 [(udb.core.common.v1.pg_column) = { column_name: "url" sql_type: "TEXT" not_null: true }];

  // Topic subscription pattern (`*`, `udb.*`, or an exact topic). Selects which
  // topics reach this endpoint; delivery is still tenant-bound to `tenant_id`.
  string topic_pattern = 4 [(udb.core.common.v1.pg_column) = { column_name: "topic_pattern" sql_type: "VARCHAR(255)" not_null: true default_value: "'*'" }];

  // Per-endpoint HMAC signing secret. STORAGE_ONLY: never surfaced by the
  // generated read/redaction layer (returned once at creation, like an API key).
  string signing_secret = 5 [(udb.core.common.v1.pg_column) = { column_name: "signing_secret" sql_type: "TEXT" not_null: true comment: "Per-endpoint HMAC-SHA256 signing secret" }, (udb.core.common.v1.sensitive) = true, (udb.core.common.v1.log_redacted) = true, (udb.core.common.v1.db_column_security) = { secret_classification: SECRET_CLASSIFICATION_TOKEN output_view: OUTPUT_VIEW_STORAGE_ONLY redaction_strategy: REDACTION_STRATEGY_REDACT encryption_key_class: "webhook-signing" uniqueness_scope: "tenant" }];

  // When false the endpoint is paused: no events are delivered to it.
  bool active = 6 [(udb.core.common.v1.pg_column) = { column_name: "active" sql_type: "BOOLEAN" not_null: true default_value: "true" }];

  // Human-readable label for the endpoint.
  string description = 7 [(udb.core.common.v1.pg_column) = { column_name: "description" sql_type: "VARCHAR(512)" }];

  // Maximum delivery attempts before a delivery is dead-lettered
  // (`udb.webhook.delivery.dead.v1`) and journaled DEAD.
  int32 max_attempts = 8 [(udb.core.common.v1.pg_column) = { column_name: "max_attempts" sql_type: "INTEGER" not_null: true default_value: "5" }];

  string metadata_json = 9 [(udb.core.common.v1.pg_column) = { column_name: "metadata_json" sql_type: "JSONB" is_json: true not_null: true default_value: "'{}'::jsonb" comment: "Non-secret endpoint metadata for audit and routing" }];

  udb.core.common.v1.AuditInfo audit_info = 10 [(udb.core.common.v1.pg_column) = { column_name: "audit_info" sql_type: "JSONB" not_null: true default_value: "'{}'::jsonb" is_json: true comment: "Audit trail stored as JSON" }];

  google.protobuf.Timestamp deleted_at = 11 [(udb.core.common.v1.pg_column) = { column_name: "deleted_at" sql_type: "TIMESTAMPTZ" comment: "Soft delete timestamp" }];
  string deleted_by = 12 [(udb.core.common.v1.pg_column) = { column_name: "deleted_by" sql_type: "UUID" comment: "Soft delete actor" }];
}
