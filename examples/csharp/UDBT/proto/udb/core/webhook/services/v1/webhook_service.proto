    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "webhook"
    generate_minimal_example: true
  };
  udb.core.webhook.entity.v1.WebhookEndpoint endpoint = 1;
  udb.core.common.v1.ApiError error = 2;
}

message ListEndpointsRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "webhook"
    generate_minimal_example: true
  };
  string tenant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  bool active_only = 4;
  // Opaque pagination token returned by ListEndpointsResponse.next_page_token.
  string page_token = 5;
}

message ListEndpointsResponse {
