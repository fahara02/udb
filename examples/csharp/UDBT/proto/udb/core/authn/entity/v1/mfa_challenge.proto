syntax = "proto3";

package udb.core.authn.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/authn/entity/v1/enums.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "Udb.Core.Authn.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/authn/entity/v1;authnv1";
option java_package = "com.udb.core.authn.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Authn\\Entity\\V1";
option php_namespace = "Udb\\Core\\Authn\\Entity\\V1";

// ---------------------------------------------------------------------------
// MfaChallenge — first-class step-up challenge record (I1, I2.6).
//
// A challenge id is minted server-side and bound to user/tenant/project/factor,
// the device fingerprint, and the masked source IP. Verification consumes the
// row atomically (single-use) and rejects expired/consumed/over-attempt
// challenges, defeating replay and race attempts.
//
// Migration order 24.
// ---------------------------------------------------------------------------
message MfaChallenge {
  option (udb.core.common.v1.pg_table) = {
    table_name: "mfa_challenges"
    schema_name: "udb_authn"
    migration_order: 24
    is_table: true
    comment: "First-class step-up MFA challenge records (single-use, atomic consume)"
    soft_delete: false
    audit_fields: false
    enable_rls: true
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true)::text)"
      permissive: true
    }
    indexes: {
      index_name: "idx_mfa_challenges_user"
      index_type: "BTREE"
      columns: "user_id"
    }
    indexes: {
      index_name: "idx_mfa_challenges_expires"
      index_type: "BTREE"
      columns: "expires_at"
    }
    replica_hint: "primary"
    required_scope: "authn:mfa-challenges:read"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "tenant_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "none"
    retention_class: "authn.security"
    retention_days: 30
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
  };

  string challenge_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "challenge_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  string user_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "user_id" sql_type: "VARCHAR(160)" not_null: true }];

  string tenant_id = 3 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" tenant_column: true sql_type: "VARCHAR(64)" not_null: true }];

  string project_id = 4 [(udb.core.common.v1.pg_column) = { column_name: "project_id" sql_type: "VARCHAR(120)" }];

  AuthFactorKind factor_kind = 5 [(udb.core.common.v1.pg_column) = { column_name: "factor_kind" sql_type: "VARCHAR(30)" not_null: true default_value: "'AUTH_FACTOR_KIND_UNSPECIFIED'" }];

  // VARCHAR(64): the enum NAME is persisted; the longest value
  // (`MFA_CHALLENGE_PURPOSE_SENSITIVE_OPERATION`, 41 chars) overflowed the
  // former VARCHAR(40), failing every IssueMfaChallenge. bug_report.md A1.
  MfaChallengePurpose purpose = 6 [(udb.core.common.v1.pg_column) = { column_name: "purpose" sql_type: "VARCHAR(64)" not_null: true default_value: "'MFA_CHALLENGE_PURPOSE_LOGIN_STEP_UP'" }];

  // Keyed-HMAC digest of the device fingerprint the challenge is bound to.
  string device_fingerprint_hash = 7 [(udb.core.common.v1.pg_column) = { column_name: "device_fingerprint_hash" sql_type: "VARCHAR(128)" comment: "Bound device fingerprint digest" }, (udb.core.common.v1.sensitive) = true, (udb.core.common.v1.log_redacted) = true, (udb.core.common.v1.db_column_security) = { secret_classification: SECRET_CLASSIFICATION_TOKEN output_view: OUTPUT_VIEW_STORAGE_ONLY redaction_strategy: REDACTION_STRATEGY_REDACT hashing_algorithm: "hmac-sha256" encryption_key_class: "authn-token" }];

  string ip_address_masked = 8 [(udb.core.common.v1.pg_column) = { column_name: "ip_address_masked" sql_type: "VARCHAR(64)" comment: "Masked source IP prefix" }, (udb.core.common.v1.pii) = true, (udb.core.common.v1.log_masked) = true];

  int32 attempt_count = 9 [(udb.core.common.v1.pg_column) = { column_name: "attempt_count" sql_type: "INTEGER" not_null: true default_value: "0" }];

  google.protobuf.Timestamp expires_at = 10 [(udb.core.common.v1.pg_column) = { column_name: "expires_at" sql_type: "TIMESTAMPTZ" not_null: true }];

  google.protobuf.Timestamp consumed_at = 11 [(udb.core.common.v1.pg_column) = { column_name: "consumed_at" sql_type: "TIMESTAMPTZ" }];

  google.protobuf.Timestamp created_at = 12 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "CURRENT_TIMESTAMP" exclude_from_insert: true exclude_from_update: true }];
}
