syntax = "proto3";

package udb.core.authn.entity.v1;

import "google/protobuf/timestamp.proto";
import "udb/core/common/v1/db.proto";
import "udb/core/common/v1/security.proto";

option csharp_namespace = "Udb.Core.Authn.Entity.V1";
option go_package = "github.com/udb-project/udb/gen/go/udb/core/authn/entity/v1;authnv1";
option java_package = "com.udb.core.authn.entity.v1";
option php_metadata_namespace = "Udb\\GPBMetadata\\Core\\Authn\\Entity\\V1";
option php_namespace = "Udb\\Core\\Authn\\Entity\\V1";

// ---------------------------------------------------------------------------
// ServiceAccountGrant — the TYPED, durable, operator-approved scope grant for a
// service account (UDB-AUTH-003/006). Security policy no longer lives in the
// mutable free-form `users.profile_attributes_json`: a grant row is the single
// authoritative source of a service account's immutable service identity,
// tenant/project binding, and approved scope set, consumed by password login,
// API-key creation/authentication, token refresh, and mTLS certificate
// bindings through ONE shared validation helper. Admin/owner/wildcard scopes
// are rejected at write time and again at every read (defense in depth).
// Mutations require authn administrative scopes and produce durable audit
// events; `revision` increments on every replace so dependent credentials can
// detect stale grants.
// ---------------------------------------------------------------------------
message ServiceAccountGrant {
  option (udb.core.common.v1.pg_table) = {
    table_name: "service_account_grants"
    schema_name: "udb_authn"
    migration_order: 26
    is_table: true
    comment: "Typed operator-approved scope grants for service accounts"
    soft_delete: false
    audit_fields: true
    enable_rls: true
    rls_policies: {
      policy_name: "tenant_isolation"
      using: "(tenant_id::text = current_setting('app.current_tenant_id', true)::text)"
      permissive: true
    }
    indexes: {
      index_name: "idx_service_account_grants_identity"
      columns: "service_identity"
      unique: true
    }
    indexes: {
      index_name: "idx_service_account_grants_user"
      columns: "user_id"
      unique: true
    }
    cdc_topic: "udb.authn.service_account_grants.cdc"
    required_scope: "authn:grants:read"
    replica_hint: "primary"
  };
  option (udb.core.common.v1.db_table_security) = {
    tenant_isolation_mode: "tenant"
    tenant_column: "tenant_id"
    rls_policy_template: "tenant_id = current_setting('app.current_tenant_id')"
    soft_delete_mode: "none"
    retention_class: "authn.policy"
    audit_mode: AUDIT_MODE_MUTATION
    encryption_profile: "tenant"
    pii_profile: "standard"
    export_eligible: false
    data_residency_policy_ref: "tenant.data_residency"
  };

  // Server-assigned UUID identifying this grant row.
  string grant_id = 1 [(udb.core.common.v1.pg_column) = { column_name: "grant_id" sql_type: "UUID" primary_key: true not_null: true default_value: "gen_random_uuid()" }];

  // The owning service-account user (exactly one grant per account).
  string user_id = 2 [(udb.core.common.v1.pg_column) = { column_name: "user_id" sql_type: "UUID" not_null: true comment: "FK to udb_authn.users.user_id" foreign_key: { references_table: "users" references_column: "user_id" references_schema: "udb_authn" on_delete: REFERENTIAL_ACTION_CASCADE } }];

  // The IMMUTABLE service identity (e.g. a SPIFFE URI or stable service name).
  // Unique across the deployment; rotation is an explicit audited operation
  // that revokes dependent credentials, never an in-place edit.
  string service_identity = 3 [(udb.core.common.v1.pg_column) = { column_name: "service_identity" sql_type: "VARCHAR(512)" not_null: true }];

  // Same canonical tenant identifier type as authn User.tenant_id.
  string tenant_id = 4 [(udb.core.common.v1.pg_column) = { column_name: "tenant_id" tenant_column: true sql_type: "VARCHAR(120)" not_null: true index: { index_name: "idx_service_account_grants_tenant" index_type: "BTREE" } }];

  string project_id = 5 [(udb.core.common.v1.pg_column) = { column_name: "project_id" sql_type: "VARCHAR(255)" not_null: true default_value: "''" }];

  // Operator-approved scopes (JSON array of strings). Admin/owner/wildcard
  // scopes are rejected at write time; validation re-rejects on every read.
  string approved_scopes_json = 6 [(udb.core.common.v1.pg_column) = { column_name: "approved_scopes_json" sql_type: "JSONB" is_json: true not_null: true default_value: "'[]'" }];

  // ACTIVE | REVOKED. Only ACTIVE grants authenticate.
  string status = 7 [(udb.core.common.v1.pg_column) = { column_name: "status" sql_type: "VARCHAR(20)" not_null: true default_value: "'ACTIVE'" index: { index_name: "idx_service_account_grants_status" index_type: "BTREE" } }];

  // Monotonic revision, incremented on every replace, so dependent credential
  // caches and certificate bindings can detect stale grants.
  int64 revision = 8 [(udb.core.common.v1.pg_column) = { column_name: "revision" sql_type: "BIGINT" not_null: true default_value: "1" }];

  // Audit provenance: the administrative principal and reason for the last
  // create/replace/revoke.
  string updated_by = 9 [(udb.core.common.v1.pg_column) = { column_name: "updated_by" sql_type: "VARCHAR(255)" not_null: true default_value: "''" }];
  string reason = 10 [(udb.core.common.v1.pg_column) = { column_name: "reason" sql_type: "VARCHAR(1024)" not_null: true default_value: "''" }];

  google.protobuf.Timestamp created_at = 11 [(udb.core.common.v1.pg_column) = { column_name: "created_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "now()" }];
  google.protobuf.Timestamp updated_at = 12 [(udb.core.common.v1.pg_column) = { column_name: "updated_at" sql_type: "TIMESTAMPTZ" not_null: true default_value: "now()" }];
}
