message SendNotificationRequest {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
    default_deadline_ms: 30000
    default_max_attempts: 3
    server_only: true
    boilerplate_recipe_tags: "notification"
    generate_minimal_example: true
  };
  string event_type = 1; // Must match a template event_type
  string recipient_id = 2;
  string recipient_address = 3; // Resolved by caller or looked up in User service
  string tenant_id = 4;
  string project_id = 5;
  string resource_type = 6;
  string resource_id = 7;
  string resource_name = 8;
  string correlation_id = 9;
  string locale = 10; // Defaults to 'en'
  map<string, string> variables = 11; // Template variable substitutions
  repeated udb.core.notification.entity.v1.NotificationChannel channels = 12; // Empty = use template-default channels
  udb.core.common.v1.RequestContext context = 13;
}

message SendNotificationResponse {
  option (udb.core.common.v1.message_sdk_surface) = {
    include_in_facade: true
    required_credential_provider: "udb"
