# nginx in front of the UDB broker: TLS on :443, gRPC routed by path.
#
#   /udb.services.v1.DataBroker/...   -> udb:50051  data plane
#   /grpc.health.v1.Health/...        -> udb:50051  health of the data plane
#   /udb.core.<service>/...           -> udb:50061  native control plane (auth, authz, storage, ...)
#   anything else                     -> gRPC UNIMPLEMENTED, never forwarded
#
# The broker listens in plaintext on the compose network only. Clients use one
# address (this server, :443) for both planes; the path decides the upstream.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # gRPC status from the upstream trailer next to the HTTP status.
    log_format grpc '$remote_addr [$time_local] "$request" $status '
                    'grpc_status=$upstream_trailer_grpc_status '
                    'rt=$request_time upstream=$upstream_addr';
    access_log /dev/stdout grpc;
    error_log  /dev/stderr warn;

    # Docker's embedded DNS. Upstreams are resolved per request (variables in
    # grpc_pass), so a recreated broker container with a new IP is picked up
    # without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Container-local liveness for the compose health check (not published).
    server {
        listen 127.0.0.1:8080;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        # The broker's own gRPC message cap is 10 MiB (UDB_GRPC_MAX_MESSAGE_BYTES).
        # nginx counts the whole request body, so a client stream (an upload)
        # is limited to this in total. Raise it if you stream larger uploads
        # through the broker instead of presigned URLs.
        client_max_body_size 32m;
        client_body_timeout  300s;

        # Unary calls finish in well under a minute. Streams (BeginTx,
        # LiveQuery, CDC/event subscriptions, DownloadFile) stay open; nginx
        # closes one after grpc_read_timeout without an upstream message.
        # Raise it if your subscriptions sit idle longer.
        grpc_connect_timeout 5s;
        grpc_send_timeout    300s;
        grpc_read_timeout    300s;

        # Real client address for the broker's rate limiter (the broker trusts
        # these only with UDB_TRUST_PROXY_IP_HEADERS=true). Overwritten, never
        # appended, so a client cannot inject its own value.
        grpc_set_header X-Real-IP       $remote_addr;
        grpc_set_header X-Forwarded-For $remote_addr;

        # Upstream down or timed out: answer in gRPC terms (UNAVAILABLE /
        # DEADLINE_EXCEEDED) so SDK retries behave, instead of an HTML 502.
        error_page 502 503 = /_grpc_unavailable;
        error_page 504     = /_grpc_deadline;

        location /udb.services.v1.DataBroker/ {
            set $udb_data udb:50051;
            grpc_pass grpc://$udb_data;
        }

        location /grpc.health.v1.Health/ {
            set $udb_data udb:50051;
            grpc_pass grpc://$udb_data;
        }

        location /udb.core. {
            set $udb_native udb:50061;
            grpc_pass grpc://$udb_native;
        }

        # HTTPS liveness for an external load balancer.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /_grpc_unavailable {
            internal;
            default_type application/grpc;
            add_header grpc-status 14 always;
            add_header grpc-message "udb broker unavailable" always;
            add_header content-length 0 always;
            return 204;
        }

        location = /_grpc_deadline {
            internal;
            default_type application/grpc;
            add_header grpc-status 4 always;
            add_header grpc-message "udb broker did not answer in time" always;
            add_header content-length 0 always;
            return 204;
        }

        # Everything else: reflection, unknown services, browsers.
        location / {
            default_type application/grpc;
            add_header grpc-status 12 always;
            add_header grpc-message "not routed by this proxy" always;
            add_header content-length 0 always;
            return 204;
        }
    }
}
