<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" role="img" aria-labelledby="title desc">
  <title id="title">UDB public data plane and native control plane</title>
  <desc id="desc">Applications use the public DataBroker listener. Trusted gateways use a separate native control-plane listener protected by verified admin bearer tokens.</desc>
  <defs>
    <style>
      .bg{fill:#fbfdff}.frame{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}.panel{fill:#f8fafc;stroke:#dbe4ef;stroke-width:1.2}.card{stroke-width:2;rx:8}.client{fill:#cffafe;stroke:#0891b2}.public{fill:#dbeafe;stroke:#2563eb}.auth{fill:#ede9fe;stroke:#7c3aed}.guard{fill:#fff2c2;stroke:#d97706}.backend{fill:#dcfce7;stroke:#15803d}.event{fill:#ffedd5;stroke:#ea580c}.title{font:700 23px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#0f172a}.text{font:700 14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#0f172a}.small{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#475569}.label{font:700 12px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;letter-spacing:1px;fill:#64748b}.line{stroke:#475569;stroke-width:2;fill:none}.dash{stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 5;fill:none}.eventLine{stroke:#ea580c;stroke-width:2;stroke-dasharray:6 5;fill:none}.node{cursor:pointer}.node:hover .card,.node:focus .card{stroke-width:3;filter:url(#shadow)}.node:hover text,.node:focus text{text-decoration:underline}
    </style>
    <filter id="shadow" x="-10%" y="-25%" width="120%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
  </defs>
  <rect class="bg" width="1240" height="500" rx="14"/>
  <rect class="frame" x="20" y="20" width="1200" height="460" rx="14"/>
  <text class="title" x="48" y="58">Public data plane and native control plane</text>
  <text class="small" x="48" y="82">The control-plane listener is separate from DataBroker and enforces descriptor-driven method security.</text>

  <g class="node" tabindex="0">
    <title>Application SDKs call the public DataBroker service.</title>
    <rect class="card client" x="54" y="150" width="190" height="72"/>
    <text class="text" x="149" y="181" text-anchor="middle">App / SDK</text>
    <text class="small" x="149" y="202" text-anchor="middle">data-plane client</text>
  </g>
  <g class="node" tabindex="0">
    <title>A trusted gateway or service mesh calls native auth/admin RPCs.</title>
    <rect class="card client" x="54" y="318" width="190" height="72"/>
    <text class="text" x="149" y="349" text-anchor="middle">Trusted PEP</text>
    <text class="small" x="149" y="370" text-anchor="middle">gateway / mesh</text>
  </g>

  <rect class="panel" x="312" y="112" width="548" height="300" rx="10"/>
  <text class="label" x="336" y="140">UDB PROCESS</text>
  <g class="node" tabindex="0">
    <title>Public listener for the 79 RPC DataBroker service.</title>
    <rect class="card public" x="344" y="164" width="480" height="70"/>
    <text class="text" x="584" y="193" text-anchor="middle">Public listener</text>
    <text class="small" x="584" y="214" text-anchor="middle">DataBroker, 79 RPCs, request authorization</text>
  </g>
  <g class="node" tabindex="0">
    <title>Method security validates credentials, tenant and project scope, and action policy.</title>
    <rect class="card guard" x="344" y="258" width="480" height="48"/>
    <text class="text" x="584" y="287" text-anchor="middle">Descriptor method security + tenant binding</text>
  </g>
  <g class="node" tabindex="0">
    <title>Native auth/admin listener. Default is loopback on the DataBroker port plus 10.</title>
    <rect class="card auth" x="344" y="326" width="480" height="66"/>
    <text class="text" x="584" y="352" text-anchor="middle">Native control-plane listener</text>
    <text class="small" x="584" y="372" text-anchor="middle">27 native services, 303 RPCs</text>
  </g>

  <g class="node" tabindex="0">
    <title>Runtime backend plugins for SQL, vector, object, cache, document, graph, and column stores.</title>
    <rect class="card backend" x="976" y="150" width="210" height="78"/>
    <text class="text" x="1081" y="181" text-anchor="middle">Backend plugins</text>
    <text class="small" x="1081" y="202" text-anchor="middle">18 known backend kinds</text>
  </g>
  <g class="node" tabindex="0">
    <title>Kafka receives CDC outbox records and native auth or notification events when configured.</title>
    <rect class="card event" x="976" y="318" width="210" height="78"/>
    <text class="text" x="1081" y="349" text-anchor="middle">Kafka / outbox</text>
    <text class="small" x="1081" y="370" text-anchor="middle">CDC + native events</text>
  </g>

  <path class="line" d="M244 186 H340" marker-end="url(#arrow)"/><text class="small" x="262" y="171">data RPCs</text>
  <path class="line" d="M244 354 H340" marker-end="url(#arrow)"/><text class="small" x="257" y="380">auth/admin RPCs</text>
  <path class="line" d="M584 306 V322" marker-end="url(#arrow)"/>
  <path class="dash" d="M584 326 V238" marker-end="url(#arrowV)"/><text class="small" x="602" y="251">Authorize / GetNativeAccess</text>
  <path class="line" d="M824 198 H972" marker-end="url(#arrow)"/><text class="small" x="866" y="183">typed and generic ops</text>
  <path class="line" d="M824 358 C900 350 902 208 972 194" marker-end="url(#arrow)"/><text class="small" x="872" y="285">native access DSN</text>
  <path class="eventLine" d="M824 220 C900 248 910 334 972 354" marker-end="url(#arrowO)"/><text class="small" x="866" y="318">CDC outbox relay</text>
  <path class="eventLine" d="M824 364 H972" marker-end="url(#arrowO)"/><text class="small" x="862" y="388">auth/notification events</text>
</svg>
