<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc">
  <title id="title">UDB architecture pipeline</title>
  <desc id="desc">Project protobuf files flow through parsing, catalog generation, artifacts, runtime authorization, routing, and backend execution.</desc>
  <defs>
    <style>
      .bg{fill:#fbfdff}.frame{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}.lane{fill:#f8fafc;stroke:#dbe4ef;stroke-width:1.2}.card{stroke-width:2;rx:8}.amber{fill:#fff2c2;stroke:#d97706}.violet{fill:#ede9fe;stroke:#7c3aed}.teal{fill:#ccfbf1;stroke:#0f766e}.blue{fill:#dbeafe;stroke:#2563eb}.green{fill:#dcfce7;stroke:#15803d}.orange{fill:#ffedd5;stroke:#ea580c}.ink{fill:#0f172a}.muted{fill:#475569}.title{font:700 23px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}.label{font:700 12px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;letter-spacing:1px;fill:#64748b}.text{font:700 14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}.small{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}.line{stroke:#64748b;stroke-width:2;fill:none}.dash{stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 5;fill:none}.chip{fill:#ffffff;stroke:#94a3b8;stroke-width:1}.node{cursor:pointer}.node:hover .card,.node:focus .card{stroke-width:3;filter:url(#shadow)}.node:hover text,.node:focus text{text-decoration:underline}
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="bg" width="1240" height="560" rx="14"/>
  <rect class="frame" x="20" y="20" width="1200" height="520" rx="14"/>

  <text class="title ink" x="48" y="58">UDB architecture</text>
  <text class="small muted" x="48" y="82">Proto annotations become an activated catalog, then every request follows the same authorized runtime path.</text>

  <text class="label" x="48" y="126">BUILD TIME</text>
  <rect class="lane" x="48" y="140" width="1144" height="130" rx="10"/>
  <g class="node" tabindex="0">
    <title>Project-owned protobuf files with UDB annotations.</title>
    <rect class="card amber" x="78" y="174" width="190" height="62"/>
    <text class="text ink" x="173" y="199" text-anchor="middle">Project .proto</text>
    <text class="small muted" x="173" y="218" text-anchor="middle">schema + annotations</text>
  </g>
  <g class="node" tabindex="0">
    <title>The parser builds an AST and extracts UDB options.</title>
    <rect class="card blue" x="318" y="174" width="190" height="62"/>
    <text class="text ink" x="413" y="199" text-anchor="middle">Parser + AST</text>
    <text class="small muted" x="413" y="218" text-anchor="middle">lexer, options, checks</text>
  </g>
  <g class="node" tabindex="0">
    <title>The catalog manifest is the normalized broker view: tables, stores, security, and checksum.</title>
    <rect class="card violet" x="558" y="174" width="210" height="62"/>
    <text class="text ink" x="663" y="199" text-anchor="middle">CatalogManifest</text>
    <text class="small muted" x="663" y="218" text-anchor="middle">tables, stores, checksum</text>
  </g>
  <g class="node" tabindex="0">
    <title>Generated outputs include lint, drift reports, SQL DDL, migration plans, and SDK stubs.</title>
    <rect class="card teal" x="818" y="174" width="334" height="62"/>
    <text class="text ink" x="985" y="199" text-anchor="middle">Generation</text>
    <text class="small muted" x="985" y="218" text-anchor="middle">lint, drift, migrations, SQL DDL, SDKs</text>
  </g>
  <path class="line" d="M268 205 H314" marker-end="url(#arrow)"/>
  <path class="line" d="M508 205 H554" marker-end="url(#arrow)"/>
  <path class="line" d="M768 205 H814" marker-end="url(#arrow)"/>

  <path class="dash" d="M663 236 V318" marker-end="url(#arrowV)"/>
  <text class="small muted" x="680" y="286">activate catalog after migration and drift checks</text>

  <text class="label" x="48" y="344">RUNTIME PER REQUEST</text>
  <rect class="lane" x="48" y="358" width="1144" height="128" rx="10"/>
  <g class="node" tabindex="0">
    <title>Request metadata is converted into a security context.</title>
    <rect class="card blue" x="78" y="392" width="176" height="62"/>
    <text class="text ink" x="166" y="417" text-anchor="middle">Security</text>
    <text class="small muted" x="166" y="436" text-anchor="middle">JWT, mTLS, tenant</text>
  </g>
  <g class="node" tabindex="0">
    <title>Authorization evaluates RBAC, ABAC, ReBAC, scopes, tenant, and operation.</title>
    <rect class="card violet" x="294" y="392" width="176" height="62"/>
    <text class="text ink" x="382" y="417" text-anchor="middle">Authorization</text>
    <text class="small muted" x="382" y="436" text-anchor="middle">RBAC, ABAC, ReBAC</text>
  </g>
  <g class="node" tabindex="0">
    <title>Channel admission applies limits, fairness, and backpressure.</title>
    <rect class="card amber" x="510" y="392" width="176" height="62"/>
    <text class="text ink" x="598" y="417" text-anchor="middle">Admission</text>
    <text class="small muted" x="598" y="436" text-anchor="middle">limits, fairness</text>
  </g>
  <g class="node" tabindex="0">
    <title>Requests are planned or lowered to neutral IR and routed to a backend target.</title>
    <rect class="card teal" x="726" y="392" width="176" height="62"/>
    <text class="text ink" x="814" y="417" text-anchor="middle">Plan + route</text>
    <text class="small muted" x="814" y="436" text-anchor="middle">neutral IR</text>
  </g>
  <g class="node" tabindex="0">
    <title>Backend plugins execute operations against one of 18 known backend kinds.</title>
    <rect class="card green" x="942" y="392" width="176" height="62"/>
    <text class="text ink" x="1030" y="417" text-anchor="middle">Backend plugins</text>
    <text class="small muted" x="1030" y="436" text-anchor="middle">18 backend kinds</text>
  </g>
  <path class="line" d="M254 423 H290" marker-end="url(#arrow)"/>
  <path class="line" d="M470 423 H506" marker-end="url(#arrow)"/>
  <path class="line" d="M686 423 H722" marker-end="url(#arrow)"/>
  <path class="line" d="M902 423 H938" marker-end="url(#arrow)"/>

  <rect class="card orange" x="78" y="500" width="1040" height="28"/>
  <text class="small ink" x="94" y="519">Side effects: metrics, audit records, CDC outbox, projection tasks, saga state, DLQ records.</text>
</svg>
