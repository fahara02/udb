# coturn TURN/STUN relay for the UDB native WebRTC service.
#
# The broker's TurnService mints short-lived REST credentials
# (username = "<expiry-unix>:<peer>", credential = base64(HMAC-SHA1(secret, username)))
# and coturn validates them against the SAME shared secret via `use-auth-secret`.
# Set UDB_TURN_SECRET identically for the broker and this container.
#
#   $env:UDB_TURN_SECRET = "<a-strong-shared-secret>"
#   docker compose -f docker/coturn/docker-compose.yml up -d
#   # then run the broker with the same UDB_TURN_SECRET and, optionally,
#   # UDB_TURN_URLS="turn:<host>:3478,stun:<host>:3478"
#
# Host networking is recommended in production so coturn can advertise the real
# relay address; for local dev the published ports below are enough.
services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Pass config as flags so the shared secret comes from the environment
    # (coturn's .conf file does not expand env vars).
    command:
      - -n                                   # no config file; use these flags
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${UDB_TURN_SECRET:-udb-dev-turn-secret}
      - --realm=${UDB_TURN_REALM:-udb}
      - --no-multicast-peers
      - --min-port=49160
      - --max-port=49200
      - --no-cli
    ports:
      - "${UDB_TURN_LISTEN_PORT:-3478}:3478/udp"
      - "${UDB_TURN_LISTEN_PORT:-3478}:3478/tcp"
      - "${UDB_TURN_TLS_PORT:-5349}:5349/tcp"
      - "49160-49200:49160-49200/udp"        # relay range (keep small for dev)
