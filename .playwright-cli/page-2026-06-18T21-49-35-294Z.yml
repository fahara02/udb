      - generic [ref=e58]: Why UDB exists
      - heading "One policy-aware contract in front of every backend" [level=2] [ref=e59]
      - paragraph [ref=e60]:
        - text: "Most growing products end up with user data in Postgres, search in Elasticsearch, embeddings in a vector store, files in object storage, cache in Redis, analytics in ClickHouse — and the same security headers, retry rules, schema versions, RLS policies, and audit trails re-implemented in every service. UDB puts that contract in one place: describe your domain in normal"
        - code [ref=e61]: .proto
        - text: files, annotate where data lives, and run one broker. Your app sends
        - strong [ref=e62]: “select invoices”
        - text: ","
        - strong [ref=e63]: “upsert this customer”
        - text: ","
        - strong [ref=e64]: “search these vectors”
        - text: ", or"
        - strong [ref=e65]: “can this user read this resource?”
        - text: — the broker checks the request, resolves the active catalog, talks to the right backend, and returns a typed response.
