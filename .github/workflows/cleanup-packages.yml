name: Cleanup · Stale packages

# Inventory only. Untagged versions can be live OCI child or attestation manifests.
# Safe pruning requires OCI reachability from every retained tagged root; tags
# alone and digest-name retention regexes do not establish that a version is stale.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      keep_sha_tags:
        description: "Compatibility hint reported only; no package versions are deleted"
        required: false
        default: "5"
      dry_run:
        description: "Compatibility input; inventory is always read-only, even when false"
        required: false
        type: boolean
        default: true

permissions:
  packages: read

jobs:
  cleanup-docker:
    name: GHCR inventory · ghcr.io/fahara02/udb
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'         ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Read-only bounded GHCR inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_HINT: ${{ github.event.inputs.keep_sha_tags || '5' }}
          REQUESTED_DRY_RUN: ${{ github.event.inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'No package versions are deleted by this workflow.'
          printf '%s\n' 'Untagged versions may be live OCI children; pruning requires retained-root reachability.'
          printf '%s\n' "Retention hint (inventory only): $RETENTION_HINT"
          printf '%s\n' "Requested dry_run (inventory remains read-only): $REQUESTED_DRY_RUN"
          printf '%s\n' 'Inventory is limited to the first 100 versions; it is not a deletion plan.'
          timeout 60s gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "/users/fahara02/packages/container/udb/versions?per_page=100&page=1" \
            --jq '.[] | {id, name, created_at, tags: .metadata.container.tags}'
