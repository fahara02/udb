name: CI

# Adapted from the former monorepo CI for the
# standalone repo layout: everything lives at the repo root (no
# `working-directory: udb`), protos are at `proto/`, and SDK stubs
# come from the root `buf generate` / CLI-backed SDK generation path.
#
# Chapter 15 cutover (CI workflow consolidation): this file now implements the
# PR-gate + Integration dependency graphs from docs/ci-architecture.md:
#   - ONE fast `quick-gate` (fmt + buf-lint + buf-breaking + version + source posture)
#     is the single dependency of every EXPENSIVE job; cheap jobs stay
#     dependency-free at t=0 and self-fail.
#   - the broker is built ONCE (`build-broker`) and shared to the smoke job via
#     same-run upload/download-artifact (build-once).
#   - `grpc-reflection-smoke` + `load-smoke` are merged into one `smoke` job.
#   - live all-SDK/all-RPC coverage is owned by the post-release benchmark; CI
#     keeps the offline SDK conformance and facade sequence gates.
#   - feature-matrix.yml is folded in here: a 3-build SUBSET on PR; the FULL
#     18-feature matrix + platform/aarch64/optimized builds run only on
#     `push: main`.
# Shared primitives live in .github/actions/* and .github/workflows/_live-sdk-suite.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_BINARY_FEATURES: >-
    postgres,mysql,sqlite,qdrant,s3,mongodb-native,neo4j,clickhouse,redis,elasticsearch,weaviate,pinecone,azureblob,gcs,otel,runtime-logging,http-client,oidc,webauthn
  # The broker feature tier the smoke job runs against. Built ONCE by
  # build-broker and downloaded by consumers (no per-job rebuild).
  LIVE_BROKER_FEATURES: postgres,mongodb-native,s3,kafka,qdrant,runtime-logging

jobs:
  # ── Quick gate: the ONE fast dependency of every expensive job ─────
  # fmt + buf lint + buf breaking + version consistency + cheap source posture.
  # These are the cheapest + most-common failures; keep this < ~2 min so a
  # trivial mistake reports before any broker/feature compile starts. The
  # advisory clippy, full rust build/test, buf stub drift, and launcher-
  # conformance checks stay in their own dependency-free jobs below.
  quick-gate:
    name: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          install-build-deps: "false"
          cache-key: quick-gate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.65.0
          buf_api_token: ${{ secrets.BUF_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: buf lint
        run: buf lint
      - name: buf breaking (against origin/main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"
      - name: Version consistency
        run: node scripts/check-versions.mjs
      - name: SDK service-coverage guard
        run: |
          python3 scripts/check-sdk-service-coverage.py --selftest
          python3 scripts/check-sdk-service-coverage.py
      - name: Vector canonical CAS posture guard
        run: |
          python3 scripts/check-vector-cas-posture.py --selftest
          python3 scripts/check-vector-cas-posture.py
      - name: ORM template posture guard
        run: |
          python3 scripts/check-orm-template-posture.py --selftest
          python3 scripts/check-orm-template-posture.py
      - name: Workflow service posture guard
        run: |
          python3 scripts/check-workflow-service-posture.py --selftest
          python3 scripts/check-workflow-service-posture.py
      - name: IR live-golden posture guard
        run: |
          python3 scripts/check-ir-live-golden-posture.py --selftest
          python3 scripts/check-ir-live-golden-posture.py
      - name: Scaffold posture guard
        run: |
          python3 scripts/check-scaffold-posture.py --selftest
          python3 scripts/check-scaffold-posture.py
      - name: SDK helper parity guard
        run: |
          python3 scripts/check-sdk-helper-parity.py --selftest
          python3 scripts/check-sdk-helper-parity.py
      - name: Todo-board status guard
        run: |
          python3 scripts/check-todo-board-status.py --selftest
          python3 scripts/check-todo-board-status.py
      - name: Gap-closure posture guard
        run: |
          python3 scripts/check-gap-closure-posture.py --selftest
          python3 scripts/check-gap-closure-posture.py
      - name: Bench harness posture guard
        run: |
          node --check scripts/gen-bench-bodies-skeleton.mjs
          node scripts/gen-bench-bodies-skeleton.mjs --selftest
          node scripts/gen-bench-bodies-skeleton.mjs --check
          node --check scripts/gen-sdk-benchmark-docs.mjs
          node scripts/gen-sdk-benchmark-docs.mjs --check
          python3 scripts/check-bench-harness-posture.py --selftest
          python3 scripts/check-bench-harness-posture.py
      - name: Docs/CI freshness posture guard
        run: |
          python3 scripts/check-docs-ci-freshness-posture.py --selftest
          python3 scripts/check-docs-ci-freshness-posture.py
      - name: Go SDK posture guard
        run: |
          python3 scripts/check-go-sdk-posture.py --selftest
          python3 scripts/check-go-sdk-posture.py
      - name: TypeScript SDK posture guard
        run: |
          python3 scripts/check-ts-sdk-posture.py --selftest
          python3 scripts/check-ts-sdk-posture.py
      - name: Python/PHP SDK posture guard
        run: |
          python3 scripts/check-python-php-sdk-posture.py --selftest
          python3 scripts/check-python-php-sdk-posture.py
      - name: Java/C# SDK audit guard
        run: |
          python3 scripts/check-java-csharp-sdk-audit.py --selftest
          python3 scripts/check-java-csharp-sdk-audit.py
      - name: API/SDK alias posture guard
        run: |
          python3 scripts/check-api-sdk-alias-posture.py --selftest
          python3 scripts/check-api-sdk-alias-posture.py
      - name: OpenAPI operation-id posture guard
        run: |
          python3 scripts/check-openapi-operationid-posture.py --selftest
          python3 scripts/check-openapi-operationid-posture.py
      - name: Idempotency dedup posture guard
        run: |
          python3 scripts/check-idempotency-dedup-posture.py --selftest
          python3 scripts/check-idempotency-dedup-posture.py
      - name: Retry-safe mutation posture guard
        run: |
          python3 scripts/check-retry-safe-posture.py --selftest
          python3 scripts/check-retry-safe-posture.py
      - name: Error-detail posture guard
        run: |
          python3 scripts/check-error-detail-posture.py --selftest
          python3 scripts/check-error-detail-posture.py
      - name: HTTP API route-style guard
        run: |
          node --check scripts/check-http-api-style.mjs
          node scripts/check-http-api-style.mjs --selftest
          node scripts/check-http-api-style.mjs --source-only
          node scripts/check-http-api-style.mjs --write-report
          git diff --quiet -- docs/generated/http-api-style-exceptions.json docs/generated/http-api-style-exceptions.md
          node scripts/check-http-api-style.mjs --advisory
          node scripts/check-http-api-style.mjs --resource-identity-contract
          node scripts/check-http-api-style.mjs --pagination-contract
          node scripts/check-http-api-style.mjs --query-update-contract
          python3 scripts/rest_route_gateway_smoke.py --selftest
          python3 scripts/rest_route_gateway_smoke.py --check-openapi
      - name: Beta versioning posture guard
        run: |
          python3 scripts/check-beta-versioning-posture.py --selftest
          python3 scripts/check-beta-versioning-posture.py
  # ── Clippy advisory: visible but not on the required quick-gate lane ─────
  clippy-advisory:
    name: Clippy advisory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          install-build-deps: "false"
          cache-key: clippy-advisory
      - name: Clippy (advisory for v0.1; promote to -D warnings post-cleanup)
        # 120 pre-existing clippy lints on the v0.1 baseline. Soft-fail so the
        # required PR gate stays fast + green; flip to `-D warnings` once the
        # count is zero.
        continue-on-error: true
        run: cargo clippy --locked --all-targets

  # ── Rust build + test across OSes (cheap-ish; dependency-free) ─────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: rust-${{ matrix.os }}
      - name: Build all targets
        run: cargo build --locked --all-targets
      - name: Compile tests and benches
        run: cargo test --locked --no-run --all-targets
      - name: Test UDB library
        run: cargo test --locked --lib
      - name: Native contract manifest drift + lint (F13 hard gate)
        # Phase 0A: the committed native-contract manifest must match the
        # descriptor, and `native lint` must report zero error-severity
        # findings. Runs once on Linux to avoid CRLF/path skew.
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -q --bin udb -- native manifest > docs/generated/udb-native-contract.json
          if ! git diff --quiet -- docs/generated/udb-native-contract.json; then
            echo "::error::Native contract manifest is stale. Run 'udb native manifest > docs/generated/udb-native-contract.json' and commit."
            git diff -- docs/generated/udb-native-contract.json | sed -n '1,120p'
            exit 1
          fi
          cargo run --locked -q --bin udb -- native lint
      - name: Native docs markdown drift
        # Mirror of the JSON gate above for docs/generated/native-services.md.
        # `udb native docs` renders the markdown table from the same embedded
        # descriptor; the committed file must match byte-for-byte (the
        # `generated_native_docs_match_embedded_descriptor` unit test pins the
        # same equality, but this gate catches a stale committed file on any
        # path that does not run the lib tests). Runs once on Linux to avoid
        # CRLF skew.
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -q --bin udb -- native docs > docs/generated/native-services.md
          if ! git diff --quiet -- docs/generated/native-services.md; then
            echo "::error::Native docs markdown is stale. Run 'udb native docs > docs/generated/native-services.md' and commit."
            git diff -- docs/generated/native-services.md | sed -n '1,120p'
            exit 1
          fi
      - name: Doc service-count drift guard
        # The README + docs/native-services.md native-service/RPC counts must
        # match the generated contract (they silently drifted before: prose said
        # "6 services, 77 RPCs" while the contract had grown to 15/186). Runs on
        # the same Linux job that just regenerated the contract manifest.
        if: runner.os == 'Linux'
        run: |
          python3 scripts/check-doc-service-counts.py --selftest
          python3 scripts/check-doc-service-counts.py
      - name: No internal tables guard (masterplan §12)
        # Published SDK helpers must not use GenericDispatch to run SQL against
        # internal udb_* control-plane schemas. The legitimate raw binding
        # (generated client) and all test/harness files are excluded; native
        # state repair goes through served RPCs (device-via-Login, env-gated
        # FAILED-log, EnsureBaseline). Lands after those broker replacements so
        # it does not red the harness prematurely.
        if: runner.os == 'Linux'
        run: |
          python3 scripts/check-no-internal-tables.py --selftest
          python3 scripts/check-no-internal-tables.py
      - name: Codebase map freshness gate
        # docs/generated/codebase-map.md is the agent-facing module-dependency
        # graph + public-symbol index (consumed by the udb-coding skill).
        # Generated truth like the contract JSON — regenerate with:
        #   python scripts/generate-codebase-map.py
        if: runner.os == 'Linux'
        run: python3 scripts/generate-codebase-map.py --check
      - name: Native contract breaking-change gate (Phase 3)
        # Diff the live descriptor contract against the committed baseline and fail
        # on auth/db/sdk/event-breaking or removed surface. Intentional breaks bump
        # NATIVE_CONTRACT_VERSION and regenerate the baseline:
        #   udb native contract-baseline --baseline docs/generated/contract-baseline.bin
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -q --bin udb -- native contract-diff \
            --baseline docs/generated/contract-baseline.bin

  # ── Build the broker ONCE, share via same-run artifact ────────────
  # Builds the live feature tier consumed by smoke.
  # The smoke job runs the postgres-only reflection/load probes, which the
  # live tier is a superset of, so one binary covers both consumers (15.6).
  build-broker:
    name: build-broker
    needs: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build-broker-live
      - name: Build udb (live tier)
        run: cargo build --locked --bin udb --no-default-features --features "${LIVE_BROKER_FEATURES}"
      - name: Stage binary for upload
        run: |
          mkdir -p artifact
          cp target/debug/udb artifact/udb
      - name: Upload broker binary
        uses: actions/upload-artifact@v4
        with:
          name: udb-broker-debug
          path: artifact/udb
          if-no-files-found: error

  # ── Smoke: merged gRPC reflection + load smoke against the SAME broker ─
  # (15.6.3) grpc-reflection-smoke + load-smoke shared an identical broker +
  # postgres service + env + launch; they are now one job that downloads the
  # build-broker artifact and runs both probes against one launched broker.
  # Reflection gates the service surface; the load step gates p99 regression
  # against the tracked native-load smoke baseline while still uploading raw
  # ghz output on failure.
  smoke:
    name: smoke
    needs: build-broker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: udb_ci
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udb -d udb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      UDB_PG_DSN: postgres://udb:udb@localhost:5432/udb_ci
      UDB_GRPC_ADDR: 127.0.0.1:50051
      UDB_METRICS_ADDR: 127.0.0.1:19090
      UDB_ABAC_DEFAULT_ALLOW: "true"
      UDB_CDC_ENABLED: "false"
      UDB_PROJECTION_WORKER_ENABLED: "false"
      UDB_RECONCILIATION_ENABLED: "false"
      UDB_SAGA_RECOVERY_ENABLED: "false"
      UDB_STARTUP_FORCE_SYNC: "true"
      UDB_STARTUP_DRY_RUN: "true"
      UDB_AUDIT_SINK_URL: file:///tmp/udb-audit.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install ghz + grpcurl
        run: |
          go install github.com/bojand/ghz/cmd/ghz@latest
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
      - name: Download broker binary
        uses: actions/download-artifact@v4
        with:
          name: udb-broker-debug
          path: target/debug
      - name: Mark broker executable
        run: chmod +x target/debug/udb
      - name: Launch broker
        uses: ./.github/actions/launch-broker
        with:
          bin: target/debug/udb
          grpc-addr: 127.0.0.1:50051
          log-file: /tmp/udb-server.log
      - name: Verify reflection surface
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/go/bin/grpcurl" -plaintext 127.0.0.1:50051 list | tee /tmp/grpcurl-list.txt
          grep -q '^udb.services.v1.DataBroker$' /tmp/grpcurl-list.txt
          "$HOME/go/bin/grpcurl" -plaintext 127.0.0.1:50051 describe udb.services.v1.DataBroker | tee /tmp/grpcurl-describe.txt
          grep -q 'rpc GetHealthReport' /tmp/grpcurl-describe.txt
          grep -q 'rpc LookupMessageSchema' /tmp/grpcurl-describe.txt
      - name: Run native load smoke + p99 regression gate
        # Exercises the write / fan-out / CDC RPCs the load scripts claim to
        # cover against the REAL broker (urgent_fix.md #29). Placeholder-id
        # fast-reject exit codes are advisory, but missing measurements or
        # >15% p99 regressions fail the build.
        shell: bash
        env:
          UDB_TARGET: 127.0.0.1:50051
          UDB_INSECURE: "true"
          UDB_LOAD_CONCURRENCY: "2"
          UDB_LOAD_TOTAL: "20"
          UDB_LOAD_TENANT_ID: load-tenant
          UDB_LOAD_PROJECT_ID: load-project
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          set +e
          bash scripts/native-load-test.sh | tee /tmp/native-load.txt
          load_status=${PIPESTATUS[0]}
          set -e
          if [ "$load_status" -ne 0 ]; then
            echo "::warning::native-load-test.sh exited ${load_status}; p99 gate will fail if output is partial or unparsable"
          fi
          python scripts/native_load_gate.py \
            --input /tmp/native-load.txt \
            --baseline scripts/native_load_smoke_baseline.json \
            --max-regression 15
      - name: Upload load summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-load-smoke
          path: /tmp/native-load.txt
          if-no-files-found: ignore
      - name: Stop broker
        if: always()
        shell: bash
        run: |
          if [ -n "${UDB_BROKER_PID:-}" ]; then
            kill "${UDB_BROKER_PID}" 2>/dev/null || true
          fi

  # ── Shipped binary feature gate: portable broker + real OIDC/WebAuthn ─────
  # Platform/target coverage of the full release feature set. Heavy (4 OSes),
  # so it runs ONLY on push: main (integration), not on every PR. The PR-side
  # feature signal is feature-check below.
  auth-release-binary:
    name: Auth binary (${{ matrix.asset }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: darwin-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: auth-${{ matrix.target }}
      - name: Check shipped auth binary feature set
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            msvc_bin="$(cygpath -u "${VCToolsInstallDir}bin\\Hostx64\\x64")"
            export PATH="${msvc_bin}:/c/Strawberry/perl/bin:/c/Program Files/NASM:${PATH}"
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="${msvc_bin}/link.exe"
          fi
          cargo check --locked --target ${{ matrix.target }} \
            --bin udb \
            --no-default-features --features "${RELEASE_BINARY_FEATURES}"

  # ── Slim postgres-only build + dep-graph guard ────────────────────
  slim-build:
    name: Slim build (postgres-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: slim-postgres
      - name: Build slim (no-default-features, postgres only)
        run: cargo build --locked --all-targets --no-default-features --features postgres
      - name: Verify slim dependency graph
        shell: bash
        run: bash scripts/ci_slim_dep_guard.sh

  # ── PR feature subset (folded from feature-matrix.yml) ────────────
  # (15.8.1) PR runs only coverage not already owned by rust/slim-build so a
  # feature break shows without paying for all 18 permutations. fail-fast:true. The
  # FULL matrix runs on push: main (plugin-feature-matrix below).
  feature-check:
    name: Feature check (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    needs: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: all-features
            run: cargo test --locked --all-features --lib
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: feature-check-${{ matrix.name }}
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # ── Per-backend plugin feature builds (full matrix) ───────────────
  # (15.8.1) The FULL 18-feature permutation matrix runs ONLY on push: main
  # (integration), fail-fast:false so one failing leg never hides the others.
  plugin-feature-matrix:
    name: Plugin feature (${{ matrix.feature }})
    if: github.event_name == 'push'
    needs: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature:
          - qdrant
          - s3
          - mongodb
          - mongodb-native
          - neo4j
          - clickhouse
          - redis
          - elasticsearch
          - memcached
          - mssql
          - weaviate
          - pinecone
          - cassandra
          - azureblob
          - gcs
          - kafka
          - otel
          - runtime-logging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: plugin-${{ matrix.feature }}
      - name: Build postgres + plugin feature
        run: cargo build --locked --all-targets --no-default-features --features "postgres,${{ matrix.feature }}"

  # ── Optimized acceleration features (folded from feature-matrix.yml) ─
  # (15.8.1) SIMD acceleration + scalar-equivalence tests. Integration-only.
  optimized:
    name: Optimized (SIMD accel)
    if: github.event_name == 'push'
    needs: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: optimized
      - run: cargo test --locked --lib --features simd-codecs,simd-json,simd-checksum runtime::accel

  # ── AArch64 scalar accel compile (folded from feature-matrix.yml) ──
  # (15.8.1) Proves the acceleration layer's scalar fallback builds on a
  # non-x86 target. Integration-only.
  aarch64-scalar:
    name: AArch64 scalar
    if: github.event_name == 'push'
    needs: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          target: aarch64-unknown-linux-gnu
          cache-key: aarch64-scalar
          install-build-deps: "false"
      - name: Install AArch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - run: cargo check --locked --target aarch64-unknown-linux-gnu --no-default-features --features postgres
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

  # ── Supply-chain: cargo-deny + vendored postgres-replication audit ─
  supply-chain:
    name: Supply chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny advisories (advisory)
        # RUSTSEC advisories can land against transitive dependencies
        # before upstream crates publish a compatible fix. Keep this
        # visible without blocking the stable policy gates below.
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-musl
        with:
          manifest-path: Cargo.toml
          command: check advisories
      - name: cargo-deny policy gates
        uses: EmbarkStudios/cargo-deny-action@v2
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-musl
        with:
          manifest-path: Cargo.toml
          command: check bans licenses sources
      - name: Verify vendored postgres-replication provenance
        shell: bash
        run: |
          set -euo pipefail
          expected_rev='31acf55c7e5c2244e5bb3a36e7afa2a01bf52c38'

          # 1. Vendored postgres-replication module must be intact —
          #    sources, NOTICE.md (referencing the fork rev), and
          #    dual MIT/Apache-2.0 LICENSES for attribution.
          for required in \
            src/runtime/cdc/postgres_replication/mod.rs \
            src/runtime/cdc/postgres_replication/protocol.rs \
            src/runtime/cdc/postgres_replication/NOTICE.md \
            src/runtime/cdc/postgres_replication/LICENSES/LICENSE-MIT \
            src/runtime/cdc/postgres_replication/LICENSES/LICENSE-APACHE; do
            if [ ! -f "$required" ]; then
              echo "::error ::vendored postgres-replication is missing $required"
              exit 1
            fi
          done
          if ! grep -q "$expected_rev" src/runtime/cdc/postgres_replication/NOTICE.md; then
            echo "::error ::NOTICE.md does not reference fork rev $expected_rev"
            exit 1
          fi

          # 2. Cargo.toml must NOT redeclare postgres-replication as an
          #    external dep — the vendored module owns that crate name.
          if grep -E '^postgres-replication\s*=' Cargo.toml; then
            echo "::error ::Cargo.toml has an external postgres-replication dep; remove it — the vendored copy in src/runtime/cdc/postgres_replication/ is authoritative"
            exit 1
          fi

          # 3. Published crates must build from crates.io sources only. Keep
          #    any upstream-fork provenance documented in NOTICE.md, not as a
          #    Cargo patch that would be stripped during packaging.
          if grep -q '^\[patch\.crates-io\]' Cargo.toml; then
            echo "::error ::Cargo.toml must not use [patch.crates-io] for the publishable package"
            exit 1
          fi
          if grep -q 'git = ' Cargo.toml; then
            echo "::error ::Cargo.toml must not use git dependencies for the publishable package"
            exit 1
          fi

  # ── buf: build + verify committed stubs are current (drift) ───────
  # lint + breaking moved to quick-gate (the fast gate). This job keeps the
  # heavier stub-generation drift checks dependency-free.
  buf:
    name: Proto (buf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          # Pin to the exact buf version that produced the committed
          # stubs so the drift check below is a real, hard-fail gate
          # (header re-rendering / whitespace skew across buf versions
          # is what previously forced a soft-fail).
          version: 1.65.0
          buf_api_token: ${{ secrets.BUF_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf build
      - name: Verify committed stubs are current
        # `--include-imports` emits the vendored `google/api/*` annotation
        # stubs alongside the UDB stubs into every SDK's `gen/` tree, so
        # published SDKs are self-contained (no external googleapis dep).
        # The committed stubs MUST match this output exactly — drift is a
        # hard failure: regenerate locally with the same command and commit.
        run: |
          for attempt in 1 2 3; do
            if buf generate --include-imports; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::buf generate failed, retrying remote plugin generation (attempt $attempt/3)"
            sleep $((attempt * 20))
          done
          # Deterministic OpenAPI metadata fixup (title/version/scope) so the
          # committed swagger matches generation output (TODO_PASS2 #144/#145).
          node scripts/openapi-postprocess.mjs
          node --check scripts/check-openapi-api-rules.mjs
          node scripts/check-openapi-api-rules.mjs --selftest
          node scripts/check-openapi-api-rules.mjs
          node scripts/sdk-codegen-postprocess.mjs
          if ! git diff --quiet -- sdk/php/gen sdk/go/gen sdk/typescript/gen sdk/python/gen sdk/java/gen sdk/csharp/gen api; then
            echo "::error::Committed SDK stubs are stale. Run 'buf generate --include-imports' and commit the result."
            git diff -- sdk/php/gen sdk/go/gen sdk/typescript/gen sdk/python/gen sdk/java/gen sdk/csharp/gen api | sed -n '1,200p'
            git diff --stat -- sdk/php/gen sdk/go/gen sdk/typescript/gen sdk/python/gen sdk/java/gen sdk/csharp/gen api
            exit 1
          fi
      - name: Authn/Authz inventory drift (Phase 0A)
        # The committed RPC + sensitive-field inventories must match the protos.
        run: |
          node scripts/generate-authn-authz-inventory.mjs
          if ! git diff --quiet -- docs/generated/authn-authz-rpc-inventory.md docs/generated/authn-authz-sensitive-fields.md; then
            echo "::error::authn/authz inventory is stale. Run 'node scripts/generate-authn-authz-inventory.mjs' and commit docs/generated/."
            git diff --stat -- docs/generated/authn-authz-rpc-inventory.md docs/generated/authn-authz-sensitive-fields.md
            exit 1
          fi

  # ── PHP / Laravel SDK: composer + pest ────────────────────────────
  php-sdk:
    name: PHP SDK (pest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          php: "true"
      - name: Cache composer deps
        uses: actions/cache@v4
        with:
          path: sdk/php/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('sdk/php/composer.json') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
      - name: composer analyse (PHPStan)
        continue-on-error: true
        run: composer analyse

  # ── Go SDK: vet + build ───────────────────────────────────────────
  go-sdk:
    name: Go SDK (vet + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          go: "true"
      - run: go vet ./...
      - run: go build ./...
      # Offline (no-broker) generator + enterprise-metadata regressions. Both use
      # only in-process servers, so they run here in the Go-only job:
      #   - V23-1: the typed <Entity>Repo contract compiles against the shipping SDK
      #     (int64 List count widening + protoc-gen-go field naming).
      #   - V23-2: ConnectEnterprise emits exactly one canonical value per identity
      #     header (no duplicated / stale pre-login tenant/project hint).
      - run: go test ./udbclient -run 'TestEntityRepoGeneratedContract|TestConnectEnterpriseEmitsCanonicalSingletonMetadata' -count=1

  # ── TypeScript SDK: typecheck + build (matches the npm-publish build) ──
  ts-sdk:
    name: TypeScript SDK (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: "true"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  # ── Python SDK: unit tests + package import surface ───────────────
  python-sdk:
    name: Python SDK (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          python: "true"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests

  # ── C# SDK: build the committed buf gen surface + handwritten client ──
  csharp-sdk:
    name: C# SDK (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/csharp/Udb.Client
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          dotnet: "true"
      - run: dotnet build -c Release

  # ── Java SDK: compile the committed buf gen surface + handwritten client ──
  java-sdk:
    name: Java SDK (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          java: "true"
      - run: mvn -B -ntp compile

  # ── Cross-language SDK conformance: same metadata/cache/facade contract ──
  sdk-conformance:
    name: SDK conformance (all languages)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: "true"
          python: "true"
          go: "true"
          dotnet: "true"
          java: "true"
          php: "true"
      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "sdk/python[dev]"
      - name: Install PHP SDK dependencies
        working-directory: sdk/php
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run SDK conformance parity
        run: node sdk-conformance/run.mjs metadata error-details typescript python go csharp java php
      - name: TypeScript facade sequence dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: SDK facade sequence gates
        run: |
          set -euo pipefail
          # Offline mock-transport gates live in CI, not benchmark. They assert
          # the exact helper RPC sequences against docs/bench-bodies/workflow-sequences.md.
          ( cd sdk/go && go test ./udbclient -run 'Facade|UploadFile|Entity|BenchBodyManifest' -count=1 )
          ( cd sdk/typescript && npm run bundle-proto && npx tsc -p tsconfig.test.json && node --test dist-test/facade.test.js dist-test/sdkhelpers.test.js )
          ( cd sdk/python && python -m pytest tests/test_simple_client.py tests/test_media_facade.py -q )
          ( cd sdk/php && vendor/bin/pest tests/Unit/MediaServiceWiringTest.php --filter 'StorageService uploadFile emits the shared RegisterUpload PUT FinalizeUpload sequence|shared workflow-sequences fixture pins' )
          dotnet test sdk/csharp/Udb.Client.Tests/Udb.Client.Tests.csproj --no-restore --filter FullyQualifiedName~UdbMediaFacadeTests --nologo -v q
          ( cd sdk/java && mvn -B -ntp -Dtest=UdbMediaFacadeTest#storageUploadFileEmitsSharedWorkflowSequence test )

  # ── Generated project scaffold: all six emitted clients must compile ──────
  scaffold-compiles:
    name: Scaffold examples compile (six SDKs)
    needs: build-broker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: "true"
          python: "true"
          go: "true"
          dotnet: "true"
          java: "true"
          php: "true"
      - name: Download broker binary
        uses: actions/download-artifact@v4
        with:
          name: udb-broker-debug
          path: target/debug
      - name: Mark broker executable
        run: chmod +x target/debug/udb
      - name: Compile generated scaffold examples
        run: UDB_BIN=target/debug/udb bash scripts/check-scaffold-compiles.sh

  # ── Version consistency: every manifest + protocol constant matches ──
  # versions.json (the single source of truth). The base version check is in
  # quick-gate; this job adds the launcher asset-name conformance check.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: "true"
      # check-versions.mjs runs in quick-gate; this job only adds the launcher check.
      - name: Launcher asset-name conformance
        # Every SDK launcher (+ template) must build the canonical published
        # asset name udb-<os>-<arch>[-<variant>][.exe]; no Rust triple / version
        # in name / archive / `macos`. Guards against the silent drift that broke
        # all six launchers' auto-download. See scripts/check-launcher-assets.mjs.
        run: |
          node scripts/check-launcher-assets.mjs --selftest
          node scripts/check-launcher-assets.mjs

  docs-links:
    name: Markdown local links + readiness artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: "true"
      - run: node --check scripts/check-markdown-links.mjs
      - run: node scripts/check-markdown-links.mjs --selftest
      - run: node scripts/check-markdown-links.mjs
      - run: node --check scripts/check-enterprise-readiness.mjs
      - run: node scripts/check-enterprise-readiness.mjs --selftest
      - run: node scripts/check-enterprise-readiness.mjs

  # ── Native control-plane live tests + canonical-store conformance ────
  # Brings up the integration compose stack and runs the live-DB tests
  # for the native authn/authz/apikey/tenant/notification/analytics
  # services plus the CDC→Kafka outbox pipeline. These are `#[ignore]`d
  # so the fast `rust` job skips them; this job is the only place they
  # run, gated on real infrastructure (no in-memory fakes).
  native-integration:
    name: Native services + canonical stores (live)
    if: github.event_name == 'push'
    needs: quick-gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk for live backend stack
        # This job starts Qdrant, Elasticsearch, SQL Server, Cassandra,
        # ClickHouse, Weaviate, Kafka, MinIO, and Rust test artifacts on one
        # GitHub runner. Remove hosted-toolcache payloads unrelated to UDB
        # before Docker allocates backend storage; otherwise Qdrant can fail
        # its WAL preflight with ENOSPC and cascade into live IR failures.
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af --volumes || true
          df -h
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-integration

      - name: Start integration stack while compiling tests
        # Start integration stack: postgres/kafka/redis/memcached/qdrant/minio only —
        # the `udb` and `spark` services are profile-gated and not needed for the
        # live tests.
        #
        # Compile native + integration tests while Docker services become healthy.
        # The compile preflight does not need live sockets, so overlapping it with
        # the lighter stack startup preserves most of the wall-time win without
        # asking rust-lld to link the full test harness while the heavier
        # canonical-store containers are already consuming runner memory and disk.
        run: |
          set +e
          docker compose -f docker-compose.integration.yml up -d --wait postgres kafka redis memcached qdrant minio &
          integration_stack_pid=$!
          cargo test --locked --no-run --lib --test integration_tests --test runtime_live_backends
          compile_status=$?
          wait "$integration_stack_pid"
          integration_status=$?
          if [ "$integration_status" -ne 0 ]; then
            echo "::error::integration stack startup failed"
            exit "$integration_status"
          fi
          if [ "$compile_status" -ne 0 ]; then
            echo "::error::native/integration compile preflight failed"
            exit "$compile_status"
          fi

      - name: Start canonical-store stack
        # Start canonical-store stack: MySQL / SQL Server / MongoDB / Cassandra /
        # Neo4j / ClickHouse / Elasticsearch / Weaviate are split from the
        # integration stack so ordinary native-service tests stay lean. Bring them
        # up after the compile preflight because the canonical conformance step
        # below exports every live DSN; unset DSNs would silently skip those
        # contracts.
        run: docker compose -f docker-compose.canonical.yml up -d --wait mysql mssql mongodb cassandra neo4j clickhouse elasticsearch weaviate

      - name: Initialize SQL Server database
        run: |
          docker compose -f docker-compose.canonical.yml exec -T mssql \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Udb_Strong#2026' -C \
            -Q "IF DB_ID(N'udb') IS NULL CREATE DATABASE [udb];"

      - name: Wait for Weaviate readiness
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:58080/v1/.well-known/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.canonical.yml logs --no-color --tail=120 weaviate
          exit 1

      - name: Initialize MongoDB replica set
        # MongoDB system-store conformance uses transactions, so the live test
        # requires a replica-set or sharded topology. The compose service starts
        # mongod with --replSet; this idempotently initiates rs0 for the host-side
        # directConnection DSN used below.
        run: |
          docker compose -f docker-compose.canonical.yml exec -T mongodb \
            mongosh --quiet --eval '
              try {
                rs.status().ok
              } catch (e) {
                rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})
              }
            '

      - name: Create native-event Kafka topics
        # Auto-create is disabled on the broker; the event tests assert on
        # these exact dot-namespaced topics existing up front.
        run: |
          for topic in udb.authn.user.registered.v1 udb.notification.sent.v1; do
            docker compose -f docker-compose.integration.yml exec -T kafka \
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
              --bootstrap-server localhost:9092 \
              --topic "$topic" --partitions 1 --replication-factor 1
          done

      - name: Create MinIO storage bucket
        # The storage/asset live tests PUT object bytes into the native
        # default bucket (DEFAULT_OBJECT_BUCKET = udb-storage) and nothing
        # else provisions it. The minio image ships `mc` (the compose
        # healthcheck already relies on it), so bootstrap in-container.
        run: |
          docker compose -f docker-compose.integration.yml exec -T minio \
            mc alias set local http://localhost:9000 minio minio123
          docker compose -f docker-compose.integration.yml exec -T minio \
            mc mb --ignore-existing local/udb-storage

      - name: IR compiler live golden tests
        # Runs the env-gated backend semantics oracles under the same provisioned
        # stack used by canonical conformance. External-only backends without CI
        # credentials (Azure Blob, GCS, Pinecone) keep their explicit
        # env checks and skip honestly; provisioned backends must not self-skip.
        env:
          UDB_IR_LIVE_GOLDEN_TESTS: "1"
          UDB_PG_DSN: postgres://udb:udb@localhost:55432/udb
          UDB_MYSQL_DSN: mysql://udb:udb@127.0.0.1:53306/udb
          UDB_MSSQL_DSN: Server=127.0.0.1,51433;User=sa;Password=Udb_Strong#2026;Database=udb;TrustServerCertificate=true
          UDB_NOSQL_DSN: mongodb://127.0.0.1:57017/udb?directConnection=true
          UDB_MONGODB_DSN: mongodb://127.0.0.1:57017/udb?directConnection=true
          UDB_CASSANDRA_DSN: 127.0.0.1:59042
          UDB_GRAPH_HTTP_URL: http://127.0.0.1:57474
          UDB_GRAPH_USER: neo4j
          UDB_GRAPH_PASSWORD: Udb_Strong#2026
          UDB_CLICKHOUSE_DSN: http://127.0.0.1:58123/udb
          UDB_CLICKHOUSE_USER: udb
          UDB_CLICKHOUSE_PASSWORD: udb
          UDB_CLICKHOUSE_DATABASE: udb
          UDB_COLUMN_USER: udb
          UDB_COLUMN_PASSWORD: udb
          UDB_COLUMN_DATABASE: udb
          UDB_ELASTIC_DSN: http://127.0.0.1:59200
          UDB_WEAVIATE_DSN: http://127.0.0.1:58080
          UDB_QDRANT_URL: http://localhost:56333
          UDB_REDIS_DSN: redis://localhost:56379/0
          UDB_MEMCACHED_DSN: memcache://127.0.0.1:51122
          UDB_INTEGRATION_MINIO_ENDPOINT: http://localhost:59000
          UDB_INTEGRATION_MINIO_ACCESS_KEY: minio
          UDB_INTEGRATION_MINIO_SECRET_KEY: minio123
        run: cargo test --locked --lib ir::compile::live_tests -- --ignored --nocapture --test-threads=1

      - name: Native service live tests
        # --test-threads=1: the live tests share Postgres schemas and
        # serialize their setup; run them serially to avoid cross-talk.
        env:
          UDB_LIVE_AUTH_TESTS: "1"
          UDB_INTEGRATION_PG_DSN: postgres://udb:udb@localhost:55432/udb
          UDB_INTEGRATION_KAFKA_BROKERS: localhost:59192
          UDB_INTEGRATION_REDIS_URL: redis://localhost:56379
          UDB_MINIO_ENDPOINT: http://localhost:59000
          UDB_MINIO_ACCESS_KEY: minio
          UDB_MINIO_SECRET_KEY: minio123
          UDB_QDRANT_URL: http://localhost:56333
          UDB_ENCRYPTION_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
        run: cargo test --locked --lib -- --ignored --nocapture --test-threads=1

      - name: Wire-codec served live tests
        # These regressions write and read through the real served executor paths.
        # The required flag converts a missing/renamed provisioned DSN from a
        # false-green runtime skip into a test failure.
        env:
          UDB_WIRE_CODEC_LIVE_TESTS: "1"
          UDB_PG_DSN: postgres://udb:udb@localhost:55432/udb
          UDB_MYSQL_DSN: mysql://udb:udb@127.0.0.1:53306/udb
          UDB_MSSQL_DSN: Server=127.0.0.1,51433;User=sa;Password=Udb_Strong#2026;Database=udb;TrustServerCertificate=true
          UDB_CASSANDRA_DSN: 127.0.0.1:59042
        run: cargo test --locked --lib runtime::wire_codec_live_tests -- --nocapture --test-threads=1

      - name: Canonical store live conformance
        env:
          UDB_PG_DSN: postgres://udb:udb@localhost:55432/udb
          UDB_REDIS_DSN: redis://localhost:56379/0
          UDB_QDRANT_URL: http://localhost:56333
          UDB_MYSQL_DSN: mysql://udb:udb@127.0.0.1:53306/udb
          UDB_MSSQL_DSN: Server=127.0.0.1,51433;User=sa;Password=Udb_Strong#2026;Database=udb;TrustServerCertificate=true
          UDB_MONGODB_DSN: mongodb://127.0.0.1:57017/udb?directConnection=true
          UDB_NOSQL_DSN: mongodb://127.0.0.1:57017/udb?directConnection=true
          UDB_CASSANDRA_DSN: 127.0.0.1:59042
          UDB_NEO4J_DSN: http://127.0.0.1:57474
          UDB_NEO4J_USER: neo4j
          UDB_NEO4J_PASSWORD: Udb_Strong#2026
          UDB_CLICKHOUSE_DSN: http://127.0.0.1:58123/udb
          UDB_COLUMN_DSN: http://127.0.0.1:58123/udb
          UDB_COLUMN_USER: udb
          UDB_COLUMN_PASSWORD: udb
          UDB_COLUMN_DATABASE: udb
          UDB_ELASTIC_DSN: http://127.0.0.1:59200
        run: cargo test --locked --lib canonical_store::conformance_live_tests -- --nocapture

      - name: Integration harness (CDC, sagas, backends)
        # The integration crates gate their tests with `#[ignore]` (honest skip
        # outside a live stack), so they MUST be run with `--ignored` here — the
        # env vars below provide the live DSNs. Without `--ignored` these tests
        # would not execute at all.
        env:
          UDB_INTEGRATION_TESTS: "1"
          UDB_INTEGRATION_PG_DSN: postgres://udb:udb@localhost:55432/udb
          UDB_INTEGRATION_KAFKA_BROKERS: localhost:59192
          UDB_INTEGRATION_REDIS_URL: redis://localhost:56379
          UDB_INTEGRATION_QDRANT_URL: http://localhost:56333
          UDB_INTEGRATION_MINIO_ENDPOINT: http://localhost:59000
          UDB_MINIO_ENDPOINT: http://localhost:59000
          UDB_MINIO_ACCESS_KEY: minio
          UDB_MINIO_SECRET_KEY: minio123
          UDB_QDRANT_URL: http://localhost:56333
        run: cargo test --locked --test integration_tests --test runtime_live_backends -- --ignored --nocapture

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.integration.yml logs --no-color --tail=200
          docker compose -f docker-compose.canonical.yml logs --no-color --tail=200

      - name: Stop integration stacks
        if: always()
        run: |
          docker compose -f docker-compose.integration.yml down -v --remove-orphans
          docker compose -f docker-compose.canonical.yml down -v --remove-orphans
