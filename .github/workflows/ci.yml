name: CI

# Adapted from the former monorepo CI for the
# standalone repo layout: everything lives at the repo root (no
# `working-directory: udb`), protos are at `proto/`, and SDK stubs
# come from the root `buf generate` / CLI-backed SDK generation path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_BINARY_FEATURES: >-
    postgres,mysql,sqlite,qdrant,s3,mongodb-native,neo4j,clickhouse,redis,elasticsearch,weaviate,pinecone,azureblob,gcs,otel,runtime-logging,http-client,oidc,webauthn

jobs:
  # ── Rust build + test + clippy across OSes ────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: Build all targets
        run: cargo build --locked --all-targets
      - name: Compile tests and benches
        run: cargo test --locked --no-run --all-targets
      - name: Test UDB library
        run: cargo test --locked --lib
      - name: Build CLI
        run: cargo build --locked --bin udb
      - name: Native contract manifest drift + lint (F13 hard gate)
        # Phase 0A: the committed native-contract manifest must match the
        # descriptor, and `native lint` must report zero error-severity
        # findings. Runs once on Linux to avoid CRLF/path skew.
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -q --bin udb -- native manifest > docs/generated/udb-native-contract.json
          if ! git diff --quiet -- docs/generated/udb-native-contract.json; then
            echo "::error::Native contract manifest is stale. Run 'udb native manifest > docs/generated/udb-native-contract.json' and commit."
            git diff -- docs/generated/udb-native-contract.json | sed -n '1,120p'
            exit 1
          fi
          cargo run --locked -q --bin udb -- native lint
      - name: Doc service-count drift guard
        # The README + docs/native-services.md native-service/RPC counts must
        # match the generated contract (they silently drifted before: prose said
        # "6 services, 77 RPCs" while the contract had grown to 15/186). Runs on
        # the same Linux job that just regenerated the contract manifest.
        if: runner.os == 'Linux'
        run: python3 scripts/check-doc-service-counts.py
      - name: SDK service-coverage guard (urgent_fix #19)
        # Every descriptor-known native service must have a generated robustness
        # client in each shipped SDK language (Storage/Asset/IdP/WebRTC were missing
        # from all six before). Fails if a present client omits a contract service —
        # regenerate with `udb sdk generate`.
        if: runner.os == 'Linux'
        run: python3 scripts/check-sdk-service-coverage.py
      - name: Codebase map freshness gate
        # docs/generated/codebase-map.md is the agent-facing module-dependency
        # graph + public-symbol index (consumed by the udb-coding skill).
        # Generated truth like the contract JSON — regenerate with:
        #   python scripts/generate-codebase-map.py
        if: runner.os == 'Linux'
        run: python3 scripts/generate-codebase-map.py --check
      - name: Native contract breaking-change gate (Phase 3)
        # Diff the live descriptor contract against the committed baseline and fail
        # on auth/db/sdk/event-breaking or removed surface. Intentional breaks bump
        # NATIVE_CONTRACT_VERSION and regenerate the baseline:
        #   udb native contract-baseline --baseline docs/generated/contract-baseline.bin
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -q --bin udb -- native contract-diff \
            --baseline docs/generated/contract-baseline.bin
      - name: Clippy (advisory for v0.1; promote to -D warnings post-cleanup)
        # 120 pre-existing clippy lints on the v0.1 baseline (mostly
        # field_reassign_with_default, useless_format, doc style,
        # needless_lifetimes, etc.). Soft-fail so the rest of the
        # pipeline stays gated. Tracked for cleanup before v0.2; flip
        # to `-D warnings` once the count is at zero.
        continue-on-error: true
        run: cargo clippy --locked --all-targets

  # ── Shipped binary feature gate: portable broker + real OIDC/WebAuthn ─────
  auth-release-binary:
    name: Auth binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: darwin-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: auth-${{ matrix.target }}

      - name: Install auth build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang perl nasm ninja-build pkg-config libssl-dev

      - name: Install auth build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake nasm ninja

      - name: Install auth build deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --no-progress -y
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure MSVC build tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check shipped auth binary feature set
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            msvc_bin="$(cygpath -u "${VCToolsInstallDir}bin\\Hostx64\\x64")"
            export PATH="${msvc_bin}:/c/Strawberry/perl/bin:/c/Program Files/NASM:${PATH}"
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="${msvc_bin}/link.exe"
          fi
          cargo check --locked --target ${{ matrix.target }} \
            --bin udb \
            --no-default-features --features "${RELEASE_BINARY_FEATURES}"

  # ── Slim postgres-only build + dep-graph guard ────────────────────
  slim-build:
    name: Slim build (postgres-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build slim (no-default-features, postgres only)
        run: cargo build --locked --all-targets --no-default-features --features postgres
      - name: Verify slim dependency graph
        shell: bash
        run: bash scripts/ci_slim_dep_guard.sh

  # ── Per-backend plugin feature builds ─────────────────────────────
  plugin-feature-matrix:
    name: Plugin feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature:
          - qdrant
          - s3
          - mongodb
          - mongodb-native
          - neo4j
          - clickhouse
          - redis
          - elasticsearch
          - memcached
          - mssql
          - weaviate
          - pinecone
          - cassandra
          - azureblob
          - gcs
          - kafka
          - otel
          - runtime-logging
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build postgres + plugin feature
        run: cargo build --locked --all-targets --no-default-features --features "postgres,${{ matrix.feature }}"

  # ── gRPC reflection smoke test against a live Postgres ────────────
  grpc-reflection-smoke:
    name: gRPC reflection smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: udb_ci
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udb -d udb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      UDB_PG_DSN: postgres://udb:udb@localhost:5432/udb_ci
      UDB_GRPC_ADDR: 127.0.0.1:50051
      UDB_METRICS_ADDR: 127.0.0.1:19090
      UDB_ABAC_DEFAULT_ALLOW: "true"
      UDB_CDC_ENABLED: "false"
      UDB_PROJECTION_WORKER_ENABLED: "false"
      UDB_RECONCILIATION_ENABLED: "false"
      UDB_SAGA_RECOVERY_ENABLED: "false"
      UDB_STARTUP_FORCE_SYNC: "true"
      UDB_STARTUP_DRY_RUN: "true"
      UDB_AUDIT_SINK_URL: file:///tmp/udb-audit.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
      - name: Build CLI
        run: cargo build --locked --bin udb --no-default-features --features "postgres,runtime-logging"
      - name: Start UDB
        shell: bash
        run: |
          set -euo pipefail
          # Standalone layout: protos are at ./proto (not ../proto).
          target/debug/udb serve proto "" 127.0.0.1:50051 > /tmp/udb-server.log 2>&1 &
          echo $! > /tmp/udb-server.pid
          for attempt in {1..60}; do
            if "$HOME/go/bin/grpcurl" -plaintext 127.0.0.1:50051 list >/tmp/grpcurl-list.txt 2>/tmp/grpcurl.err; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/udb-server.pid)" 2>/dev/null; then
              cat /tmp/udb-server.log
              cat /tmp/grpcurl.err || true
              exit 1
            fi
            sleep 2
          done
          cat /tmp/udb-server.log
          cat /tmp/grpcurl.err || true
          exit 1
      - name: Verify reflection surface
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/go/bin/grpcurl" -plaintext 127.0.0.1:50051 list | tee /tmp/grpcurl-list.txt
          grep -q '^udb.services.v1.DataBroker$' /tmp/grpcurl-list.txt
          "$HOME/go/bin/grpcurl" -plaintext 127.0.0.1:50051 describe udb.services.v1.DataBroker | tee /tmp/grpcurl-describe.txt
          grep -q 'rpc GetHealthReport' /tmp/grpcurl-describe.txt
          grep -q 'rpc LookupMessageSchema' /tmp/grpcurl-describe.txt
      - name: Stop UDB
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/udb-server.pid ]; then
            kill "$(cat /tmp/udb-server.pid)" 2>/dev/null || true
          fi

  # ── Load smoke (non-gating): run the load harness against the REAL broker so the
  #    write / fan-out / CDC RPCs the scripts claim to cover are actually exercised
  #    in CI (urgent_fix.md #29). Numbers are advisory; this never blocks the build.
  load-smoke:
    name: load smoke (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: udb_ci
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udb -d udb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      UDB_PG_DSN: postgres://udb:udb@localhost:5432/udb_ci
      UDB_GRPC_ADDR: 127.0.0.1:50051
      UDB_METRICS_ADDR: 127.0.0.1:19090
      UDB_ABAC_DEFAULT_ALLOW: "true"
      UDB_CDC_ENABLED: "false"
      UDB_PROJECTION_WORKER_ENABLED: "false"
      UDB_RECONCILIATION_ENABLED: "false"
      UDB_SAGA_RECOVERY_ENABLED: "false"
      UDB_STARTUP_FORCE_SYNC: "true"
      UDB_STARTUP_DRY_RUN: "true"
      UDB_AUDIT_SINK_URL: file:///tmp/udb-audit.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install ghz + grpcurl
        run: |
          go install github.com/bojand/ghz/cmd/ghz@latest
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
      - name: Build CLI
        run: cargo build --locked --bin udb --no-default-features --features "postgres,runtime-logging"
      - name: Start UDB
        shell: bash
        run: |
          set -euo pipefail
          target/debug/udb serve proto "" 127.0.0.1:50051 > /tmp/udb-server.log 2>&1 &
          echo $! > /tmp/udb-server.pid
          for attempt in {1..60}; do
            if "$HOME/go/bin/grpcurl" -plaintext 127.0.0.1:50051 list >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/udb-server.pid)" 2>/dev/null; then
              cat /tmp/udb-server.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/udb-server.log
          exit 1
      - name: Run native load smoke (small N, advisory)
        shell: bash
        env:
          UDB_TARGET: 127.0.0.1:50051
          UDB_INSECURE: "true"
          UDB_LOAD_CONCURRENCY: "2"
          UDB_LOAD_TOTAL: "20"
          UDB_LOAD_TENANT_ID: load-tenant
          UDB_LOAD_PROJECT_ID: load-project
        run: |
          export PATH="$HOME/go/bin:$PATH"
          # Non-gating: keep going even if individual RPCs fast-reject placeholder ids.
          bash scripts/native-load-test.sh | tee /tmp/native-load.txt || true
      - name: Upload load summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-load-smoke
          path: /tmp/native-load.txt
          if-no-files-found: ignore
      - name: Stop UDB
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/udb-server.pid ]; then
            kill "$(cat /tmp/udb-server.pid)" 2>/dev/null || true
          fi

  # ── Supply-chain: cargo-deny + vendored postgres-replication audit ─
  supply-chain:
    name: Supply chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny advisories (advisory)
        # RUSTSEC advisories can land against transitive dependencies
        # before upstream crates publish a compatible fix. Keep this
        # visible without blocking the stable policy gates below.
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-musl
        with:
          manifest-path: Cargo.toml
          command: check advisories
      - name: cargo-deny policy gates
        uses: EmbarkStudios/cargo-deny-action@v2
        env:
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-musl
        with:
          manifest-path: Cargo.toml
          command: check bans licenses sources
      - name: Verify vendored postgres-replication provenance
        shell: bash
        run: |
          set -euo pipefail
          expected_rev='31acf55c7e5c2244e5bb3a36e7afa2a01bf52c38'

          # 1. Vendored postgres-replication module must be intact —
          #    sources, NOTICE.md (referencing the fork rev), and
          #    dual MIT/Apache-2.0 LICENSES for attribution.
          for required in \
            src/runtime/cdc/postgres_replication/mod.rs \
            src/runtime/cdc/postgres_replication/protocol.rs \
            src/runtime/cdc/postgres_replication/NOTICE.md \
            src/runtime/cdc/postgres_replication/LICENSES/LICENSE-MIT \
            src/runtime/cdc/postgres_replication/LICENSES/LICENSE-APACHE; do
            if [ ! -f "$required" ]; then
              echo "::error ::vendored postgres-replication is missing $required"
              exit 1
            fi
          done
          if ! grep -q "$expected_rev" src/runtime/cdc/postgres_replication/NOTICE.md; then
            echo "::error ::NOTICE.md does not reference fork rev $expected_rev"
            exit 1
          fi

          # 2. Cargo.toml must NOT redeclare postgres-replication as an
          #    external dep — the vendored module owns that crate name.
          if grep -E '^postgres-replication\s*=' Cargo.toml; then
            echo "::error ::Cargo.toml has an external postgres-replication dep; remove it — the vendored copy in src/runtime/cdc/postgres_replication/ is authoritative"
            exit 1
          fi

          # 3. Published crates must build from crates.io sources only. Keep
          #    any upstream-fork provenance documented in NOTICE.md, not as a
          #    Cargo patch that would be stripped during packaging.
          if grep -q '^\[patch\.crates-io\]' Cargo.toml; then
            echo "::error ::Cargo.toml must not use [patch.crates-io] for the publishable package"
            exit 1
          fi
          if grep -q 'git = ' Cargo.toml; then
            echo "::error ::Cargo.toml must not use git dependencies for the publishable package"
            exit 1
          fi

  # ── buf: lint, build, and verify committed stubs are current ──────
  buf:
    name: Proto (buf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          # Pin to the exact buf version that produced the committed
          # stubs so the drift check below is a real, hard-fail gate
          # (header re-rendering / whitespace skew across buf versions
          # is what previously forced a soft-fail).
          version: 1.65.0
          buf_api_token: ${{ secrets.BUF_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint
      - run: buf build
      - name: buf breaking (against origin/main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"
      - name: Verify committed stubs are current
        # `--include-imports` emits the vendored `google/api/*` annotation
        # stubs alongside the UDB stubs into every SDK's `gen/` tree, so
        # published SDKs are self-contained (no external googleapis dep).
        # The committed stubs MUST match this output exactly — drift is a
        # hard failure: regenerate locally with the same command and commit.
        run: |
          buf generate --include-imports
          # Deterministic OpenAPI metadata fixup (title/version/scope) so the
          # committed swagger matches generation output (TODO_PASS2 #144/#145).
          node scripts/openapi-postprocess.mjs
          node scripts/sdk-codegen-postprocess.mjs
          if ! git diff --quiet -- sdk/php/gen sdk/go/gen sdk/typescript/gen sdk/python/gen sdk/java/gen sdk/csharp/gen api; then
            echo "::error::Committed SDK stubs are stale. Run 'buf generate --include-imports' and commit the result."
            git diff -- sdk/php/gen sdk/go/gen sdk/typescript/gen sdk/python/gen sdk/java/gen sdk/csharp/gen api | sed -n '1,200p'
            git diff --stat -- sdk/php/gen sdk/go/gen sdk/typescript/gen sdk/python/gen sdk/java/gen sdk/csharp/gen api
            exit 1
          fi
      - name: Authn/Authz inventory drift (Phase 0A)
        # The committed RPC + sensitive-field inventories must match the protos.
        run: |
          node scripts/generate-authn-authz-inventory.mjs
          if ! git diff --quiet -- docs/generated/authn-authz-rpc-inventory.md docs/generated/authn-authz-sensitive-fields.md; then
            echo "::error::authn/authz inventory is stale. Run 'node scripts/generate-authn-authz-inventory.mjs' and commit docs/generated/."
            git diff --stat -- docs/generated/authn-authz-rpc-inventory.md docs/generated/authn-authz-sensitive-fields.md
            exit 1
          fi

  # ── PHP / Laravel SDK: composer + pest ────────────────────────────
  php-sdk:
    name: PHP SDK (pest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: grpc, protobuf, mbstring, intl
          coverage: none
          tools: composer:v2
      - name: Cache composer deps
        uses: actions/cache@v4
        with:
          path: sdk/php/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('sdk/php/composer.json') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
      - name: composer analyse (PHPStan)
        continue-on-error: true
        run: composer analyse

  # ── Go SDK: vet + build ───────────────────────────────────────────
  go-sdk:
    name: Go SDK (vet + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go build ./...

  # ── TypeScript SDK: typecheck + build (matches the npm-publish build) ──
  ts-sdk:
    name: TypeScript SDK (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  # ── Python SDK: unit tests + package import surface ───────────────
  python-sdk:
    name: Python SDK (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests

  # ── C# SDK: build the committed buf gen surface + handwritten client ──
  csharp-sdk:
    name: C# SDK (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/csharp/Udb.Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build -c Release

  # ── Java SDK: compile the committed buf gen surface + handwritten client ──
  java-sdk:
    name: Java SDK (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp compile

  # ── Cross-language SDK conformance: same metadata/cache/facade contract ──
  sdk-conformance:
    name: SDK conformance (all languages)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: grpc, protobuf, mbstring, intl
          coverage: none
          tools: composer:v2
      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "sdk/python[dev]"
      - name: Install PHP SDK dependencies
        working-directory: sdk/php
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run SDK conformance parity
        run: node sdk-conformance/run.mjs typescript python go csharp java php

  sdk-live-conformance:
    name: SDK live auth conformance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: udb_ci
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udb -d udb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      UDB_PG_DSN: postgres://udb:udb@localhost:5432/udb_ci
      UDB_NOSQL_DSN: mongodb://localhost:27017/udb_live_sdk?directConnection=true
      UDB_MONGODB_DSN: mongodb://localhost:27017/udb_live_sdk?directConnection=true
      UDB_NOSQL_DATABASE: udb_live_sdk
      UDB_MINIO_ENDPOINT: http://localhost:9000
      UDB_MINIO_ACCESS_KEY: minio
      UDB_MINIO_SECRET_KEY: minio123
      UDB_KAFKA_BROKERS: localhost:59192
      UDB_GRPC_ADDR: 127.0.0.1:50051
      UDB_GRPC_TARGET: 127.0.0.1:50051
      UDB_AUTH_GRPC_ADDR: 127.0.0.1:50061
      UDB_AUTH_GRPC_TARGET: 127.0.0.1:50061
      UDB_METRICS_ADDR: 127.0.0.1:19091
      UDB_ABAC_DEFAULT_ALLOW: "true"
      UDB_CDC_ENABLED: "true"
      UDB_PROJECTION_WORKER_ENABLED: "false"
      UDB_RECONCILIATION_ENABLED: "false"
      UDB_SAGA_RECOVERY_ENABLED: "false"
      UDB_STARTUP_FORCE_SYNC: "true"
      UDB_STARTUP_DRY_RUN: "false"
      UDB_AUDIT_SINK_URL: file:///tmp/udb-audit.jsonl
      UDB_ENCRYPTION_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      UDB_JWT_PRIVATE_KEY: src/runtime/testdata/jwt_rs256_private.pem
      UDB_JWT_PUBLIC_KEY: src/runtime/testdata/jwt_rs256_public.pem
      UDB_SESSION_ENABLED: "true"
      UDB_SESSION_HASH_SECRET: ci-live-auth-session-hash-secret
      UDB_PASSWORD_HASH_SECRET: ci-live-auth-password-hash-secret
      UDB_LIVE_USERNAME: sdk-live@example.com
      UDB_LIVE_PASSWORD: CorrectHorse1!
      UDB_LIVE_TENANT: sdk-live
      UDB_LIVE_PROJECT: default
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Start MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name udb-sdk-live-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:RELEASE.2025-01-20T14-49-07Z \
            server /data --console-address ":9001"
          for attempt in {1..60}; do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            docker ps --filter name=udb-sdk-live-minio --filter status=running --quiet | grep -q . || {
              docker logs udb-sdk-live-minio
              exit 1
            }
            sleep 2
          done
          docker logs udb-sdk-live-minio
          exit 1
      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund
      - name: Build UDB broker
        run: cargo build --locked --bin udb --no-default-features --features "postgres,mongodb-native,s3,runtime-logging"
      - name: Start Kafka
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name udb-sdk-live-kafka --hostname kafka \
            -p 59192:59192 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093 \
            -e KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:59192 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://localhost:9092,EXTERNAL://localhost:59192 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            -e KAFKA_COMPRESSION_TYPE=lz4 \
            apache/kafka:3.9.0
          for attempt in {1..60}; do
            if docker exec udb-sdk-live-kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              for topic in udb.authn.user.registered.v1 udb.notification.sent.v1; do
                docker exec udb-sdk-live-kafka \
                  /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                  --bootstrap-server localhost:9092 \
                  --topic "$topic" --partitions 1 --replication-factor 1
              done
              exit 0
            fi
            docker ps --filter name=udb-sdk-live-kafka --filter status=running --quiet | grep -q . || {
              docker logs udb-sdk-live-kafka
              exit 1
            }
            sleep 2
          done
          docker logs udb-sdk-live-kafka
          exit 1
      - name: Create live-sdk MinIO bucket
        shell: bash
        run: |
          # mc is not pre-installed; install the minio client binary directly.
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 minio minio123
          mc mb --ignore-existing local/udb-live-sdk
      - name: Start UDB
        shell: bash
        run: |
          set -euo pipefail
          target/debug/udb serve proto "" 127.0.0.1:50051 > /tmp/udb-sdk-live.log 2>&1 &
          echo $! > /tmp/udb-sdk-live.pid
          for attempt in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/50051) >/dev/null 2>&1 \
              && (echo > /dev/tcp/127.0.0.1/50061) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/udb-sdk-live.pid)" 2>/dev/null; then
              cat /tmp/udb-sdk-live.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/udb-sdk-live.log
          exit 1
      - name: Bootstrap live SDK user
        run: |
          target/debug/udb auth bootstrap user \
            --username sdk-live \
            --email "${UDB_LIVE_USERNAME}" \
            --password "${UDB_LIVE_PASSWORD}" \
            --tenant "${UDB_LIVE_TENANT}" \
            --project "${UDB_LIVE_PROJECT}"
      - name: Run TypeScript live auth conformance
        working-directory: sdk/typescript
        env:
          UDB_LIVE_SDK_TESTS: "1"
        run: |
          npm run bundle-proto
          npx tsc -p tsconfig.test.json
          node --test dist-test/live-auth.test.js
      - name: Stop UDB
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/udb-sdk-live.pid ]; then
            kill "$(cat /tmp/udb-sdk-live.pid)" 2>/dev/null || true
          fi
          docker rm -f udb-sdk-live-minio 2>/dev/null || true
          docker rm -f udb-sdk-live-kafka 2>/dev/null || true

  # ── Version consistency: every manifest + protocol constant matches ──
  # versions.json (the single source of truth). Fails the PR on drift so a
  # bump in one place can't silently desync the crate, the six SDKs, and the
  # wire protocol version. See VERSIONING.md / scripts/check-versions.mjs.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-versions.mjs

  docs-links:
    name: Markdown local links + readiness artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-markdown-links.mjs
      - run: node scripts/check-enterprise-readiness.mjs

  # ── Native control-plane live tests (Postgres + Kafka + Redis) ────
  # Brings up the integration compose stack and runs the live-DB tests
  # for the native authn/authz/apikey/tenant/notification/analytics
  # services plus the CDC→Kafka outbox pipeline. These are `#[ignore]`d
  # so the fast `rust` job skips them; this job is the only place they
  # run, gated on real infrastructure (no in-memory fakes).
  native-integration:
    name: Native services (live Postgres + Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Start integration stack
        # postgres/kafka/redis/qdrant/minio only — the `udb` and `spark`
        # services are profile-gated and not needed for the live tests.
        run: docker compose -f docker-compose.integration.yml up -d --wait postgres kafka redis qdrant minio

      - name: Create native-event Kafka topics
        # Auto-create is disabled on the broker; the event tests assert on
        # these exact dot-namespaced topics existing up front.
        run: |
          for topic in udb.authn.user.registered.v1 udb.notification.sent.v1; do
            docker compose -f docker-compose.integration.yml exec -T kafka \
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
              --bootstrap-server localhost:9092 \
              --topic "$topic" --partitions 1 --replication-factor 1
          done

      - name: Compile native + integration tests
        run: cargo test --locked --no-run --lib --test integration_tests --test runtime_live_backends

      - name: Create MinIO storage bucket
        # The storage/asset live tests PUT object bytes into the native
        # default bucket (DEFAULT_OBJECT_BUCKET = udb-storage) and nothing
        # else provisions it. The minio image ships `mc` (the compose
        # healthcheck already relies on it), so bootstrap in-container.
        run: |
          docker compose -f docker-compose.integration.yml exec -T minio \
            mc alias set local http://localhost:9000 minio minio123
          docker compose -f docker-compose.integration.yml exec -T minio \
            mc mb --ignore-existing local/udb-storage

      - name: Native service live tests
        # --test-threads=1: the live tests share Postgres schemas and
        # serialize their setup; run them serially to avoid cross-talk.
        env:
          UDB_LIVE_AUTH_TESTS: "1"
          UDB_INTEGRATION_PG_DSN: postgres://udb:udb@localhost:55432/udb
          UDB_INTEGRATION_KAFKA_BROKERS: localhost:59192
          UDB_INTEGRATION_REDIS_URL: redis://localhost:56379
          UDB_MINIO_ENDPOINT: http://localhost:59000
          UDB_MINIO_ACCESS_KEY: minio
          UDB_MINIO_SECRET_KEY: minio123
          UDB_QDRANT_URL: http://localhost:56333
          UDB_ENCRYPTION_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
        run: cargo test --locked --lib -- --ignored --nocapture --test-threads=1

      - name: Canonical store live conformance
        env:
          UDB_PG_DSN: postgres://udb:udb@localhost:55432/udb
          UDB_REDIS_DSN: redis://localhost:56379/0
        run: cargo test --locked --lib canonical_store::conformance_live_tests -- --nocapture

      - name: Integration harness (CDC, sagas, backends)
        # The integration crates gate their tests with `#[ignore]` (honest skip
        # outside a live stack), so they MUST be run with `--ignored` here — the
        # env vars below provide the live DSNs. Without `--ignored` these tests
        # would not execute at all.
        env:
          UDB_INTEGRATION_TESTS: "1"
          UDB_INTEGRATION_PG_DSN: postgres://udb:udb@localhost:55432/udb
          UDB_INTEGRATION_KAFKA_BROKERS: localhost:59192
          UDB_INTEGRATION_REDIS_URL: redis://localhost:56379
          UDB_INTEGRATION_QDRANT_URL: http://localhost:56333
          UDB_INTEGRATION_MINIO_ENDPOINT: http://localhost:59000
          UDB_MINIO_ENDPOINT: http://localhost:59000
          UDB_MINIO_ACCESS_KEY: minio
          UDB_MINIO_SECRET_KEY: minio123
          UDB_QDRANT_URL: http://localhost:56333
        run: cargo test --locked --test integration_tests --test runtime_live_backends -- --ignored --nocapture

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs --no-color --tail=200
