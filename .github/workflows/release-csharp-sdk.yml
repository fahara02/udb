name: Release · C# SDK (NuGet)

# Reusable publisher invoked by `release.yml` after the release binaries are
# built. Publishes two NuGet packages:
#
#   Udb.Client  — gRPC client library  (dotnet add package Udb.Client)
#   Udb.Cli     — dotnet tool launcher (dotnet tool install --global Udb.Cli)
#
# Both packages follow the main UDB release version tracked in versions.json.
# Expected UDB release version, for example 0.5.1"
# The release flow mirrors the Python/TypeScript SDKs: version consistency is
# verified, tests pass, then nuget push fires. Publishing uses NuGet trusted
# publishing: the `production` environment is bound to the nuget.org trusted
# publisher policy owned by the `fahara02` account, so no long-lived API key
# secret is required (hence `id-token: write`).

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected UDB release version, for example 0.4.0"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish Udb.Client + Udb.Cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://www.nuget.org/packages/Udb.Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET + Node (for version-guard) via the single-source composite.
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          dotnet: 'true'
          node: 'true'

      - uses: ./.github/actions/version-guard
        with:
          component: sdk-csharp
          dispatch-version: ${{ github.event.inputs.version }}

      # ── Restore + test ────────────────────────────────────────────────────
      - name: Restore dependencies
        run: |
          dotnet restore sdk/csharp/Udb.Client.Tests/Udb.Client.Tests.csproj
          dotnet restore sdk/csharp/Udb.Cli/Udb.Cli.csproj

      - name: Build (Release)
        run: |
          dotnet build sdk/csharp/Udb.Client.Tests/Udb.Client.Tests.csproj --configuration Release --no-restore
          dotnet build sdk/csharp/Udb.Cli/Udb.Cli.csproj --configuration Release --no-restore

      # ── Check NuGet availability ──────────────────────────────────────────
      - name: Check Udb.Client availability on NuGet
        id: nuget_client
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./versions.json').components['sdk-csharp'].version")"
          if curl -fsS "https://api.nuget.org/v3-flatcontainer/udb.client/${version}/udb.client.nuspec" >/dev/null 2>&1; then
            echo "Udb.Client ${version} already published; publish step will be skipped."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check Udb.Cli availability on NuGet
        id: nuget_cli
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./versions.json').components['sdk-csharp'].version")"
          if curl -fsS "https://api.nuget.org/v3-flatcontainer/udb.cli/${version}/udb.cli.nuspec" >/dev/null 2>&1; then
            echo "Udb.Cli ${version} already published; publish step will be skipped."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      # ── Pack ─────────────────────────────────────────────────────────────
      - name: Pack Udb.Client
        if: steps.nuget_client.outputs.exists != 'true'
        working-directory: sdk/csharp/Udb.Client
        run: dotnet pack --configuration Release --no-build --output ./nupkg

      - name: Pack Udb.Cli
        if: steps.nuget_cli.outputs.exists != 'true'
        working-directory: sdk/csharp/Udb.Cli
        run: dotnet pack --configuration Release --no-build --output ./nupkg

      # ── Publish ───────────────────────────────────────────────────────────
      - name: NuGet trusted publishing login
        if: steps.nuget_client.outputs.exists != 'true' || steps.nuget_cli.outputs.exists != 'true'
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: fahara02

      - name: Publish Udb.Client to NuGet
        if: steps.nuget_client.outputs.exists != 'true'
        working-directory: sdk/csharp/Udb.Client
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish Udb.Cli to NuGet
        if: steps.nuget_cli.outputs.exists != 'true'
        working-directory: sdk/csharp/Udb.Cli
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
