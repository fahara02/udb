name: Release Python SDK

# Reusable publisher invoked by `release.yml` after the release binaries are
# built. Builds and publishes udb-client to PyPI.

on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        description: PyPI API token used by `twine upload`.
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Expected UDB release version, for example 0.5.14"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish udb-client
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python + Node (for version-guard) via the single-source composite.
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          python: 'true'
          node: 'true'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - uses: ./.github/actions/version-guard
        with:
          component: sdk-python
          dispatch-version: ${{ github.event.inputs.version }}

      - name: Install dependencies
        working-directory: sdk/python
        run: uv sync --extra dev

      - name: Build package
        working-directory: sdk/python
        run: uv run python -m build

      - name: Check package
        working-directory: sdk/python
        run: uv run twine check dist/*

      - name: Publish to PyPI
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uv run twine upload --skip-existing dist/*
