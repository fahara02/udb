name: Deploy site (GitHub Pages)

# Publishes the static landing site under docs/site/ to GitHub Pages.
# Pages "Source" must be set to "GitHub Actions" in repo Settings → Pages.
#
# The brand images live in docs/assets/ (the single source used by the READMEs
# and docs). This workflow syncs them into docs/site/assets/ at build time, so
# the published artifact is self-contained and the site's `./assets/...`
# references resolve without committing duplicated images.

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/assets/**"
      - "api/**"
      - "crates/udb-portable/**"
      - "crates/udb-wasm/**"
      - "src/backend/kind.rs"
      - "src/generation/**"
      - "src/ir/**"
      - "src/migration/diff*.rs"
      - "src/parser/**"
      - "src/runtime/descriptor_manifest.rs"
      - "src/schema/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/playground_wasm_smoke.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Re-publish the site (and refresh the benchmark dashboard) after a benchmark
  # run completes. pages.yml is the SOLE Pages deployer (Chapter 15.8.2); the
  # benchmark workflow only produces the `sdk-benchmark-results` artifact, which
  # the build job below pulls into docs/site/ before upload.
  workflow_run:
    workflows: ["Benchmark · SDKs"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed for `gh run download` to fetch the benchmark workflow's artifact
  # (the fresh bench-results.json) when this run is triggered by a benchmark.
  actions: read

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Benchmark workflow_run events are deployable only when the benchmark was
    # itself triggered by a completed Release workflow. Manual and push-only
    # benchmark runs may validate the harness, but cannot publish release proof.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync brand assets into the site
        run: |
          mkdir -p docs/site/assets
          cp -v docs/assets/*.svg docs/site/assets/
      - name: Publish Swagger API document
        run: |
          mkdir -p docs/site/api
          cp -v api/*.json docs/site/api/
      - name: Pull latest benchmark results into the site
        # Prefer the FRESH artifact from the benchmark run that triggered this
        # deploy (on: workflow_run); the benchmark workflow uploads it as
        # `sdk-benchmark-results` containing docs/site/bench-results.json. A
        # triggering run that produces no such artifact is a HARD FAILURE — see
        # the `::error::` below. There is no fallback on that path.
        #
        # A docs-only / wasm push has no triggering run, so the COMMITTED
        # docs/site/bench-results.json ships as-is. It is deliberately never
        # re-fetched from the live board: republishing whatever is currently
        # served would re-pin a stale dashboard forever, which is the defect
        # this step was rewritten to remove.
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          # Exact SHA-256 of the committed v0.4.28 historical artifact. Any new
          # benchmark evidence must arrive through Release -> Benchmark.
          PINNED_LEGACY_BENCH_SHA256: 52461f66687c1bfbdaa7c49d192ca3a3eb94fdf9ed0c19a9a6c9c34bff1708c6
        run: |
          set -euo pipefail
          mkdir -p docs/site
          got_fresh=0
          if [ -n "${TRIGGER_RUN_ID:-}" ]; then
            # The uploaded artifact can lag a few seconds behind the triggering
            # run's `completed` event, so retry before giving up. A premature
            # miss used to fall through to re-publishing the already-live board,
            # which permanently re-pinned it to whatever was last served.
            for attempt in 1 2 3 4 5 6; do
              rm -rf bench-artifact
              if gh run download "${TRIGGER_RUN_ID}" \
                   --repo "${GITHUB_REPOSITORY}" \
                   --name sdk-benchmark-results \
                   --dir bench-artifact 2>/dev/null \
                 && [ -s bench-artifact/docs/site/bench-results.json ]; then
                cp -v bench-artifact/docs/site/bench-results.json docs/site/bench-results.json
                got_fresh=1
                break
              fi
              echo "benchmark artifact not ready yet (attempt ${attempt}/6); retrying in 15s…"
              sleep 15
            done
          fi
          if [ -n "${TRIGGER_RUN_ID:-}" ] && [ "$got_fresh" != 1 ]; then
            echo "::error::benchmark run ${TRIGGER_RUN_ID} completed without a fresh sdk-benchmark-results artifact"
            exit 1
          fi
          if [ "$got_fresh" = 1 ]; then
            # Bind the downloaded JSON to this exact post-release benchmark run,
            # its checked-out release commit, and the release's published binary
            # checksum. Merely possessing an artifact with the expected name is
            # not sufficient release provenance.
            mapfile -t release_proof < <(python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          bench = json.loads(Path("docs/site/bench-results.json").read_text(encoding="utf-8"))
          release = bench.get("release") or {}
          git = bench.get("git") or {}
          environment = bench.get("environment") or {}
          tag = str(release.get("tag") or "")
          asset = str(release.get("asset") or "")
          digest = str(release.get("sha256") or "")
          commit = str(git.get("commit") or "")
          run_id = str(environment.get("run_id") or "")
          trigger_run_id = os.environ.get("TRIGGER_RUN_ID", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(os.environ.get("TRIGGER_EVENT") == "workflow_run", "benchmark was not triggered by Release workflow_run")
          require(bench.get("source") == "github-actions", "benchmark artifact source is not github-actions")
          require(environment.get("workflow") == "Benchmark · SDKs", "benchmark artifact workflow identity mismatch")
          require(run_id == trigger_run_id and run_id.isdigit(), "benchmark artifact run_id does not match triggering run")
          require(re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), f"invalid release tag provenance: {tag!r}")
          require(re.fullmatch(r"udb-linux-amd64(?:-[a-z0-9]+)?", asset), f"invalid release asset provenance: {asset!r}")
          require(re.fullmatch(r"[0-9a-f]{64}", digest), "benchmark artifact has no canonical binary SHA-256")
          require(re.fullmatch(r"[0-9a-f]{40}", commit), f"invalid release commit provenance: {commit!r}")
          expected_url = f"https://github.com/{repository}/releases/tag/{tag}"
          require(release.get("url") == expected_url, "benchmark artifact release URL does not match repository/tag")
          history = bench.get("history") or []
          require(history, "benchmark artifact has no current history point")
          require(history[-1].get("release_tag") == tag, "benchmark history tag disagrees with release provenance")
          require(history[-1].get("release_sha256") == digest, "benchmark history digest disagrees with release provenance")
          print(tag)
          print(asset)
          print(digest)
          print(commit)
          PY
            )
            if [ "${#release_proof[@]}" -ne 4 ]; then
              echo "::error::benchmark artifact did not yield complete release provenance"
              exit 1
            fi
            release_tag="${release_proof[0]}"
            release_asset="${release_proof[1]}"
            artifact_digest="${release_proof[2]}"
            artifact_commit="${release_proof[3]}"
            published_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" --jq .sha)"
            if [ "${published_commit}" != "${artifact_commit}" ]; then
              echo "::error::${release_tag} resolves to ${published_commit}, not benchmarked commit ${artifact_commit}"
              exit 1
            fi
            rm -rf release-proof
            gh release download "${release_tag}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${release_asset}.sha256" --dir release-proof
            read -r published_digest published_asset extra < "release-proof/${release_asset}.sha256"
            published_asset="${published_asset#\*}"
            if [[ ! "${published_digest}" =~ ^[0-9a-fA-F]{64}$ ]] || \
               [ "${published_asset}" != "${release_asset}" ] || \
               [ -n "${extra:-}" ] || \
               [ "${published_digest,,}" != "${artifact_digest}" ]; then
              echo "::error::benchmark binary digest does not match ${release_tag}/${release_asset}.sha256"
              exit 1
            fi
            # Reuse the benchmark's one canonical completeness validator. Fetch
            # the generated RPC manifest from the immutable benchmarked commit,
            # not the potentially newer default-branch checkout used to build
            # Pages, then require every measured SDK to contain that exact set.
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/docs/generated/bench-bodies.json?ref=${artifact_commit}" \
              > release-proof/bench-bodies.json
            python3 scripts/collect_sdk_bench_results.py \
              --gate docs/site/bench-results.json \
              --canonical-manifest release-proof/bench-bodies.json
          else
            # Push and workflow_dispatch have no fresh immutable artifact. They
            # may publish only the exact committed v0.4.28 historical bytes.
            # Comparing only with the preceding commit is insufficient: a
            # predecessor could change the file in a failed deploy and a later
            # unchanged successor could otherwise publish it.
            if grep -Eq '"schema_version"[[:space:]]*:[[:space:]]*2|"evidence_status"[[:space:]]*:[[:space:]]*"canonical_complete"' docs/site/bench-results.json; then
              echo "::error::committed schema-v2/canonical_complete benchmark payloads are forbidden; publish green proof through Release -> Benchmark"
              exit 1
            fi
            legacy_digest="$(sha256sum docs/site/bench-results.json | awk '{print $1}')"
            if [ "${legacy_digest}" != "${PINNED_LEGACY_BENCH_SHA256}" ]; then
              echo "::error::no-fresh-artifact Pages run accepts only pinned v0.4.28 benchmark SHA-256 ${PINNED_LEGACY_BENCH_SHA256}; got ${legacy_digest}"
              exit 1
            fi
            # Never re-fetch the currently-published board: if it ever went
            # stale, curling it back would republish the stale copy forever.
            echo "no fresh benchmark artifact; keeping committed docs/site/bench-results.json"
          fi
      - name: Build UDB's parser to WebAssembly (real udb-portable, not a mock)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p udb-wasm --release --target wasm32-unknown-unknown
          cp -v target/wasm32-unknown-unknown/release/udb_wasm.wasm docs/site/udb.wasm
      - name: Verify playground parses current editor input
        run: |
          node scripts/playground_wasm_smoke.mjs docs/site/udb.wasm
      - name: Verify site artifact contract
        run: |
          test -f docs/site/index.html
          test -f docs/site/playground.html
          test -f docs/site/architecture.html
          test -f docs/site/data-plane.html
          test -f docs/site/control-plane.html
          test -f docs/site/security.html
          test -f docs/site/enterprise.html
          test -f docs/site/sdks.html
          test -f docs/site/styles.css
          test -f docs/site/app.js
          test -f docs/site/playground.js
          test -f docs/site/udb.wasm
          test -f docs/site/assets/udb_logo.svg
          test -f docs/site/benchmarks.html
          test -f docs/site/benchmarks.js
          test -f docs/site/bench-results.json
          test -f docs/site/api.html
          test -f docs/site/api/udb-broker.swagger.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          swagger = json.loads(Path("docs/site/api/udb-broker.swagger.json").read_text())
          assert swagger.get("swagger") == "2.0", "published Swagger JSON is not Swagger 2.0"
          assert swagger.get("paths"), "published Swagger JSON has no API paths"
          required_extensions = [
              "x-udb-sdk-alias",
              "x-udb-scope",
              "x-udb-retry-safe",
              "x-udb-idempotency",
              "x-udb-resource",
              "x-udb-operation-kind",
          ]
          operations = []
          for api_path, path_item in swagger.get("paths", {}).items():
              for verb, operation in (path_item or {}).items():
                  if verb not in {"get", "put", "post", "patch", "delete"}:
                      continue
                  if not isinstance(operation, dict):
                      continue
                  operations.append((verb, api_path, operation))
          assert operations, "published Swagger JSON has no operations"
          for verb, api_path, operation in operations:
              where = f"{verb.upper()} {api_path}"
              operation_id = operation.get("operationId", "")
              assert operation_id, f"{where} has no operationId"
              assert not re.match(r"^[A-Za-z0-9]+Service_[A-Za-z0-9]+$", operation_id), f"{where} has generated operationId {operation_id}"
              missing_extensions = [key for key in required_extensions if key not in operation]
              assert not missing_extensions, f"{where} missing descriptor extensions: {missing_extensions}"
          bench = json.loads(Path("docs/site/bench-results.json").read_text())
          summary = bench.get("summary")
          assert isinstance(summary, dict), "benchmark JSON has no summary object"
          assert "failed_rpc_count" in summary, "benchmark JSON has no failed_rpc_count"
          assert isinstance(bench.get("sdks"), list), "benchmark JSON sdks must be a list"
          assert isinstance(bench.get("history"), list), "benchmark JSON history must be a list"
          for sdk in bench.get("sdks", []):
              rows = sdk.get("full_rpcs") or []
              assert isinstance(rows, list), f"benchmark full_rpcs for {sdk.get('id')} must be a list"
              for row in rows:
                  assert isinstance(row, dict), f"benchmark full_rpcs for {sdk.get('id')} contains a non-object row"
                  for field in ("wire_api", "api_alias", "operation_id"):
                      value = row.get(field)
                      assert isinstance(value, str) and value.strip(), (
                          f"benchmark full_rpcs for {sdk.get('id')} has empty {field}"
                      )
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          site = Path("docs/site").resolve()

          class LocalRefParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in {"href", "src"} and value:
                          self.refs.append(value)

          missing = []
          for html in sorted(site.glob("*.html")):
              parser = LocalRefParser()
              parser.feed(html.read_text(encoding="utf-8"))
              for ref in parser.refs:
                  parsed = urlparse(ref)
                  if parsed.scheme or parsed.netloc or ref.startswith(("#", "mailto:", "tel:")):
                      continue
                  target = parsed.path
                  if not target or target.startswith("/"):
                      continue
                  path = (html.parent / target).resolve()
                  if site != path and site not in path.parents:
                      missing.append(f"{html.name}: escapes site root: {ref}")
                  elif not path.exists():
                      missing.append(f"{html.name}: missing local ref: {ref}")
          assert not missing, "\n".join(missing)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
