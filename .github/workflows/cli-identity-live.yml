name: Declarative identity CLI live proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-identity-live-${{ github.sha }}
  cancel-in-progress: false

jobs:
  identity-live:
    name: Unix actual executable account, grant and API-key reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: udb
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udb -d udb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARGO_TERM_COLOR: never
      UDB_PG_DSN: postgres://udb:udb@127.0.0.1:5432/udb
      UDB_AUTH_GRPC_TARGET: http://127.0.0.1:50061
      UDB_AUTH_TARGET: http://127.0.0.1:50061
      UDB_GRPC_ADDR: 127.0.0.1:50051
      UDB_LIVE_TENANT: 10000000-0000-0000-0000-000000000004
      UDB_LIVE_PROJECT: default
      UDB_LIVE_USERNAME: o4-operator@example.invalid
      UDB_TLS_REQUIRED: "false"
      UDB_SERVICE_IDENTITY_REQUIRED: "false"
      UDB_ALLOW_DEGRADED_BACKENDS: "true"
      UDB_SESSION_ENABLED: "true"
      UDB_STARTUP_FORCE_SYNC: "true"
      UDB_ABAC_DEFAULT_ALLOW: "false"
      UDB_CDC_ENABLED: "false"
      UDB_PROJECTION_ENABLED: "false"
      UDB_PROJECTION_RECONCILE_ENABLED: "false"
      UDB_SAGA_RECOVERY_ENABLED: "false"
      UDB_JWT_PRIVATE_KEY: src/runtime/testdata/jwt_rs256_private.pem
      UDB_JWT_PUBLIC_KEY: src/runtime/testdata/jwt_rs256_public.pem
      UDB_AUDIT_EXPORT_POSTGRES: "1"
      UDB_AUDIT_EXPORT_FILE: /tmp/udb-o4-audit.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-cli-identity-postgres
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the actual CLI and run its identity source regressions
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-identity-output
          cargo build --locked --no-default-features --features postgres,runtime-logging --bin udb
          cargo test --locked --no-default-features --features postgres,runtime-logging --bin udb cli::identity_ops::tests:: -- --nocapture \
            | tee ci-identity-output/source-regressions.log
          grep -Eq '^test result: ok\. 8 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in ' ci-identity-output/source-regressions.log
      - name: Prepare private operator credentials and native SDK client
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install ./sdk/python 'psycopg[binary]'
          python3 - <<'PY'
          import os, secrets
          values = {
              "O4_OPERATOR_PASSWORD": "Operator1!" + secrets.token_hex(24),
              "UDB_PASSWORD_HASH_SECRET": secrets.token_hex(32),
              "UDB_SESSION_HASH_SECRET": secrets.token_hex(32),
              "UDB_ENCRYPTION_KEY": secrets.token_hex(32),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  output.write(f"{name}={value}\n")
          PY
      - name: Run the real signed native CLI proof
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-identity-output
          broker_pid=""
          cleanup() {
            if [ -n "$broker_pid" ]; then
              kill "$broker_pid" 2>/dev/null || true
              wait "$broker_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          target/debug/udb auth bootstrap user \
            --username "$UDB_LIVE_USERNAME" --email "$UDB_LIVE_USERNAME" \
            --password "$O4_OPERATOR_PASSWORD" --tenant "$UDB_LIVE_TENANT" \
            --project "$UDB_LIVE_PROJECT" > "$RUNNER_TEMP/o4-bootstrap.json"
          target/debug/udb serve proto "" "$UDB_GRPC_ADDR" > "$RUNNER_TEMP/o4-broker.log" 2>&1 &
          broker_pid=$!
          for attempt in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/50051) >/dev/null 2>&1 && \
               (echo > /dev/tcp/127.0.0.1/50061) >/dev/null 2>&1; then
              break
            fi
            kill -0 "$broker_pid"
            if [ "$attempt" -eq 60 ]; then
              echo "Native identity proof broker readiness timed out" >&2
              exit 1
            fi
            sleep 2
          done
          # Python gRPC expects host:port; the CLI accepts the existing HTTP URI.
          UDB_AUTH_GRPC_TARGET=127.0.0.1:50061 python3 scripts/cli_identity_live.py \
            --bin target/debug/udb --output ci-identity-output/receipt.json
      - name: Require actual completed cases and owned cleanup
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          proof = json.loads(Path("ci-identity-output/receipt.json").read_text())
          required = {
              "diff-before-mutation", "duplicate-declaration-refused-before-mutation",
              "foreign-tenant-and-project-refused-before-mutation",
              "plaintext-declaration-refused-without-credential-output",
              "canonical-forbidden-scope-refused-before-mutation",
              "server-generated-account-and-scoped-key", "apply-twice-noop",
              "malformed-live-grant-refused-before-mutation", "scopes-reviewed-and-replay-noop",
              "stale-key-native-rereview-and-replay",
              "explicit-rotation-and-replay-noop", "pending-and-foreign-output-binding-refused-before-mutation",
              "existing-output-never-overwritten", "bootstrap-hijack-refused-before-account-creation",
              "explicit-transfer-only-and-replay-noop",
              "up-preserves-inline-and-external-relative-references",
          }
          cases = proof["cases"]
          assert proof["source_sha"] == os.environ["GITHUB_SHA"]
          assert proof["runtime_proof"] is True and proof["public_rpc_count_changed"] is False
          assert proof["success"] is True and proof["cleanup_success"] is True
          assert not proof["cleanup_errors"] and len(cases) == len(required)
          assert {case["name"] for case in cases} == required
          assert all(case["success"] is True for case in cases)
          assert len(proof["binary_sha256"]) == 64
          print("Exact actual CLI identity cases and owned cleanup passed")
          PY
      - name: Upload redacted proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-identity-live-${{ github.sha }}
          path: |
            ci-identity-output/receipt.json
            ci-identity-output/source-regressions.log
          if-no-files-found: error
          retention-days: 14
