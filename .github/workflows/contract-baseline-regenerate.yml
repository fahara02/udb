name: Contract baseline regeneration (temporary)

on:
  push:
    branches:
      - fix/0.5.7-audit

permissions:
  actions: read
  contents: read

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regen-contract-baseline]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download CI-built broker
        uses: actions/download-artifact@v4
        with:
          name: udb-broker-debug
          path: target/debug
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31842747425
      - name: Regenerate descriptor baseline
        shell: bash
        run: |
          chmod +x target/debug/udb
          target/debug/udb native contract-baseline \
            --baseline docs/generated/contract-baseline.bin
      - name: Package generated baseline diff
        shell: bash
        run: |
          git diff --binary --full-index -- \
            docs/generated/contract-baseline.bin > contract-baseline.patch
          test -s contract-baseline.patch
      - name: Upload generated baseline patch
        uses: actions/upload-artifact@v4
        with:
          name: contract-baseline-patch
          path: contract-baseline.patch
          if-no-files-found: error
          retention-days: 1
