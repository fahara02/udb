name: Release · Docker image

# Publishes the UDB broker/CLI image used by standalone examples and users who
# prefer a container over downloading raw release binaries.
#
# Public image contract:
#
#   ghcr.io/fahara02/udb:<semver>
#   ghcr.io/fahara02/udb:<major>.<minor>
#   ghcr.io/fahara02/udb:<major>
#   ghcr.io/fahara02/udb:latest
#   ghcr.io/fahara02/udb:sha-<short-sha>
#
# Trigger: a pushed `v*.*.*` tag, or manual dispatch for rebuilding/publishing
# from the selected ref.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fahara02/udb

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish ghcr.io/fahara02/udb
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Version guard: the `v<x.y.z>` tag must equal the crate version and every
      # manifest/protocol constant must match versions.json before we publish an
      # image tagged from that version. See VERSIONING.md.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Versions consistent with versions.json
        run: node scripts/check-versions.mjs
      - name: Tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          crate="$(node -p "require('./versions.json').components.udb.version")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag}" != "${crate}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match udb crate version ${crate}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        shell: bash
        run: |
          set -euo pipefail
          builder="udb-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            docker buildx create --name "$builder" --driver docker-container --use
            if docker buildx inspect --bootstrap --builder "$builder"; then
              exit 0
            fi
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Docker Buildx bootstrap failed after retries" >&2
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
