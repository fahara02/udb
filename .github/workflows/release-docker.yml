name: Release · Docker image

# Publishes the UDB broker/CLI image used by standalone examples and users who
# prefer a container over downloading raw release binaries.
#
# Public image contract:
#
#   ghcr.io/fahara02/udb:<semver>
#   ghcr.io/fahara02/udb:<major>.<minor>
#   ghcr.io/fahara02/udb:<major>
#   ghcr.io/fahara02/udb:latest
#   ghcr.io/fahara02/udb:sha-<short-sha>
#
# Trigger: a pushed `v*.*.*` tag, or manual dispatch for rebuilding/publishing
# from the selected ref.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fahara02/udb

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish ghcr.io/fahara02/udb
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Version guard: the `v<x.y.z>` tag must equal the crate version and every
      # manifest/protocol constant must match versions.json before we publish an
      # image tagged from that version. See VERSIONING.md.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Versions consistent with versions.json
        run: node scripts/check-versions.mjs
      - name: Tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          crate="$(node -p "require('./versions.json').components.udb.version")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag}" != "${crate}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match udb crate version ${crate}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        shell: bash
        run: |
          set -euo pipefail
          builder="udb-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            docker buildx create --name "$builder" --driver docker-container --use
            if docker buildx inspect --bootstrap --builder "$builder"; then
              exit 0
            fi
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Docker Buildx bootstrap failed after retries" >&2
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Prune stale GHCR versions after every tagged release ────────────────────
  # Two passes:
  #   1. Untagged versions — build-cache ghosts and failed-push leftovers.
  #   2. sha-<short-sha> digest tags — accumulate on every release; keep the
  #      five newest so recent history is recoverable, delete the rest.
  # Semver tags (v0.x.x, 0.x, 0, latest) are protected by ignore-versions and
  # are NEVER touched by this job.
  cleanup:
    name: Prune stale GHCR image versions
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      # Pass 1 – delete versions with no tags at all (build-cache ghosts,
      # interrupted pushes, multi-arch index fragments that lost their manifest).
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: udb
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'true'
        continue-on-error: true   # graceful when there is nothing to delete

      # Pass 2 – prune old sha-* digest tags; keep the 5 most recent so recent
      # SHAs are still recoverable. Semver / latest / major / major.minor tags
      # are protected by the ignore-versions regex and are never deleted.
      - name: Prune old sha-* digest tags (keep newest 5)
        uses: actions/delete-package-versions@v5
        with:
          package-name: udb
          package-type: container
          min-versions-to-keep: 5
          ignore-versions: '^(v?\d+\.\d+(\.\d+)?(-[a-zA-Z0-9._]+)?|latest|\d+\.\d+|\d+)$'
        continue-on-error: true
