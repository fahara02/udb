name: Release · Docker image

# Reusable publisher invoked by `release.yml` after the release binaries are
# built. Publishes the UDB broker/CLI image used by standalone examples and users
# who prefer a container over downloading raw release binaries.
#
# Single-artifact-system (Chapter 15.A.2): this job does NOT recompile the broker.
# It downloads the `udb-linux-amd64-full` RELEASE ASSET that release-binaries.yml
# attached, drops it into the build context as `udb`, and builds the slim
# `Dockerfile.release` image around it — same provenance binary in the tarball AND
# the image.
#
# GHCR pruning is NOT done here (Chapter 15.8.3): `cleanup-packages.yml` is the
# sole GHCR owner. There is no `cleanup` job in this workflow.
#
# Public image contract:
#
#   ghcr.io/fahara02/udb:<semver>
#   ghcr.io/fahara02/udb:<major>.<minor>
#   ghcr.io/fahara02/udb:<major>
#   ghcr.io/fahara02/udb:latest
#   ghcr.io/fahara02/udb:sha-<short-sha>

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fahara02/udb

permissions:
  contents: read

jobs:
  publish:
    name: publish ghcr.io/fahara02/udb
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Version guard: the `v<x.y.z>` tag must equal the crate version and every
      # manifest/protocol constant must match versions.json before we publish an
      # image tagged from that version. version-guard needs Node first.
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: 'true'
      - uses: ./.github/actions/version-guard
        with:
          component: udb

      # Single-artifact: pull the published release binary into the build context
      # instead of recompiling. This workflow is only invoked by the tag-driven
      # release orchestrator, so the tag is always the release tag being published.
      - name: Download release binary into build context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          echo "Downloading udb-linux-amd64-full from release ${tag}"
          gh release download "${tag}" --pattern 'udb-linux-amd64-full' --output udb
          chmod +x udb

      - name: Set up Docker Buildx
        shell: bash
        run: |
          set -euo pipefail
          builder="udb-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            docker buildx create --name "$builder" --driver docker-container --use
            if docker buildx inspect --bootstrap --builder "$builder"; then
              exit 0
            fi
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Docker Buildx bootstrap failed after retries" >&2
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      # Build the slim runtime image around the prebuilt binary (Dockerfile.release
      # COPYs ./udb from the context), so the broker is never recompiled here.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
