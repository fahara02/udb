name: Release · Docker image

# Publishes the UDB broker/CLI image used by standalone examples and users who
# prefer a container over downloading raw release binaries.
#
# Public image contract:
#
#   ghcr.io/fahara02/udb:<semver>
#   ghcr.io/fahara02/udb:<major>.<minor>
#   ghcr.io/fahara02/udb:<major>
#   ghcr.io/fahara02/udb:latest
#   ghcr.io/fahara02/udb:sha-<short-sha>
#
# Trigger: a pushed `v*.*.*` tag, or manual dispatch for rebuilding/publishing
# from the selected ref.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fahara02/udb

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish ghcr.io/fahara02/udb
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
