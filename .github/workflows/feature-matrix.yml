name: feature-matrix

# D.8: cross-platform + feature-subset BUILD coverage, kept separate from ci.yml
# (the main pipeline) so the slim / Windows / optimized-SIMD jobs can't entangle
# it. Compile-only (no live backends) — a fast signal that no feature combination
# or platform has been broken, and that the acceleration module (D.5/D.6) is not
# a platform-specific code island. Live-backend + integration tests stay in ci.yml.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Slim broker: postgres-only, no kafka/native-deps — proves disabled backends
  # compile out and rdkafka's native build is not required for the core.
  slim-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features --features postgres --all-targets

  # Default feature set on both Linux and Windows — Windows support is explicit,
  # not accidental (D.9). cargo test --lib (scalar-only, no live backends).
  default:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib

  # Optimized acceleration features compile + their scalar-equivalence tests run
  # (D.6). Gated SIMD crates must build and match scalar on the CI host.
  optimized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --features simd-codecs,simd-json,simd-checksum runtime::accel

  # Linux AArch64 scalar-only compile of the accel module (D.5/E.2) — proves the
  # acceleration layer's scalar fallback builds on a non-x86 target.
  aarch64-scalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-unknown-linux-gnu }
      - name: Install AArch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target aarch64-unknown-linux-gnu --no-default-features --features postgres
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

  # E.2 step 2: Linux x86_64 FULL-feature library test. `--all-features` turns on
  # every backend plus the off-by-default integrations — oidc, webauthn
  # (openssl-sys), mongodb-native, simd-json, bench-internals — so it needs the
  # same native build deps as the shipped release binary (ci.yml auth-release).
  # This is the broadest signal that no feature combination breaks the build and
  # that the scalar-equivalent lib tests pass with the entire surface compiled in
  # (the acceleration module is proven not to be a platform/feature code island).
  all-features:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build deps (webauthn/openssl, nasm, perl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang perl nasm ninja-build pkg-config libssl-dev
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --lib
