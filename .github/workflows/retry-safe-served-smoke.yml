name: Retry-safe served smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to prove, or 'latest'"
        required: true
        default: latest
        type: string
      release_asset:
        description: "Linux release asset name to download"
        required: true
        default: udb-linux-amd64-full
        type: string
      broker_artifact_run_id:
        description: "Optional CI run id containing udb-broker-debug for current-main proof before release"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: retry-safe-served-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retry-safe-served:
    name: Retry-safe mutation metadata served proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ASSET: ${{ inputs.release_asset }}
      UDB_LIVE_SDK_TESTS: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: udb_ci
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udb -d udb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up SDK toolchains
        uses: ./.github/actions/setup-sdk-toolchains
        with:
          python: "true"

      - name: Install Python SDK runtime deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e sdk/python

      - name: Resolve served binary
        uses: ./.github/actions/resolve-served-binary
        with:
          release-tag: ${{ inputs.release_tag }}
          release-asset: ${{ inputs.release_asset }}
          broker-artifact-run-id: ${{ inputs.broker_artifact_run_id }}

      - name: Set served-smoke tenant fixtures
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "UDB_TENANT2_USERNAME=${UDB_LIVE_USERNAME:-sdk-live-admin}-tenant2"
            echo "UDB_TENANT2_PASSWORD=SdkLive#2026PassTwo"
            echo "UDB_TENANT2_CODE=${UDB_LIVE_TENANT:-sdk-live}-tenant2"
            echo "UDB_TENANT2_PROJECT=${UDB_LIVE_PROJECT:-default}-tenant2"
          } >> "$GITHUB_ENV"

      - name: Start backends
        uses: ./.github/actions/start-backends
        with:
          minio: "true"
          kafka: "true"
          qdrant: "true"
          redis: "true"
          clickhouse: "false"
          neo4j: "false"

      - name: Write broker env
        uses: ./.github/actions/broker-env
        with:
          pg_dsn: postgres://udb:udb@localhost:5432/udb_ci
          nosql_dsn: mongodb://localhost:27017/udb_live_sdk?directConnection=true
          mongodb_dsn: mongodb://localhost:27017/udb_live_sdk?directConnection=true
          nosql_database: udb_live_sdk
          grpc_addr: 127.0.0.1:50051
          grpc_target: 127.0.0.1:50051
          auth_grpc_addr: 127.0.0.1:50061
          auth_grpc_target: 127.0.0.1:50061
          cdc_enabled: "true"
          startup_dry_run: "false"
          object_bucket: udb-storage
          enable_column_backend: "false"
          enable_graph_backend: "false"

      - name: Bootstrap served-smoke users
        shell: bash
        run: |
          set -euo pipefail
          "${UDB_SERVED_BIN}" auth bootstrap user \
            --username "${UDB_LIVE_USERNAME}" \
            --email "${UDB_LIVE_USERNAME}" \
            --password "${UDB_LIVE_PASSWORD}" \
            --tenant "${UDB_LIVE_TENANT}" \
            --project "${UDB_LIVE_PROJECT}"
          "${UDB_SERVED_BIN}" auth bootstrap user \
            --username "${UDB_TENANT2_USERNAME}" \
            --email "${UDB_TENANT2_USERNAME}" \
            --password "${UDB_TENANT2_PASSWORD}" \
            --tenant "${UDB_TENANT2_CODE}" \
            --project "${UDB_TENANT2_PROJECT}"

      - name: Launch broker
        uses: ./.github/actions/launch-broker
        with:
          bin: ${{ env.UDB_SERVED_BIN }}
          grpc-addr: 127.0.0.1:50051
          bootstrap: "false"
          ready-timeout-secs: "180"
          log-file: /tmp/udb-retry-safe-served.log

      - name: Generate served proof inputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_databroker_served_smoke_inputs.py \
            --out-dir smoke-input \
            --auth-target "${UDB_AUTH_GRPC_TARGET}" \
            --username "${UDB_LIVE_USERNAME}" \
            --password "${UDB_LIVE_PASSWORD}" \
            --tenant "${UDB_LIVE_TENANT}" \
            --tenant2-username "${UDB_TENANT2_USERNAME}" \
            --tenant2-password "${UDB_TENANT2_PASSWORD}" \
            --tenant2 "${UDB_TENANT2_CODE}" \
            --project "${UDB_LIVE_PROJECT}" \
            --tenant2-project "${UDB_TENANT2_PROJECT}"

      - name: Run retry-safe smoke selftest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/retry_safe_served_smoke.py --selftest

      - name: Run live retry-safe served replay smoke
        shell: bash
        run: |
          set -euo pipefail
          args=(--target "${UDB_GRPC_TARGET}" --require-all-proofs)
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "$line" ] && args+=(--header "$line")
          done < smoke-input/header.txt
          python scripts/retry_safe_served_smoke.py "${args[@]}" \
            --upsert-json smoke-input/retry-upsert.json \
            --delete-json smoke-input/retry-delete.json

      - name: Upload served smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-safe-served-smoke-diagnostics
          path: |
            smoke-input/*.json
            smoke-output/logs/**
            /tmp/udb-retry-safe-served.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop broker and backends
        if: always()
        shell: bash
        run: |
          if [ -n "${UDB_BROKER_PID:-}" ]; then kill "${UDB_BROKER_PID}" 2>/dev/null || true; fi
          docker rm -f udb-bench-minio 2>/dev/null || true
          docker rm -f udb-bench-kafka 2>/dev/null || true
          docker rm -f udb-bench-qdrant 2>/dev/null || true
          docker rm -f udb-bench-redis 2>/dev/null || true
          docker rm -f udb-bench-clickhouse 2>/dev/null || true
          docker rm -f udb-bench-neo4j 2>/dev/null || true
