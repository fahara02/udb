name: Benchmark · SDKs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-sdks.yml"
      - "scripts/collect_sdk_bench_results.py"
      - "docs/site/benchmarks.html"
      - "docs/site/benchmarks.js"
      - "docs/site/styles.css"
      - "docs/bench-bodies/**"
      - "sdk/go/udbclient/live_perf_bodies.go"
      - "sdk/go/udbclient/live_perf_bodies_test.go"
      - "sdk/go/udbclient/live_perf_seed_test.go"
      - "sdk/go/udbclient/live_perf_test.go"
      - "sdk/python/tests/test_live_conformance.py"
      - "sdk/typescript/live-auth.test.ts"
      - "sdk/php/tests/Live/GeneratedRpcSurfaceTest.php"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to benchmark, or latest"
        default: "latest"
        required: true
      release_asset:
        description: "Linux release asset to run"
        default: "udb-linux-amd64-full"
        required: true
  workflow_run:
    workflows: ["Release · binaries"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UDB_PG_DSN: postgres://udb:udb@localhost:5432/udb_ci
  UDB_PG_MAX_CONNECTIONS: "40"
  UDB_PG_MIN_CONNECTIONS: "4"
  UDB_PG_ACQUIRE_TIMEOUT: "60"
  UDB_NOSQL_DSN: mongodb://localhost:27017/udb_live_sdk?directConnection=true
  UDB_MONGODB_DSN: mongodb://localhost:27017/udb_live_sdk?directConnection=true
  UDB_NOSQL_DATABASE: udb_live_sdk
  UDB_MINIO_ENDPOINT: http://localhost:9000
  UDB_MINIO_ACCESS_KEY: minio
  UDB_MINIO_SECRET_KEY: minio123
  UDB_MINIO_REGION: us-east-1
  UDB_KAFKA_BROKERS: localhost:59192
  # Vector / cache / column backends the perf bench drives (Vector*, Cache*, TimeSeries*/
  # AnalyticalQuery). Started as docker containers below; without them those ~11 RPCs fail
  # in the dashboard. UDB_COLUMN_DSN is the broker's primary ClickHouse var (deploy.rs:248).
  UDB_QDRANT_URL: http://localhost:6333
  UDB_REDIS_DSN: redis://localhost:6379/0
  # Graph backend (GraphMutate/GraphQuery). Without neo4j those RPCs fail "backend executor
  # 'neo4j:default' is not registered" across all SDKs. Broker reads UDB_GRAPH_DSN (HTTP).
  UDB_GRAPH_DSN: http://localhost:7474
  UDB_GRAPH_USER: neo4j
  UDB_GRAPH_PASSWORD: test1234
  UDB_GRAPH_DATABASE: neo4j
  # ClickHouse: the broker connects over the HTTP interface (clickhouse.rs) and resolves
  # credentials from UDB_COLUMN_USER/PASSWORD/DATABASE labels — NOT from the DSN userinfo
  # (instances.rs:403-406). So use the container's zero-config `default` user (no password,
  # `default` db) and a clean host DSN. UDB_COLUMN_DSN is the broker's primary CH var.
  UDB_COLUMN_DSN: http://localhost:8123
  # Don't abort broker startup if an optional backend is briefly unready (matches local).
  UDB_ALLOW_DEGRADED_BACKENDS: "true"
  UDB_GRPC_ADDR: 127.0.0.1:50051
  UDB_GRPC_TARGET: 127.0.0.1:50051
  UDB_AUTH_GRPC_ADDR: 127.0.0.1:50061
  UDB_AUTH_GRPC_TARGET: 127.0.0.1:50061
  UDB_METRICS_ADDR: 127.0.0.1:19092
  UDB_ABAC_DEFAULT_ALLOW: "true"
  UDB_CDC_ENABLED: "true"
  UDB_PROJECTION_WORKER_ENABLED: "false"
  UDB_RECONCILIATION_ENABLED: "false"
  UDB_SAGA_RECOVERY_ENABLED: "false"
  UDB_STARTUP_FORCE_SYNC: "true"
  UDB_STARTUP_DRY_RUN: "false"
  UDB_AUDIT_SINK_URL: file:///tmp/udb-bench-audit.jsonl
  UDB_ENCRYPTION_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
  UDB_JWT_PRIVATE_KEY: src/runtime/testdata/jwt_rs256_private.pem
  UDB_JWT_PUBLIC_KEY: src/runtime/testdata/jwt_rs256_public.pem
  UDB_SESSION_ENABLED: "true"
  UDB_SESSION_HASH_SECRET: ci-bench-session-hash-secret
  UDB_PASSWORD_HASH_SECRET: ci-bench-password-hash-secret
  # Bench-harness broker flags — match .bench-local/launch-verify.ps1 so the live perf
  # harness drives every RPC down its real success path (see harness_correction.md). These
  # are broker-only env (the SDK processes ignore them); the broker inherits them because it
  # is launched in the same shell as this env block.
  # WebAuthn: RP id/origin required by StartWebAuthnRegistration; TEST_MODE enables the dev
  # soft-authenticator so the harness sentinel mints + verifies a REAL credential.
  UDB_WEBAUTHN_RP_ID: localhost
  UDB_WEBAUTHN_ORIGIN: http://localhost
  UDB_WEBAUTHN_TEST_MODE: "1"
  # SAML: dev self-asserted IdP for the SamlAcs sentinel path.
  UDB_SAML_TEST_MODE: "1"
  # OTP: echo the dev code in SendOTP/IssueMfaChallenge responses so Verify*/Reset* resolve;
  # cooldown 0 so measured SendOTP/ResendOTP don't race the per-(user,type) cooldown.
  UDB_OTP_DEV_ECHO: "1"
  UDB_OTP_COOLDOWN_SECONDS: "0"
  # Object plane: the StorageService bucket/backend FinalizeUpload HEADs (presigned upload).
  UDB_OBJECT_BACKEND: minio
  UDB_OBJECT_BUCKET: udb-storage
  # Reapers off: the perf seed joins a WebRTC peer via a unary call (no live signaling stream
  # to heartbeat), so the 60s reaper would disconnect it before measurement → "peer is not an
  # active member" on PublishTrack/MuteTrack/Signal/IssueCredentials.
  UDB_WEBRTC_REAP_INTERVAL_SECS: "0"
  UDB_STORAGE_REAP_INTERVAL_SECS: "0"
  # Identity MUST mirror the local grind exactly (grind-once/python/php + fresh-bootstrap.ps1
  # all bootstrap AND log in as sdk-live-admin / SdkLive#2026Pass via USERNAME login — not an
  # email). The harness reads UDB_LIVE_USERNAME/PASSWORD for both bootstrap and login.
  UDB_LIVE_USERNAME: sdk-live-admin
  UDB_LIVE_PASSWORD: SdkLive#2026Pass
  UDB_LIVE_TENANT: sdk-live
  UDB_LIVE_PROJECT: default
  UDB_LIVE_SDK_TESTS: "1"
  UDB_LIVE_PERF: "1"
  # Pin the harness defaults explicitly so CI == local grind (the harness already defaults
  # these to the same values — live_conformance_test.go:565/1300 — but make it unambiguous).
  UDB_LIVE_S3_BUCKET: udb-live-sdk
  UDB_LIVE_REQUIRED_BACKENDS: postgres,mongodb,minio

jobs:
  validate:
    name: Validate benchmark workflow changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dashboard and collector syntax
        run: |
          set -euo pipefail
          node --check docs/site/benchmarks.js
          python -m py_compile scripts/collect_sdk_bench_results.py
      - name: Confirm release benchmark is gated
        shell: bash
        run: |
          set -euo pipefail
          grep -q "github.event_name == 'workflow_dispatch'" .github/workflows/benchmark-sdks.yml
          grep -q "github.event.workflow_run.conclusion == 'success'" .github/workflows/benchmark-sdks.yml
          grep -q "startsWith(github.event.workflow_run.head_branch, 'v')" .github/workflows/benchmark-sdks.yml

  benchmark:
    name: Release binary + SDK live benchmarks
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: udb_ci
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udb -d udb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: shivammathur/setup-php@v2
        with:
          # 8.3 mirrors sdk/php/Dockerfile.live-test (the proven-local PHP lane). composer.lock is
          # gitignored so this is a fresh resolve; 8.3 keeps CI on the same minor the local Docker
          # bench uses, avoiding dep-resolution drift vs the 8.2 the prior run happened to use.
          php-version: "8.3"
          # NOT the protobuf PECL C extension: it fatals on the SDK's `import public`
          # descriptors ("public_dep N is out of range"), which crashes test collection
          # (PHPUnit exit 2) before any RPC is measured. The pure-PHP google/protobuf
          # runtime (composer) handles public imports correctly. Mirrors Dockerfile.live-test.
          extensions: grpc, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Resolve release binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag || 'latest' }}
          INPUT_ASSET: ${{ inputs.release_asset || 'udb-linux-amd64-full' }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          mkdir -p bench-output/bin bench-output/status
          tag="${INPUT_TAG}"
          if [ -n "${WORKFLOW_RUN_TAG}" ]; then
            tag="${WORKFLOW_RUN_TAG}"
          elif [ -z "${tag}" ] || [ "${tag}" = "latest" ]; then
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Benchmark requires a released SemVer tag, got '${tag}'"
            exit 1
          fi
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern "${INPUT_ASSET}" --dir bench-output/bin
          chmod +x "bench-output/bin/${INPUT_ASSET}"
          {
            echo "UDB_BENCH_RELEASE_TAG=${tag}"
            echo "UDB_BENCH_RELEASE_ASSET=${INPUT_ASSET}"
            echo "UDB_BENCH_RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            echo "UDB_BENCH_BIN=${GITHUB_WORKSPACE}/bench-output/bin/${INPUT_ASSET}"
          } >> "$GITHUB_ENV"

      - name: Start MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name udb-bench-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:RELEASE.2025-01-20T14-49-07Z \
            server /data --console-address ":9001"
          for attempt in {1..60}; do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null && exit 0
            docker ps --filter name=udb-bench-minio --filter status=running --quiet | grep -q . || {
              docker logs udb-bench-minio
              exit 1
            }
            sleep 2
          done
          docker logs udb-bench-minio
          exit 1

      - name: Start Kafka
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name udb-bench-kafka --hostname kafka \
            -p 59192:59192 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093 \
            -e KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:59192 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://localhost:9092,EXTERNAL://localhost:59192 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            -e KAFKA_COMPRESSION_TYPE=lz4 \
            apache/kafka:3.9.0
          for attempt in {1..60}; do
            if docker exec udb-bench-kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              for topic in udb.authn.user.registered.v1 udb.notification.sent.v1; do
                docker exec udb-bench-kafka /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                  --bootstrap-server localhost:9092 --topic "$topic" --partitions 1 --replication-factor 1
              done
              exit 0
            fi
            docker ps --filter name=udb-bench-kafka --filter status=running --quiet | grep -q . || {
              docker logs udb-bench-kafka
              exit 1
            }
            sleep 2
          done
          docker logs udb-bench-kafka
          exit 1

      # The 3 optional backends below use continue-on-error: a container/health hiccup must
      # NOT turn this always-green dashboard job red. If one fails to come up, the broker
      # starts degraded (UDB_ALLOW_DEGRADED_BACKENDS) and only that backend's RPCs show as
      # dashboard failures — never worse than before these backends were added.
      - name: Start Qdrant (vector backend)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run -d --name udb-bench-qdrant -p 6333:6333 qdrant/qdrant:v1.12.4
          for attempt in {1..60}; do
            curl -fsS http://localhost:6333/readyz >/dev/null 2>&1 && exit 0
            docker ps --filter name=udb-bench-qdrant --filter status=running --quiet | grep -q . || { docker logs udb-bench-qdrant; exit 1; }
            sleep 2
          done
          docker logs udb-bench-qdrant
          exit 1

      - name: Start Redis (cache backend)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run -d --name udb-bench-redis -p 6379:6379 redis:7-alpine
          for attempt in {1..30}; do
            docker exec udb-bench-redis redis-cli ping 2>/dev/null | grep -q PONG && exit 0
            docker ps --filter name=udb-bench-redis --filter status=running --quiet | grep -q . || { docker logs udb-bench-redis; exit 1; }
            sleep 2
          done
          docker logs udb-bench-redis
          exit 1

      - name: Start ClickHouse (column backend)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          # Zero-config default user (no password, `default` db) — the broker resolves CH
          # auth from UDB_COLUMN_USER/PASSWORD (unset → default/empty), not the DSN userinfo.
          docker run -d --name udb-bench-clickhouse -p 8123:8123 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            clickhouse/clickhouse-server:24.8
          for attempt in {1..60}; do
            # Query-level gate (not /ping): the broker issues SQL, so wait until the HTTP
            # interface actually answers a SELECT, not just liveness.
            curl -fsS "http://localhost:8123/" --data-binary "SELECT 1" 2>/dev/null | grep -q "^1$" && exit 0
            docker ps --filter name=udb-bench-clickhouse --filter status=running --quiet | grep -q . || { docker logs udb-bench-clickhouse; exit 1; }
            sleep 2
          done
          docker logs udb-bench-clickhouse
          exit 1

      - name: Start Neo4j (graph backend)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          # GraphMutate/GraphQuery resolve to the 'neo4j:default' executor; without a live
          # neo4j they fail "backend executor 'neo4j:default' is not registered". Broker reads
          # UDB_GRAPH_DSN (HTTP :7474) + UDB_GRAPH_USER/PASSWORD.
          docker run -d --name udb-bench-neo4j -p 7474:7474 -p 7687:7687 \
            -e NEO4J_AUTH=neo4j/test1234 \
            neo4j:5
          # REAL query-readiness gate (not just HTTP 200): neo4j:5 serves :7474 ~30s before it
          # accepts Cypher, and the broker's executor talks to the SAME HTTP tx endpoint. If we
          # let the broker mount neo4j before it answers queries, Graph* degrade for the whole run
          # (and continue-on-error would hide it). Poll the tx/commit endpoint until errors==[].
          for attempt in {1..80}; do
            if curl -fsS -u neo4j:test1234 -H 'Content-Type: application/json' \
                 -d '{"statements":[{"statement":"RETURN 1"}]}' \
                 http://localhost:7474/db/neo4j/tx/commit 2>/dev/null | grep -q '"errors":\[\]'; then
              echo "neo4j query-ready after ~$((attempt*3))s"; exit 0
            fi
            docker ps --filter name=udb-bench-neo4j --filter status=running --quiet | grep -q . || { docker logs udb-bench-neo4j; exit 1; }
            sleep 3
          done
          docker logs udb-bench-neo4j
          exit 1

      - name: Create MinIO bucket
        shell: bash
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 minio minio123
          mc mb --ignore-existing local/udb-live-sdk
          # StorageService object bucket (UDB_OBJECT_BUCKET) for the presigned FinalizeUpload path.
          mc mb --ignore-existing local/udb-storage

      - name: Install SDK dependencies
        run: |
          set -euo pipefail
          ( cd sdk/typescript && npm ci --no-audit --no-fund )
          python -m pip install --upgrade pip
          python -m pip install -e "sdk/python[dev]"
          # composer.lock + vendor/ are gitignored, so this is a fresh resolve scoped to the CI
          # PHP version (picks platform-compatible deps automatically — proven: the prior CI run
          # measured all 262 RPCs). No --ignore-platform-reqs (it would force the 8.4.1-only deps).
          ( cd sdk/php && composer install --no-interaction --no-progress --prefer-dist )

      - name: Prepare per-SDK reset script (fresh DB + broker + bootstrap + seed)
        shell: bash
        run: |
          set -euo pipefail
          # psql for the reset/seed; `update || true` tolerates apt mirror desync.
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq postgresql-client
          mkdir -p bench-output/status bench-output/logs
          # reset.sh runs BEFORE each SDK bench. It reproduces .bench-local/grind-once.ps1 exactly:
          # stop the previous broker, recreate udb_ci, bootstrap, start a FRESH broker, re-seed.
          # Each SDK therefore runs against a pristine PG + broker, so cross-SDK state in PG
          # (migration ledger, IdP providers, asset pipeline names, canary/policy versions) cannot
          # leak between SDKs. This is the only way CI reproduces the per-SDK local zero.
          # Quoted <<'RESET' → nothing expands at write-time; $vars resolve when reset.sh runs.
          cat > bench-output/reset.sh <<'RESET'
          #!/usr/bin/env bash
          set -uo pipefail
          export PGPASSWORD=udb
          if [ -f /tmp/udb-bench.pid ]; then kill "$(cat /tmp/udb-bench.pid)" 2>/dev/null || true; fi
          for i in $(seq 1 10); do (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null || break; sleep 1; done
          psql -h localhost -p 5432 -U udb -d postgres -c "DROP DATABASE IF EXISTS udb_ci WITH (FORCE);"
          psql -h localhost -p 5432 -U udb -d postgres -c "CREATE DATABASE udb_ci;"
          "${UDB_BENCH_BIN}" auth bootstrap user --username "${UDB_LIVE_USERNAME}" --password "${UDB_LIVE_PASSWORD}" --tenant "${UDB_LIVE_TENANT}" --project "${UDB_LIVE_PROJECT}"
          "${UDB_BENCH_BIN}" serve proto "" 127.0.0.1:50051 > /tmp/udb-bench.log 2>&1 &
          echo $! > /tmp/udb-bench.pid
          ok=0
          for attempt in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/50061) 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$(cat /tmp/udb-bench.pid)" 2>/dev/null; then cat /tmp/udb-bench.log; exit 1; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "broker not ready"; cat /tmp/udb-bench.log; exit 1; }
          tid="$(psql -h localhost -p 5432 -U udb -d udb_ci -tAq -c "SELECT tenant_id::text FROM udb_tenant.tenants WHERE code='sdk-live' OR name='sdk-live' LIMIT 1;")"
          [ -n "$tid" ] || { echo "no tenant_id for sdk-live"; exit 1; }
          psql -h localhost -p 5432 -U udb -d udb_ci -v ON_ERROR_STOP=1 -c "INSERT INTO udb_system.udb_sagas (saga_id,tx_id,tenant_id,correlation_id,status,backend_instance,operation,current_step,retry_count,recovery_attempts,compensation_status,steps,compensations,last_error,created_at,updated_at) VALUES ('11111111-1111-4111-8111-111111111101','t1','$tid','c1','manual_review','postgres:primary','mutate',0,0,0,'manual_review','[]'::jsonb,'[]'::jsonb,'seed',NOW(),NOW()),('11111111-1111-4111-8111-111111111102','t2','$tid','c2','manual_review','postgres:primary','mutate',0,0,0,'manual_review','[]'::jsonb,'[]'::jsonb,'seed',NOW(),NOW()),('11111111-1111-4111-8111-111111111103','t3','$tid','c3','manual_review','postgres:primary','mutate',0,0,0,'manual_review','[]'::jsonb,'[]'::jsonb,'seed',NOW(),NOW()) ON CONFLICT (saga_id) DO NOTHING;"
          psql -h localhost -p 5432 -U udb -d udb_ci -v ON_ERROR_STOP=1 -c "INSERT INTO udb_system.udb_cdc_dlq_events (dlq_id,event_id,topic,tenant_id,project_id,payload,error_type,error_message,retry_count,status,created_at,updated_at) VALUES ('22222222-2222-4222-8222-222222222201',gen_random_uuid(),'udb.sdk.live.records.cdc','$tid','default','{}'::jsonb,'seed','err',0,'OPEN',NOW(),NOW()),('22222222-2222-4222-8222-222222222202',gen_random_uuid(),'udb.sdk.live.records.cdc','$tid','default','{}'::jsonb,'seed','err',0,'OPEN',NOW(),NOW()),('22222222-2222-4222-8222-222222222203',gen_random_uuid(),'udb.sdk.live.records.cdc','$tid','default','{}'::jsonb,'seed','err',0,'OPEN',NOW(),NOW()),('22222222-2222-4222-8222-222222222204',gen_random_uuid(),'udb.sdk.live.records.cdc','$tid','default','{}'::jsonb,'seed','err',0,'OPEN',NOW(),NOW()) ON CONFLICT (dlq_id) DO NOTHING;"
          RESET
          chmod +x bench-output/reset.sh

      - name: Clear stale benchmark reports
        run: |
          rm -f sdk/go/udbclient/perf_report_go.md \
            sdk/python/perf_report_python.md \
            sdk/typescript/perf_report_ts.md \
            sdk/php/perf_report_php.md

      - name: Benchmark Go SDK
        shell: bash
        run: |
          set +e
          bash bench-output/reset.sh   # fresh DB + broker for this SDK (mirrors grind-once)
          mkdir -p bench-output/logs
          ( cd sdk/go && go test ./udbclient -run '^TestLivePerf$' -count=1 -timeout 15m ) 2>&1 | tee bench-output/logs/go.log
          code=${PIPESTATUS[0]}
          if [ ! -f sdk/go/udbclient/perf_report_go.md ]; then
            {
              echo "# UDB SDK Live Perf — Go"
              echo
              echo "RPCs measured: 0"
              echo
              echo "## Harness error"
              echo
              echo "Benchmark command exited with code ${code} before writing perf_report_go.md."
              echo
              echo '```text'
              tail -200 bench-output/logs/go.log
              echo '```'
            } > sdk/go/udbclient/perf_report_go.md
          fi
          printf '{"exit_code":%d}\n' "$code" > bench-output/status/go.json
          exit 0

      - name: Benchmark Python SDK
        shell: bash
        run: |
          set +e
          bash bench-output/reset.sh   # fresh DB + broker for this SDK (mirrors grind-once)
          mkdir -p bench-output/logs
          ( cd sdk/python && python -m pytest -q tests/test_live_conformance.py -k test_live_perf ) 2>&1 | tee bench-output/logs/python.log
          code=${PIPESTATUS[0]}
          if [ ! -f sdk/python/perf_report_python.md ]; then
            {
              echo "# UDB SDK Live Perf — Python"
              echo
              echo "RPCs measured: 0"
              echo
              echo "## Harness error"
              echo
              echo "Benchmark command exited with code ${code} before writing perf_report_python.md."
              echo
              echo '```text'
              tail -200 bench-output/logs/python.log
              echo '```'
            } > sdk/python/perf_report_python.md
          fi
          printf '{"exit_code":%d}\n' "$code" > bench-output/status/python.json
          exit 0

      - name: Benchmark TypeScript SDK
        shell: bash
        run: |
          set +e
          bash bench-output/reset.sh   # fresh DB + broker for this SDK (mirrors grind-once)
          mkdir -p bench-output/logs
          ( cd sdk/typescript && npm run bundle-proto && npx tsc -p tsconfig.test.json && node --test --test-name-pattern 'live per-RPC perf' dist-test/live-auth.test.js ) 2>&1 | tee bench-output/logs/typescript.log
          code=${PIPESTATUS[0]}
          if [ ! -f sdk/typescript/perf_report_ts.md ]; then
            {
              echo "# UDB SDK Live Perf — TypeScript"
              echo
              echo "RPCs measured: 0"
              echo
              echo "## Harness error"
              echo
              echo "Benchmark command exited with code ${code} before writing perf_report_ts.md."
              echo
              echo '```text'
              tail -200 bench-output/logs/typescript.log
              echo '```'
            } > sdk/typescript/perf_report_ts.md
          fi
          printf '{"exit_code":%d}\n' "$code" > bench-output/status/typescript.json
          exit 0

      - name: Benchmark PHP SDK
        shell: bash
        run: |
          set +e
          bash bench-output/reset.sh   # fresh DB + broker for this SDK (mirrors grind-once)
          mkdir -p bench-output/logs
          ( cd sdk/php && vendor/bin/pest tests/Live/GeneratedRpcSurfaceTest.php --filter 'measures per-RPC latency' ) 2>&1 | tee bench-output/logs/php.log
          code=${PIPESTATUS[0]}
          if [ ! -f sdk/php/perf_report_php.md ]; then
            {
              echo "# UDB SDK Live Perf — PHP"
              echo
              echo "RPCs measured: 0"
              echo
              echo "## Harness error"
              echo
              echo "Benchmark command exited with code ${code} before writing perf_report_php.md."
              echo
              echo '```text'
              tail -200 bench-output/logs/php.log
              echo '```'
            } > sdk/php/perf_report_php.md
          fi
          printf '{"exit_code":%d}\n' "$code" > bench-output/status/php.json
          exit 0

      - name: Fetch previous benchmark history
        if: always()
        shell: bash
        run: |
          curl -fsSL "https://${GITHUB_REPOSITORY_OWNER}.github.io/udb/bench-results.json" \
            -o bench-output/previous-bench-results.json || true

      - name: Collect benchmark JSON
        if: always()
        run: |
          python scripts/collect_sdk_bench_results.py \
            --out docs/site/bench-results.json \
            --status-dir bench-output/status \
            --previous bench-output/previous-bench-results.json \
            --release-tag "${UDB_BENCH_RELEASE_TAG}" \
            --release-asset "${UDB_BENCH_RELEASE_ASSET}" \
            --release-url "${UDB_BENCH_RELEASE_URL}"

      - name: Sync brand assets into the site
        if: always()
        run: |
          mkdir -p docs/site/assets
          cp -v docs/assets/*.svg docs/site/assets/

      - name: Upload benchmark report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-benchmark-results
          path: |
            docs/site/bench-results.json
            sdk/go/udbclient/perf_report_go.md
            sdk/python/perf_report_python.md
            sdk/typescript/perf_report_ts.md
            sdk/php/perf_report_php.md
            /tmp/udb-bench.log
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: docs/site

      - name: Stop UDB
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/udb-bench.pid ]; then
            kill "$(cat /tmp/udb-bench.pid)" 2>/dev/null || true
          fi
          docker rm -f udb-bench-minio 2>/dev/null || true
          docker rm -f udb-bench-kafka 2>/dev/null || true
          docker rm -f udb-bench-qdrant 2>/dev/null || true
          docker rm -f udb-bench-redis 2>/dev/null || true
          docker rm -f udb-bench-clickhouse 2>/dev/null || true
          docker rm -f udb-bench-neo4j 2>/dev/null || true

  deploy:
    name: Deploy benchmark dashboard
    if: always() && needs.benchmark.result != 'cancelled' && needs.benchmark.result != 'skipped'
    needs: benchmark
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
