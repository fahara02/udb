name: Benchmark · SDKs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-sdks.yml"
      - "proto/**"
      - "api/**"
      - "src/cli/sdk_gen.rs"
      - "src/runtime/descriptor_manifest.rs"
      - "src/runtime/sdk_manifest.rs"
      - "sdk-templates/**"
      - "scripts/collect_sdk_bench_results.py"
      - "scripts/gen-bench-bodies-json.mjs"
      - "scripts/openapi-postprocess.mjs"
      - "docs/site/benchmarks.html"
      - "docs/site/benchmarks.js"
      - "docs/site/README.md"
      - "docs/site/styles.css"
      - "docs/bench-bodies/**"
      - "sdk/go/udbclient/live_perf_bodies.go"
      - "sdk/go/udbclient/live_perf_bodies_test.go"
      - "sdk/go/udbclient/live_perf_seed_test.go"
      - "sdk/go/udbclient/live_perf_test.go"
      - "sdk/go/udbclient/bench_manifest_test.go"
      - "sdk/go/udbclient/upload_test.go"
      - "sdk/go/udbclient/entity_test.go"
      - "sdk/go/udbclient/media_test.go"
      - "sdk/python/tests/test_live_conformance.py"
      - "sdk/python/tests/test_simple_client.py"
      - "sdk/python/tests/test_media_facade.py"
      - "sdk/typescript/live-auth.test.ts"
      - "sdk/typescript/facade.test.ts"
      - "sdk/php/tests/Live/GeneratedRpcSurfaceTest.php"
      - "sdk/php/tests/Unit/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to benchmark, or latest"
        default: "latest"
        required: true
      release_asset:
        description: "Linux release asset to run"
        default: "udb-linux-amd64-full"
        required: true
  workflow_run:
    workflows: ["Release"]
    types: [completed]

# Benchmark no longer deploys to Pages — pages.yml is the sole Pages owner
# (Chapter 15.8.2). This workflow only needs read access; it ENDS at producing
# the `sdk-benchmark-results` artifact, which pages.yml consumes. Dropping the
# `pages` permission + `concurrency: pages` here ends the deploy contention.
permissions:
  contents: read

# The canonical dev-posture UDB_* broker env that previously lived inline here
# (104 keys) is now the single-source `.github/actions/broker-env` composite,
# applied inside the reusable `_live-sdk-suite.yml` (perf mode). Do not re-add a
# copy here (Chapter 15.1 — broker-env is the ONLY source).

jobs:
  validate:
    name: Validate benchmark workflow changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dashboard and collector syntax
        run: |
          set -euo pipefail
          node --check docs/site/benchmarks.js
          python -m py_compile scripts/collect_sdk_bench_results.py
      - name: Validate benchmark JSON collection
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bench-status"
          for sdk in go python typescript php; do
            printf '{"exit_code":0}\n' > "$RUNNER_TEMP/bench-status/${sdk}.json"
          done
          python scripts/collect_sdk_bench_results.py \
            --out "$RUNNER_TEMP/bench-results.json" \
            --status-dir "$RUNNER_TEMP/bench-status"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "bench-results.json").read_text())
          sdks = payload.get("sdks", [])
          assert payload.get("summary", {}).get("measured_rpc_count", 0) > 0
          assert any(s.get("full_rpcs") for s in sdks), "collector did not preserve full per-RPC rows"
          assert all("summary" in s for s in sdks), "SDK summary missing from benchmark JSON"
          PY
      - name: Confirm release benchmark is gated
        shell: bash
        run: |
          set -euo pipefail
          grep -q "github.event_name == 'workflow_dispatch'" .github/workflows/benchmark-sdks.yml
          grep -Fq 'workflows: ["Release"]' .github/workflows/benchmark-sdks.yml
          grep -q "github.event.workflow_run.conclusion == 'success'" .github/workflows/benchmark-sdks.yml
          grep -q "startsWith(github.event.workflow_run.head_branch, 'v')" .github/workflows/benchmark-sdks.yml

  # The live perf bench is now the reusable `_live-sdk-suite.yml`.
  # It stands up the backend stack + release broker, runs all four SDK perf
  # benches with a fresh-DB reset between each, and uploads the
  # `sdk-benchmark-results` artifact (incl. docs/site/bench-results.json). It does
  # NOT deploy Pages — pages.yml consumes that artifact and is the sole deployer.
  benchmark:
    name: Release binary + SDK live benchmarks
    # Manual dispatch, OR a successful top-level "Release" run on a v* tag.
    # This keeps perf after the whole release fan-out, not after only the binary
    # producer, so Pages publishes last with final benchmark data.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    uses: ./.github/workflows/_live-sdk-suite.yml
    with:
      # On workflow_run (post-release), benchmark the tag that just released
      # (head_branch = the v* tag). On dispatch, use the provided tag (or latest).
      release-tag: ${{ github.event.workflow_run.head_branch || inputs.release_tag || 'latest' }}
      release-asset: ${{ inputs.release_asset || 'udb-linux-amd64-full' }}
    secrets: inherit
