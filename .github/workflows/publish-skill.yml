name: Publish UDB skill

# Publishes the agent-agnostic "Using UDB" skill on every change.
#  - Claude  : published from `udb-skill/.claude-plugin/marketplace.json`
#              so the plugin metadata lives with the skill source instead of
#              at repo root. The `validate` job gates structure; an
#              advisory `smoke` job (gated on ANTHROPIC_API_KEY) headlessly loads the
#              plugin and checks the skill answers a UDB question.
#  - Ollama  : direct authenticated API create + push (uses OLLAMA_API_KEY),
#              followed by public registry-manifest verification.
#  - OpenAI  : create/update an Assistant from openai/instructions.md (uses OPENAI_API_KEY).
# Publish steps self-skip when their secret is absent, so the run never fails for a
# missing optional secret.

on:
  push:
    branches: [main]
    paths:
      - "udb-skill/**"
      - ".github/workflows/publish-skill.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: true
      - name: Validate manifests + structure (hard gate)
        run: |
          set -euo pipefail
          for f in \
            udb-skill/plugins/udb/skills/using-udb/SKILL.md \
            udb-skill/plugins/udb/skills/using-udb/references/using-udb.md \
            udb-skill/plugins/udb/skills/using-udb/references/rpc-inventory.md \
            udb-skill/plugins/udb/skills/using-udb/references/sensitive-fields.md \
            udb-skill/shared/using-udb.md \
            udb-skill/openai/instructions.md \
            udb-skill/ollama/Modelfile \
            udb-skill/plugins/udb/skills/udb-coding/SKILL.md \
            udb-skill/plugins/udb/skills/udb-coding/references/udb-coding.md \
            udb-skill/plugins/udb/skills/udb-coding/references/rust-stack.md \
            udb-skill/plugins/udb/skills/udb-coding/references/backends.md \
            udb-skill/plugins/udb/skills/udb-coding/references/subsystem-checklist.md \
            udb-skill/plugins/udb/skills/udb-coding/references/codebase-map.md \
            udb-skill/plugins/udb/skills/udb-coding/references/subsystem_map.md \
            udb-skill/shared/udb-coding.md \
            udb-skill/shared/udb-coding-rust-stack.md \
            udb-skill/shared/udb-coding-backends.md \
            udb-skill/shared/udb-coding-subsystem-map.md \
            udb-skill/shared/udb-coding-subsystem-checklist.md \
            udb-skill/openai/instructions-udb-coding.md \
            udb-skill/ollama/Modelfile.udb-coding \
            udb-skill/sync_skills.py \
            udb-skill/sync_udb_coding.py \
            udb-skill/sync_references.py \
            udb-skill/LICENSE; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          for f in \
            udb-skill/.claude-plugin/marketplace.json \
            udb-skill/plugins/udb/.claude-plugin/plugin.json; do
            python3 -c "import json; json.load(open('$f'))" && echo "json ok: $f"
          done
          # Every SKILL.md must carry a description in its frontmatter.
          for s in using-udb udb-coding; do
            grep -q '^description:' "udb-skill/plugins/udb/skills/$s/SKILL.md" \
              || { echo "::error::$s SKILL.md missing description"; exit 1; }
          done
          # Skill-local marketplace plugin source must resolve to a real plugin dir.
          python3 -c "import json,os; root='udb-skill'; m=json.load(open(os.path.join(root,'.claude-plugin','marketplace.json'))); s=m['plugins'][0]['source']; assert os.path.isfile(os.path.join(root,s,'.claude-plugin','plugin.json')), s; print('marketplace source ok:', os.path.join(root,s))"
          python3 udb-skill/sync_skills.py --check
          python3 udb-skill/sync_udb_coding.py --check
          python3 udb-skill/sync_references.py --check
          echo "skill validation passed"
      - name: Wrapper drift check (advisory, CR-tolerant)
        run: |
          # skill entry references vs their shared canonical
          for s in using-udb udb-coding; do
            a="udb-skill/shared/$s.md"
            b="udb-skill/plugins/udb/skills/$s/references/$s.md"
            if ! diff -q <(tr -d '\r' < "$a") <(tr -d '\r' < "$b") >/dev/null; then
              echo "::warning::Claude reference differs from shared/$s.md — re-sync the wrappers (see README)."
            else
              echo "wrappers in sync: $s"
            fi
          done
          # udb-coding companion references (shared name -> reference name)
          for pair in "udb-coding-rust-stack:rust-stack" "udb-coding-backends:backends" "udb-coding-subsystem-map:subsystem_map" "udb-coding-subsystem-checklist:subsystem-checklist"; do
            a="udb-skill/shared/${pair%%:*}.md"
            b="udb-skill/plugins/udb/skills/udb-coding/references/${pair##*:}.md"
            if ! diff -q <(tr -d '\r' < "$a") <(tr -d '\r' < "$b") >/dev/null; then
              echo "::warning::Claude reference ${pair##*:} differs from ${pair%%:*} — re-sync."
            else
              echo "companion in sync: ${pair##*:}"
            fi
          done
      - name: Validate with Claude CLI (best-effort)
        run: |
          if npm i -g @anthropic-ai/claude-code >/dev/null 2>&1 && command -v claude >/dev/null; then
            claude plugin validate ./udb-skill || echo "::warning::claude plugin validate reported issues"
          else
            echo "claude CLI unavailable on runner; skipped (structure already validated above)"
          fi

  smoke:
    name: Skill smoke test (Claude, advisory)
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true   # non-deterministic LLM output must never block publish
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: true
      - name: Headless skill activation test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping smoke test (publish is unaffected)."
            exit 0
          fi
          npm i -g @anthropic-ai/claude-code >/dev/null 2>&1 || { echo "::warning::could not install claude CLI"; exit 0; }
          prompt="Use the using-udb skill. State the exact package name to install the UDB TypeScript SDK, and name three request-metadata fields a UDB client must set."
          claude --plugin-dir ./udb-skill/plugins/udb -p "$prompt" >/tmp/out.txt 2>/tmp/err.txt || true
          echo "----- model output -----"; cat /tmp/out.txt; echo "------------------------"
          if grep -qi "@udb_plus/sdk" /tmp/out.txt && grep -Eqi "tenant|scopes|project" /tmp/out.txt; then
            echo "smoke: UDB skill content present in response ✅"
          else
            echo "::warning::smoke: expected skill facts (@udb_plus/sdk + tenant/scopes/project) not found in output — LLM output varies; verify the skill manually."
          fi

  ollama:
    name: Publish Ollama model
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Ollama registry
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_NAMESPACE: ${{ vars.OLLAMA_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "OLLAMA_API_KEY not set — skipping Ollama publish."
            exit 0
          fi
          if [ -z "${OLLAMA_NAMESPACE:-}" ]; then
            echo "::error::OLLAMA_NAMESPACE is not configured for the production environment"
            exit 1
          fi
          ns="$OLLAMA_NAMESPACE"

          verify_public() {
            local model="$1"
            local url="https://registry.ollama.ai/v2/${model}/manifests/latest"
            for attempt in $(seq 0 9); do
              if curl -fsS \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                "$url" >/dev/null; then
                echo "verified public manifest: https://ollama.com/${model}"
                return 0
              fi
              sleep_for=$((2 ** attempt))
              if [ "$sleep_for" -gt 30 ]; then sleep_for=30; fi
              sleep "$sleep_for"
            done
            echo "::error::public registry manifest did not appear for ${model}"
            return 1
          }

          if [[ "$OLLAMA_API_KEY" == "-----BEGIN OPENSSH PRIVATE KEY-----"* ]]; then
            # Ollama's CLI signs registry requests with ~/.ollama/id_ed25519.
            # The production secret may contain that private key even though its
            # legacy name is OLLAMA_API_KEY.
            curl -fsSL https://ollama.com/install.sh | sh
            mkdir -p "$HOME/.ollama"
            printf '%s\n' "$OLLAMA_API_KEY" | tr -d '\r' > "$HOME/.ollama/id_ed25519"
            chmod 600 "$HOME/.ollama/id_ed25519"
            ssh-keygen -y -f "$HOME/.ollama/id_ed25519" > "$HOME/.ollama/id_ed25519.pub"

            ollama serve >/tmp/ollama.log 2>&1 &
            ready=false
            for _ in $(seq 1 30); do
              if ollama list >/dev/null 2>&1; then ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              echo "::error::Ollama server did not become ready"
              exit 1
            fi

            cd udb-skill/ollama
            ollama create "$ns/udb-assistant" -f ./Modelfile
            ollama create "$ns/udb-coding" -f ./Modelfile.udb-coding
            for model in "$ns/udb-assistant" "$ns/udb-coding"; do
              push_log="$(mktemp)"
              if ! ollama push "$model" >"$push_log" 2>&1; then
                echo "::error::Ollama CLI push failed for ${model}"
                exit 1
              fi
              if grep -Eqi 'need to be signed in|unauthorized|access denied|error:' "$push_log" \
                || ! grep -Fq 'You can find your model at:' "$push_log"; then
                echo "::error::Ollama CLI did not confirm publication for ${model}"
                exit 1
              fi
              verify_public "$model"
            done
          elif [[ "$OLLAMA_API_KEY" == ssh-ed25519\ * ]]; then
            echo "::error::OLLAMA_API_KEY contains only a public key; CI needs the matching OpenSSH private key or an Ollama API token"
            exit 1
          else
            # API tokens authenticate direct, non-interactive calls to
            # https://ollama.com/api with a Bearer header.
            python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          api_key = os.environ["OLLAMA_API_KEY"]
          namespace = os.environ["OLLAMA_NAMESPACE"]

          def parse_modelfile(path: str) -> tuple[str, dict[str, object], str]:
              text = Path(path).read_text(encoding="utf-8")
              base_match = re.search(r"(?m)^FROM\s+(.+?)\s*$", text)
              system_match = re.search(r'(?ms)^SYSTEM\s+"""\s*\n(.*?)\n"""\s*$', text)
              if not base_match or not system_match:
                  raise RuntimeError(f"cannot parse FROM/SYSTEM from {path}")

              parameters: dict[str, object] = {}
              for name, raw in re.findall(r"(?m)^PARAMETER\s+(\S+)\s+(.+?)\s*$", text):
                  try:
                      parameters[name] = json.loads(raw)
                  except json.JSONDecodeError:
                      parameters[name] = raw
              return base_match.group(1), parameters, system_match.group(1)

          def post(endpoint: str, payload: dict[str, object]) -> None:
              payload = {**payload, "stream": False}
              request = urllib.request.Request(
                  f"https://ollama.com/api/{endpoint}",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=900) as response:
                      body = response.read().decode()
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  raise RuntimeError(f"Ollama {endpoint} failed ({exc.code}): {detail}") from exc

              result = json.loads(body)
              if result.get("error") or result.get("status") != "success":
                  raise RuntimeError(f"Ollama {endpoint} did not succeed: {result}")

          def create_and_publish(slug: str, modelfile: str) -> None:
              model = f"{namespace}/{slug}"
              base, parameters, system = parse_modelfile(modelfile)
              post("create", {
                  "model": model,
                  "from": base,
                  "parameters": parameters,
                  "system": system,
              })
              post("push", {"model": model})

          create_and_publish("udb-assistant", "udb-skill/ollama/Modelfile")
          create_and_publish("udb-coding", "udb-skill/ollama/Modelfile.udb-coding")
          PY
            verify_public "$ns/udb-assistant"
            verify_public "$ns/udb-coding"
          fi

  openai:
    name: Sync OpenAI Assistant
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Create/update Assistant from instructions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY not set — skipping OpenAI Assistant sync (instructions.md is published via the repo)."
            exit 0
          fi
          model="${OPENAI_MODEL:-gpt-4o-mini}"
          base="https://api.openai.com/v1"
          auth=(-H "Authorization: Bearer ${OPENAI_API_KEY}" -H "OpenAI-Beta: assistants=v2" -H "Content-Type: application/json")
          # Idempotent upsert by assistant name, one per skill.
          upsert() {
            local name="$1" file="$2"
            local instr id payload new_id
            instr="$(cat "$file")"
            id="$(curl -fsS "${auth[@]}" "$base/assistants?limit=100" \
                  | jq -r --arg n "$name" '.data[] | select(.name==$n) | .id' | head -1)"
            payload="$(jq -n --arg n "$name" --arg m "$model" --arg i "$instr" \
                       '{name:$n, model:$m, instructions:$i}')"
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              curl -fsS "${auth[@]}" -X POST "$base/assistants/$id" -d "$payload" >/dev/null
              echo "updated assistant '$name' ($id)"
            else
              new_id="$(curl -fsS "${auth[@]}" -X POST "$base/assistants" -d "$payload" | jq -r '.id')"
              echo "created assistant '$name' ($new_id)"
            fi
          }
          upsert "UDB Assistant"    udb-skill/openai/instructions.md
          upsert "UDB Coding Agent" udb-skill/openai/instructions-udb-coding.md
