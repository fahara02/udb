name: Release · Java SDK (Maven Central)

# Reusable publisher invoked by `release.yml` after the release binaries are
# built. Publishes io.github.fahara02:udb-java-client to Maven Central through
# the Central Portal, at the main UDB release version tracked in versions.json
# (the committed pom carries a -SNAPSHOT of it between releases).
#
# Central needs four secrets in the `production` environment, all owned by the
# `fahara02` account:
#   MAVEN_USER_NAME        / MAVEN_USER_PASSWORD  — a Central Portal user token
#     (MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_TOKEN are still read as a fallback)
#   MAVEN_GPG_PRIVATE_KEY  / MAVEN_GPG_PASSPHRASE — the signing key (armored)
# Until they exist the job says so in a warning and publishes nothing; the
# other registries are unaffected.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected UDB release version, for example 0.5.34"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish udb-java-client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://central.sonatype.com/artifact/io.github.fahara02/udb-java-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: 'true'

      - uses: ./.github/actions/version-guard
        with:
          component: sdk-java
          dispatch-version: ${{ github.event.inputs.version }}

      - name: Check Maven Central credentials
        id: credentials
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_USER_NAME || secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_USER_PASSWORD || secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=()
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_TOKEN MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::warning::udb-java-client was not published: repository secrets missing: ${missing[*]}"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Java with Central credentials and the signing key
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Pin Maven to the 3.9.x line, off the runner-image default. The
      # central-publishing plugin 0.8.0 stages artifacts with
      # ArtifactInstaller.install(); under Maven 3.10.0 the resolver writes
      # bookkeeping (maven-metadata-local.xml at the artifact dir, plus
      # _remote.repositories and .locks/) into that staging dir, which the
      # plugin does not strip before zipping, so Central rejects the bundle
      # with "Bundle has content that does NOT have a .pom file:
      # io/github/fahara02/udb-java-client". 3.9.9 stages a clean bundle
      # (reproduced locally: 3.9.9 -> 9 files under 0.6.1/ with the pom;
      # 3.10.0 -> the same plus the version-less metadata/locks). See
      # apache/maven#13388 and central-publishing-maven-plugin#78.
      - name: Install pinned Maven
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "runner default Maven (before pin):"
          mvn -v 2>&1 | head -1 || echo "  (no mvn on PATH)"
          version="3.9.9"
          archive="${RUNNER_TEMP}/apache-maven-${version}-bin.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://archive.apache.org/dist/maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' 'a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b' "$archive" | sha512sum --check --strict
          install_dir="${RUNNER_TEMP}/udb-maven"
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" --strip-components=1
          printf '%s\n' "${install_dir}/bin" >> "$GITHUB_PATH"

      - name: Report Maven version
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v mvn
          mvn -v | head -1
          mvn -v | head -1 | grep -Fq 'Apache Maven 3.9.9' \
            || { echo "::error::pinned Maven 3.9.9 is not first on PATH"; exit 1; }

      - name: Check udb-java-client availability on Maven Central
        id: central
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./versions.json').components['sdk-java'].version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if curl -fsS "https://repo1.maven.org/maven2/io/github/fahara02/udb-java-client/${version}/udb-java-client-${version}.pom" >/dev/null 2>&1; then
            echo "udb-java-client ${version} already published; publish step will be skipped."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to Maven Central
        if: steps.credentials.outputs.ready == 'true' && steps.central.outputs.exists == 'false'
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_USER_NAME || secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_USER_PASSWORD || secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          VERSION: ${{ steps.central.outputs.version }}
        run: |
          set -euo pipefail
          mvn -B -f sdk/java/pom.xml versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false
          mvn -B -f sdk/java/pom.xml -P release deploy
