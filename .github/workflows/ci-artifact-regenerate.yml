name: CI artifact regeneration (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/0.5.7-audit

permissions:
  actions: read
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download CI-built broker
        uses: actions/download-artifact@v4
        with:
          name: udb-broker-debug
          path: target/debug
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31839938418
      - name: Regenerate authoritative artifacts
        shell: bash
        run: |
          chmod +x target/debug/udb
          buf generate
          target/debug/udb native manifest > docs/generated/udb-native-contract.json
          target/debug/udb native docs > docs/generated/native-services.md
          target/debug/udb sdk generate --lang all
          node scripts/openapi-postprocess.mjs
          node scripts/gen-bench-bodies-skeleton.mjs --write
          node scripts/gen-sdk-benchmark-docs.mjs --write
          node scripts/check-http-api-style.mjs --write-report
      - name: Package generated diff
        shell: bash
        run: |
          git ls-files --others --exclude-standard -z | xargs -0 -r git add -N --
          git status --short > authoritative-generated-status.txt
          git diff --binary --full-index > authoritative-generated.patch
          test -s authoritative-generated.patch
      - name: Upload generated patch
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-generated-patch
          path: |
            authoritative-generated.patch
            authoritative-generated-status.txt
          if-no-files-found: error
          retention-days: 1
