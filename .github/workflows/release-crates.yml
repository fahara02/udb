name: Release · crates.io

# Reusable publisher invoked by `release.yml` (the tag-driven orchestrator) after
# the release binaries are built. CI gates the exact main commit before release;
# this workflow only performs packaging/publish work so the release graph does
# not re-run CI's Rust build, test, and native-contract gates.
#
# Required `production` environment secret:
#   CARGO_REGISTRY_TOKEN   (https://crates.io/settings/tokens)
#
# Rollback: crates.io versions are IMMUTABLE. The only undo is
# `cargo yank --version <ver>` (hides from new resolves, does NOT
# delete). Choose the version carefully.

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: crates.io API token used by `cargo publish`.
        required: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://crates.io/crates/udb
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain + cache + native build deps (single-source composite).
      - uses: ./.github/actions/setup-rust

      # version-guard needs Node first (it runs check-versions.mjs but does not
      # install Node itself).
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: 'true'
      - uses: ./.github/actions/version-guard
        with:
          component: udb

      - name: Check crates.io version availability
        id: crate_version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          if curl -fsS "https://crates.io/api/v1/crates/udb/${version}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "udb ${version} already exists on crates.io; publish steps will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo publish --dry-run
        if: steps.crate_version.outputs.exists != 'true'
        run: cargo publish --dry-run

      - name: cargo publish
        if: steps.crate_version.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set +e
          cargo publish 2>&1 | tee /tmp/cargo-publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Eq 'crate udb@.+ already exists on crates\.io index|crate version .+ is already uploaded' /tmp/cargo-publish.log; then
            echo "udb ${GITHUB_REF#refs/tags/v} was published by another release run; treating as success."
            exit 0
          fi
          exit "$status"
