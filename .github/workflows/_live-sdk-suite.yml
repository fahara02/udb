          import argparse
          import hashlib
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          fixtures = {
              "python": ("sdk/python/perf_report_python.md", "test_live_generated_rpc_surface"),
              "typescript": ("sdk/typescript/perf_report_ts.md", "live broker login refreshes once and hot-swaps SDK credentials"),
              "php": ("sdk/php/perf_report_php.md", "covers the live generated RPC surface"),
          }
          parser = argparse.ArgumentParser()
          parser.add_argument("mode", choices=("snapshot", "canonical", "executed"))
          parser.add_argument("sdk", choices=tuple(fixtures))
          args = parser.parse_args()
          report, expected = fixtures[args.sdk]
          canonical_paths = (report, f"bench-output/status/{args.sdk}.json")
          snapshot_path = Path(f"bench-output/deep/{args.sdk}-canonical.json")
          if args.mode == "snapshot":
              snapshot = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in canonical_paths}
              snapshot_path.write_text(json.dumps(snapshot, indent=2) + "\n")
          elif args.mode == "canonical":
              snapshot = json.loads(snapshot_path.read_text())
              for path in canonical_paths:
                  actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  if snapshot.get(path) != actual:
                      raise SystemExit(f"Deep correctness changed canonical benchmark evidence: {path}")
              print(f"{args.sdk}: canonical bare report and status digests unchanged")
          else:
              junit = Path(f"bench-output/deep/{args.sdk}-junit.xml")
              cases = list(ET.parse(junit).getroot().iter("testcase"))
              selected = [case for case in cases if case.get("name") == expected or (args.sdk == "php" and expected in case.get("name", ""))]
              if len(selected) != 1 or any(selected[0].find(tag) is not None for tag in ("skipped", "failure", "error")):
                  raise SystemExit(f"{args.sdk}: exactly one named served deep test must execute and pass")
              print(f"{args.sdk}: one named served deep test executed and passed")
          PY

