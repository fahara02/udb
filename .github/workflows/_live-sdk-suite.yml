name: _live-sdk-suite

# Reusable live-SDK suite (Chapter 15, todo 15.7.1).
#
# ONE `workflow_call` workflow that stands up the live backend stack + broker and
# runs the post-release SDK benchmark.
#
# It declares the `postgres`/`mongodb` `services:` (the part composite actions
# cannot do) and otherwise builds entirely on the existing composite actions:
#   - .github/actions/setup-sdk-toolchains  (SDK language toolchains)
#   - .github/actions/start-backends        (docker run minio/kafka/qdrant/...)
#   - .github/actions/broker-env            (canonical UDB_* env to $GITHUB_ENV)
#
# This reproduces benchmark-sdks.yml::benchmark: download the release binary,
# then run all four SDK perf benches with a fresh DB+broker re-seed between each
# (the reset pattern), then collect results.
#
# This is now the shared implementation for benchmark-sdks.yml::benchmark;
# _shadow-live-sdk.yml remains dispatch-only for manual runner probes.

on:
  workflow_call:
    inputs:
      release-tag:
        description: "Release tag to benchmark, or 'latest' (perf / release-asset)."
        required: false
        type: string
        default: latest
      checkout-ref:
        description: >-
          Git ref to check out for the harness tree. Post-release benchmarks MUST
          pass the released tag so the bench manifest/SDK stubs match the binary
          under test — checking out main here once ran a newer RPC surface
          against an older release binary and failed 27 RPCs. Empty = default
          (the triggering ref), correct for CI shadow runs.
        required: false
        type: string
        default: ""
      release-asset:
        description: "Linux release asset name to download (perf / release-asset)."
        required: false
        type: string
        default: udb-linux-amd64-full
      backend-bootstrap-ref:
        description: "Reviewed backend provisioning ref; does not replace the released SDK/protobuf harness"
        required: false
        type: string
        default: ""
      candidate-build:
        description: "Build this exact workflow commit in CI for pre-release correctness checks"
        required: false
        type: boolean
        default: false
    secrets:
      # The live/bench harness uses only test-fixture secrets baked into
      # broker-env; no real secrets are required. Declared (optional) so a caller
      # may still pass `secrets: inherit` without error.
      gh_token:
        required: false

permissions:
  contents: read

jobs:
  live-suite:
    name: Live SDK benchmark
    runs-on: ubuntu-latest
    # Three separately bounded 15-minute candidate proofs extend the prior
    # 75-minute build/measurement/correctness envelope; no phase is unbounded.
    timeout-minutes: 120
    env:
      # Pass inputs through env (script-injection-safe — never interpolate
      # inputs.* directly into a run: shell body).
      RELEASE_TAG: ${{ inputs.release-tag }}
      RELEASE_ASSET: ${{ inputs.release-asset }}
      # Live tests are always opted-in here; perf adds the perf opt-in below.
      UDB_LIVE_SDK_TESTS: "1"
      # A separate offline-provisioned platform principal is used only for RPCs
      # whose contract is genuinely system-global/cross-tenant. Tenant Authz
      # CRUD continues to run as the ordinary benchmark principal.
      UDB_LIVE_PLATFORM_USERNAME: sdk-live-platform
      UDB_LIVE_PLATFORM_PASSWORD: "SdkLivePlatform#2026"
      UDB_LIVE_PEER_USERNAME: sdk-live-peer
      UDB_LIVE_PEER_PASSWORD: "SdkLivePeer#2026Pass"
      UDB_LIVE_PEER_TENANT: sdk-live-peer
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: udb_ci
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udb -d udb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: public.ecr.aws/docker/library/mongo:7@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Initialize benchmark output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-output/bin bench-output/status bench-output/logs docs/site
          rm -f docs/site/bench-results.json \
            sdk/go/udbclient/perf_report_go.md \
            sdk/python/perf_report_python.md \
            sdk/typescript/perf_report_ts.md \
            sdk/php/perf_report_php.md

      # ── SDK toolchains ────────────────────────────────────────────────
      # Perf needs Go/Python/TS/PHP SDK toolchains (PHP 8.3 mirrors the
      # live-test Dockerfile).
      - name: Set up SDK toolchains
        uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: "true"
          python: "true"
          go: "true"
          php: "true"
          php-version: "8.3"

      # ── Broker binary (mode-dependent) ────────────────────────────────
      - name: Resolve release binary (perf)
        if: '!inputs.candidate-build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [ -z "${tag}" ] || [ "${tag}" = "latest" ]; then
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Benchmark requires a released SemVer tag, got '${tag}'"
            exit 1
          fi
          if [[ ! "${RELEASE_ASSET}" =~ ^udb-linux-amd64(-[a-z0-9]+)?$ ]]; then
            echo "::error::Benchmark requires a Linux amd64 UDB release asset, got '${RELEASE_ASSET}'"
            exit 1
          fi
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${RELEASE_ASSET}" \
            --pattern "${RELEASE_ASSET}.sha256" \
            --pattern "manifest.json" \
            --pattern "manifest.json.sha256" \
            --dir bench-output/bin
          binary_sha256="$(python3 - "${tag}" "${RELEASE_ASSET}" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          tag, asset = sys.argv[1:]
          root = Path("bench-output/bin")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def sidecar(path: Path, expected_name: str) -> str:
              fields = path.read_text(encoding="utf-8").strip().split()
              if len(fields) != 2 or fields[1].lstrip("*") != expected_name:
                  raise SystemExit(f"invalid checksum sidecar {path}: expected exactly '<sha256>  {expected_name}'")
              value = fields[0].lower()
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  raise SystemExit(f"invalid SHA-256 in {path}: {value!r}")
              return value

          binary = root / asset
          binary_digest = digest(binary)
          if sidecar(root / f"{asset}.sha256", asset) != binary_digest:
              raise SystemExit(f"published checksum does not match {asset}")

          manifest_path = root / "manifest.json"
          if sidecar(root / "manifest.json.sha256", "manifest.json") != digest(manifest_path):
              raise SystemExit("published checksum does not match manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("tag") != tag or manifest.get("version") != tag.removeprefix("v"):
              raise SystemExit(
                  f"release manifest identity mismatch: tag={manifest.get('tag')!r} "
                  f"version={manifest.get('version')!r} expected={tag!r}"
              )
          matches = [item for item in manifest.get("assets", []) if item.get("name") == asset]
          if len(matches) != 1:
              raise SystemExit(f"release manifest must contain exactly one {asset!r} entry")
          entry = matches[0]
          if entry.get("sha256") != binary_digest or entry.get("size") != binary.stat().st_size:
              raise SystemExit(f"release manifest provenance does not match downloaded {asset}")
          print(binary_digest)
          PY
          )"
          chmod +x "bench-output/bin/${RELEASE_ASSET}"
          binary_version="$("bench-output/bin/${RELEASE_ASSET}" --version)"
          if [ "${binary_version}" != "udb ${tag#v}" ]; then
            echo "::error::Release binary version '${binary_version}' does not match '${tag}'"
            exit 1
          fi
          {
            echo "UDB_BENCH_RELEASE_TAG=${tag}"
            echo "UDB_BENCH_RELEASE_ASSET=${RELEASE_ASSET}"
            echo "UDB_BENCH_RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            echo "UDB_BENCH_BINARY_SHA256=${binary_sha256}"
            echo "UDB_BENCH_BIN=${GITHUB_WORKSPACE}/bench-output/bin/${RELEASE_ASSET}"
          } >> "$GITHUB_ENV"

      - name: Set up candidate Rust build
        if: inputs.candidate-build
        uses: ./.github/actions/setup-rust
        with:
          cache-key: sdk-candidate-full-dist

      - name: Build and identify candidate broker
        if: inputs.candidate-build
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          if [ "$candidate_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Candidate SDK harness must match the workflow commit"
            exit 1
          fi
          # Match the shipped full Linux profile, features and CPU floor.
          export RUSTFLAGS="-C target-cpu=x86-64-v2 ${RUSTFLAGS:-}"
          cargo build --profile dist --locked --bin udb --features oidc,webauthn,webrtc
          cp target/dist/udb bench-output/bin/udb-candidate
          binary_sha256="$(sha256sum bench-output/bin/udb-candidate | cut -d' ' -f1)"
          binary_version="$(bench-output/bin/udb-candidate --version)"
          printf '{"commit":"%s","sha256":"%s","version":"%s","profile":"dist","target_cpu":"x86-64-v2","purpose":"pre-release correctness"}\n' \
            "$candidate_sha" "$binary_sha256" "$binary_version" > bench-output/candidate-provenance.json
          echo "UDB_BENCH_BIN=${GITHUB_WORKSPACE}/bench-output/bin/udb-candidate" >> "$GITHUB_ENV"
          echo "Candidate broker: $binary_version at $candidate_sha"

      - name: Resolve broker binary path
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          echo "path=${UDB_BENCH_BIN}" >> "$GITHUB_OUTPUT"

      - name: Check out backend provisioning recovery
        if: inputs.backend-bootstrap-ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend-bootstrap-ref }}
          path: benchmark-backend-bootstrap
          sparse-checkout: .github/actions/start-backends
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Apply backend provisioning recovery
        if: inputs.backend-bootstrap-ref != ''
        shell: bash
        run: |
          set -euo pipefail
          cp -R benchmark-backend-bootstrap/.github/actions/start-backends/. \
            .github/actions/start-backends/
          bootstrap_sha="$(git -C benchmark-backend-bootstrap rev-parse HEAD)"
          printf '{"commit":"%s"}\n' "$bootstrap_sha" > bench-output/backend-bootstrap.json
          echo "Backend provisioning commit: $bootstrap_sha"

      # ── Backend stack (docker-run backends; pg/mongo are services above) ──
      - name: Reload backend registry mirror without restarting services
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-output/backend-images
          mapfile -t active_services < <(docker ps --quiet)
          test "${#active_services[@]}" -ge 2
          docker inspect --format '{"id":{{json .Id}},"started_at":{{json .State.StartedAt}},"running":{{json .State.Running}}}' "${active_services[@]}" > bench-output/backend-images/services-before.jsonl
          # registry-mirrors supports SIGHUP reload; preserve PG/Mongo service containers.
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          mirrors = config.get('registry-mirrors', [])
          if not isinstance(mirrors, list) or not all(isinstance(item, str) for item in mirrors):
              raise SystemExit('Existing Docker registry-mirrors is not a string array')
          config['registry-mirrors'] = list(dict.fromkeys(['https://mirror.gcr.io', *mirrors]))
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config, indent=2) + '\n')
          PY
          sudo dockerd --validate --config-file /etc/docker/daemon.json
          sudo systemctl kill --kill-who=main --signal=HUP docker.service
          for _ in {1..30}; do
            docker info --format '{{json .RegistryConfig.Mirrors}}' > bench-output/backend-images/active-mirrors.json
            if python3 -c 'import json; from pathlib import Path; assert "https://mirror.gcr.io" in [item.rstrip("/") for item in json.loads(Path("bench-output/backend-images/active-mirrors.json").read_text())]'; then
              break
            fi
            sleep 2
          done
          python3 -c 'import json; from pathlib import Path; assert "https://mirror.gcr.io" in [item.rstrip("/") for item in json.loads(Path("bench-output/backend-images/active-mirrors.json").read_text())]'
          docker inspect --format '{"id":{{json .Id}},"started_at":{{json .State.StartedAt}},"running":{{json .State.Running}}}' "${active_services[@]}" > bench-output/backend-images/services-after.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('bench-output/backend-images')
          before = [json.loads(line) for line in (root / 'services-before.jsonl').read_text().splitlines()]
          after = [json.loads(line) for line in (root / 'services-after.jsonl').read_text().splitlines()]
          if before != after or not all(item['running'] for item in after):
              raise SystemExit('Docker mirror reload interrupted an already-running service')
          print(f'Registry mirror active; {len(after)} running services retain their original start time')
          PY

      - name: Start backends
        uses: ./.github/actions/start-backends
        with:
          minio: "true"
          kafka: "true"
          qdrant: "true"
          redis: "true"
          clickhouse: "true"
          neo4j: "true"
          minio-image: "cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034"
          kafka-image: "apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f"
          qdrant-image: "qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c"
          redis-image: "redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"
          clickhouse-image: "clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b"
          neo4j-image: "neo4j:5@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069"

      - name: Verify running backend image pins
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          expected = {
              'minio': 'cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034',
              'kafka': 'apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f',
              'qdrant': 'qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c',
              'redis': 'redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499',
              'clickhouse': 'clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b',
              'neo4j': 'neo4j:5@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069',
          }
          receipts = []
          for backend, reference in expected.items():
              container = json.loads(subprocess.check_output(['docker', 'inspect', f'udb-bench-{backend}'], text=True))[0]
              image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', reference], text=True))[0]
              if not container['State']['Running'] or container['Config']['Image'] != reference or container['Image'] != image['Id']:
                  raise SystemExit(f'{backend}: running backend does not match its verified immutable image')
              receipts.append({'backend': backend, 'reference': reference, 'image_id': image['Id'], 'repo_digests': image.get('RepoDigests', [])})
          Path('bench-output/backend-images/running-image-receipts.json').write_text(json.dumps(receipts, indent=2) + '\n')
          print(f'Verified {len(receipts)} running backend image pins')
          PY

      # ── Canonical broker env (single source; fixes the env-drift bug) ──
      - name: Write broker env
        uses: ./.github/actions/broker-env
        with:
          pg_dsn: postgres://udb:udb@localhost:5432/udb_ci
          nosql_dsn: mongodb://localhost:27017/udb_live_sdk?directConnection=true
          mongodb_dsn: mongodb://localhost:27017/udb_live_sdk?directConnection=true
          nosql_database: udb_live_sdk
          grpc_addr: 127.0.0.1:50051
          grpc_target: 127.0.0.1:50051
          auth_grpc_addr: 127.0.0.1:50061
          auth_grpc_target: 127.0.0.1:50061
          cdc_enabled: "true"
          startup_dry_run: "false"
          object_bucket: udb-storage
          # v0.5.7 native Storage/Scheduler/Workflow ownership is UUID-strict.
          # Keep the human tenant code for bootstrap resolution, but bind the
          # benchmark principal and every SDK request to one canonical project UUID.
          live_project: "00000000-0000-4000-8000-000000000057"

      - name: Enable perf opt-in
        shell: bash
        run: echo "UDB_LIVE_PERF=1" >> "$GITHUB_ENV"

      # ── Install SDK dependencies ──────────────────────────────────────
      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund

      - name: Install Python/PHP SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "sdk/python[dev]"
          # composer.lock + vendor/ are gitignored, so this is a fresh resolve
          # scoped to the CI PHP version. No --ignore-platform-reqs.
          ( cd sdk/php && composer install --no-interaction --no-progress --prefer-dist )

      # ── PERF: per-SDK fresh-DB + broker reset, then all four benches ──
      - name: Prepare per-SDK reset script (fresh DB + broker + bootstrap + seed)
        id: reset-script
        shell: bash
        run: |
          set -euo pipefail
          # psql for the reset/seed.
          if ! command -v psql >/dev/null 2>&1; then
            sudo python3 "${GITHUB_WORKSPACE}/scripts/install-ci-native-deps.py" --packages postgres-client
          fi
          psql --version
          mkdir -p bench-output/status bench-output/logs
          echo "UDB_BENCH_FIXTURES=${GITHUB_WORKSPACE}/bench-output/prepared-fixtures.json" >> "$GITHUB_ENV"
          # reset.sh runs BEFORE each SDK bench. It reproduces grind-once.ps1:
          # stop the previous broker, recreate udb_ci, bootstrap, start a FRESH
          # broker, re-seed. Each SDK runs against a pristine PG + broker so
          # cross-SDK state in PG cannot leak between SDKs.
          # Quoted <<'RESET' → nothing expands at write-time; $vars resolve at run-time.
          cat > bench-output/reset.sh <<'RESET'
          #!/usr/bin/env bash
          set -euo pipefail
          export PGPASSWORD=udb
          if [ -f /tmp/udb-bench.pid ]; then kill "$(cat /tmp/udb-bench.pid)" 2>/dev/null || true; fi
          for i in $(seq 1 10); do (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null || break; sleep 1; done
          psql -h localhost -p 5432 -U udb -d postgres -c "DROP DATABASE IF EXISTS udb_ci WITH (FORCE);"
          psql -h localhost -p 5432 -U udb -d postgres -c "CREATE DATABASE udb_ci;"
          "${UDB_BENCH_BIN}" auth bootstrap user --username "${UDB_LIVE_USERNAME}" --password "${UDB_LIVE_PASSWORD}" --tenant "${UDB_LIVE_TENANT}" --project "${UDB_LIVE_PROJECT}"
          "${UDB_BENCH_BIN}" auth bootstrap user --username "${UDB_LIVE_PLATFORM_USERNAME}" --email "sdk-live-platform@example.invalid" --password "${UDB_LIVE_PLATFORM_PASSWORD}" --tenant "${UDB_LIVE_TENANT}" --project "${UDB_LIVE_PROJECT}" --platform-admin
          # The candidate correctness suite also proves a real peer-tenant boundary.
          if [ "${1:-}" = "go-correctness" ]; then
            "${UDB_BENCH_BIN}" auth bootstrap user --username "${UDB_LIVE_PEER_USERNAME}" --email "sdk-live-peer@example.invalid" --password "${UDB_LIVE_PEER_PASSWORD}" --tenant "${UDB_LIVE_PEER_TENANT}" --project "${UDB_LIVE_PROJECT}"
          fi
          tid="$(psql -h localhost -p 5432 -U udb -d udb_ci -tAq -c "SELECT tenant_id::text FROM udb_tenant.tenants WHERE code='sdk-live' OR name='sdk-live' LIMIT 1;")"
          [ -n "$tid" ] || { echo "no tenant_id for sdk-live"; exit 1; }
          psql -h localhost -p 5432 -U udb -d udb_ci -v ON_ERROR_STOP=1 <<SQL
          CREATE SCHEMA IF NOT EXISTS udb_vault_sdk;
          CREATE TABLE IF NOT EXISTS udb_vault_sdk.bound_records (
            record_id text PRIMARY KEY,
            tenant_id text NOT NULL,
            project_id text NOT NULL
          );
          ALTER TABLE udb_vault_sdk.bound_records ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS sdk_scope ON udb_vault_sdk.bound_records;
          CREATE POLICY sdk_scope ON udb_vault_sdk.bound_records AS PERMISSIVE FOR SELECT TO PUBLIC USING (true);
          SQL
          export UDB_VAULT_DB_ROLES_JSON="$(printf '[{\"role_name\":\"readonly\",\"tenant_id\":\"%s\",\"project_id\":\"%s\",\"target_instance\":\"primary\",\"database_name\":\"udb_ci\",\"policy_revision\":\"sdk-live-v1\",\"relations\":[{\"schema\":\"udb_vault_sdk\",\"table\":\"bound_records\",\"tenant_column\":\"tenant_id\",\"project_column\":\"project_id\",\"privileges\":[\"SELECT\"]}],\"ttl_seconds_max\":3600},{\"role_name\":\"sdk-readonly\",\"tenant_id\":\"%s\",\"project_id\":\"%s\",\"target_instance\":\"primary\",\"database_name\":\"udb_ci\",\"policy_revision\":\"sdk-live-v1\",\"relations\":[{\"schema\":\"udb_vault_sdk\",\"table\":\"bound_records\",\"tenant_column\":\"tenant_id\",\"project_column\":\"project_id\",\"privileges\":[\"SELECT\"]}],\"ttl_seconds_max\":3600}]' "$tid" "${UDB_LIVE_PROJECT}" "$tid" "${UDB_LIVE_PROJECT}")"
          export UDB_BENCH_CATALOG_MANIFEST="${PWD}/bench-output/release-catalog.json"
          export UDB_BENCH_CATALOG_VERSION="1.0.0"
          UDB_MANIFEST_EXPORT_PATH="${UDB_BENCH_CATALOG_MANIFEST}" "${UDB_BENCH_BIN}" manifest-export
          "${UDB_BENCH_BIN}" serve proto "" 127.0.0.1:50051 > /tmp/udb-bench.log 2>&1 &
          echo $! > /tmp/udb-bench.pid
          ok=0
          for attempt in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/50061) 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$(cat /tmp/udb-bench.pid)" 2>/dev/null; then cat /tmp/udb-bench.log; exit 1; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "broker not ready"; cat /tmp/udb-bench.log; exit 1; }
          # Identity bootstrap does not activate a DataBroker catalog. Publish
          # the release manifest into this exact customer project and prove an
          # authority-sensitive served path sees it before any SDK seed runs.
          python scripts/bootstrap_benchmark_project_catalog.py
