name: Release TypeScript SDK

# Reusable publisher invoked by `release.yml` after the release binaries are
# built. Builds and publishes @udb_plus/sdk to npm.

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        description: npm automation token used by `npm publish`.
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Expected UDB release version, for example 0.6.2"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish @udb_plus/sdk
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Recovery dispatches publish the immutable release sources, even
          # when main already contains the next product version.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      # Node toolchain (with the npm registry wired for publishing) via the
      # single-source setup-sdk-toolchains composite. version-guard needs Node.
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: 'true'
          node-registry-url: "https://registry.npmjs.org"

      - uses: ./.github/actions/version-guard
        with:
          component: sdk-typescript
          dispatch-version: ${{ github.event.inputs.version }}

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install --no-audit --no-fund

      - name: Check npm version availability
        id: npm_version
        working-directory: sdk/typescript
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@udb_plus/sdk@${version}" version --silent >/dev/null 2>&1; then
            echo "@udb_plus/sdk ${version} is already published; publish steps will be skipped."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      # The messaging client's MLS core (crates/udb-mls-wasm) ships in the
      # package under mls-wasm/: build it with the wasm-bindgen CLI pinned to the
      # Cargo.lock version (the build script refuses a mismatch).
      - uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
          install-build-deps: "false"
          cache-key: release-typescript-mls-wasm

      - name: Install pinned wasm-bindgen CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/wasm-bindgen-0.2.122-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.122/wasm-bindgen-0.2.122-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '122a3fe2ea9c6e3e89b50e42dd1a346e499f3f65a54aae0b4eaeb658139d1e0e' "$archive" | sha256sum --check --strict
          install_dir="${RUNNER_TEMP}/udb-wasm-bindgen"
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" --strip-components=1
          "$install_dir/wasm-bindgen" --version | grep -Fx 'wasm-bindgen 0.2.122'
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Build the MLS WebAssembly module
        working-directory: sdk/typescript
        shell: bash
        run: |
          set -euo pipefail
          npm run build:mls-wasm
          test -f mls-wasm/udb_mls_wasm.js
          test -f mls-wasm/udb_mls_wasm_bg.wasm

      # `build` bundles the runtime proto assets into the package (bundle-proto)
      # and emits dist/*.js + *.d.ts. The committed `gen/` tree is hard-verified
      # against `buf generate --include-imports` by the CI `buf` job, so no
      # codegen runs here. The publish commands below use --ignore-scripts so
      # npm's prepublishOnly hook does not rebuild the exact same package.
      - name: Build package
        working-directory: sdk/typescript
        run: npm run build

      - name: Publish dry run
        if: steps.npm_version.outputs.exists != 'true'
        working-directory: sdk/typescript
        run: npm publish --dry-run --ignore-scripts --access public

      - name: Publish to npm
        if: steps.npm_version.outputs.exists != 'true'
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::The production NPM_TOKEN secret is missing. Configure a granular token with write access to @udb_plus/sdk and bypass 2FA for CI publishing."
            exit 1
          fi
          # An authorization failure can appear as E404 for a public package.
          # Verify the token first so the publishing identity is visible.
          npm whoami
          npm publish --ignore-scripts --access public
