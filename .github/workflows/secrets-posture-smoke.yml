name: Secrets posture smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-posture-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ws-signalling-redaction:
    name: ws-signalling redaction canaries
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: secrets-posture-smoke

      - name: Run descriptor redaction coverage gate
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          cargo test --locked --lib --features ws-signalling storage_only_fields_match_generated_redaction_coverage -- --nocapture

      - name: Run ws-signalling IceConfig redaction canary
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          cargo test --locked --lib --features ws-signalling ice_config_debug_redacts_turn_secret -- --nocapture
