name: Password CPU scheduling proof

on:
  workflow_dispatch:
    inputs:
      baseline_commit:
        description: "Exact ancestor before password CPU offload"
        required: true
        type: string

permissions:
  contents: read

jobs:
  password-scheduling:
    name: Original and corrected password serving paths
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_DB: udb
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udb -d udb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      UDB_LIVE_AUTH_TESTS: "1"
      UDB_LIVE_AUTH_PG_DSN: postgres://udb:udb@127.0.0.1:5432/udb
      UDB_INTEGRATION_PG_DSN: postgres://udb:udb@127.0.0.1:5432/udb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-ubuntu-latest
      - name: Restore the original password serving call sites
        env:
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess

          baseline = os.environ["BASELINE_COMMIT"]
          if re.fullmatch(r"[0-9a-f]{40}", baseline) is None:
              raise SystemExit("baseline_commit must be an exact commit SHA")
          subprocess.run(["git", "merge-base", "--is-ancestor", baseline, "HEAD"], check=True)
          serving_paths = [f"src/runtime/service/auth_service/authn/{name}" for name in ["login.rs", "core.rs"]]
          introductions = subprocess.check_output([
              "git", "log", "--reverse", "--format=%H", "-S", "authn::password_cpu::", "HEAD", "--", serving_paths[0]
          ]).decode().splitlines()
          if not introductions:
              raise SystemExit("password CPU offload introduction was not found")
          introduction = introductions[0]
          expected_baseline = subprocess.check_output(["git", "rev-parse", f"{introduction}^"]).decode().strip()
          if baseline != expected_baseline:
              raise SystemExit("baseline must be the exact parent of the password CPU offload commit")
          subprocess.run(["git", "diff", "--exit-code", introduction, "HEAD", "--", *serving_paths], check=True)
          proof = Path("src/runtime/service/auth_service/tests/password_cpu_live.rs").read_text(encoding="utf-8")
          if proof.count("// BEGIN PASSWORD_CPU_CI_REPRO") != 1 or proof.count("// END PASSWORD_CPU_CI_REPRO") != 1:
              raise SystemExit("expected one identical served password CPU regression")
          if "password_cpu::" in proof:
              raise SystemExit("the serving proof must use the original public APIs")
          backup = Path(os.environ["RUNNER_TEMP"], "password-cpu-fixed")
          backup.mkdir()
          evidence = {"baseline": baseline, "corrected_commit": os.environ["GITHUB_SHA"], "offload_commit": introduction, "files": []}
          # Keep the same stores, middleware, fixture, KDF and build settings.
          # Only the two password-serving call sites change for this comparison.
          for name in ["login.rs", "core.rs"]:
              path = Path("src/runtime/service/auth_service/authn", name)
              (backup / name).write_bytes(path.read_bytes())
              original = subprocess.check_output(["git", "show", f"{baseline}:{path.as_posix()}"])
              if b"password_cpu::" in original:
                  raise SystemExit("baseline must precede password CPU offload")
              evidence["files"].append({"path": path.as_posix(), "original_sha256": hashlib.sha256(original).hexdigest(), "corrected_sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
              path.write_bytes(original)
          Path("password-cpu-proof").mkdir(exist_ok=True)
          Path("password-cpu-proof/source-comparison.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Require the original served runtime starvation failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p password-cpu-proof
          restore_password_sources() {
            cp "$RUNNER_TEMP/password-cpu-fixed/login.rs" src/runtime/service/auth_service/authn/login.rs
            cp "$RUNNER_TEMP/password-cpu-fixed/core.rs" src/runtime/service/auth_service/authn/core.rs
          }
          trap restore_password_sources EXIT
          set +e
          cargo test --locked --lib runtime::service::auth_service::tests::password_cpu_live::live_password_cpu_burst_preserves_served_read_deadline_and_timer -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee password-cpu-proof/original.log
          original_exit=${PIPESTATUS[0]}
          set -e
          restore_password_sources
          if [ "$original_exit" -ne 101 ]; then
            echo "::error::Original password serving code did not produce the expected test failure."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("password-cpu-proof/original.log").read_text(encoding="utf-8")
          if re.search(r"test result: FAILED\. 0 passed; 1 failed;", log) is None:
              raise SystemExit("baseline must execute exactly one regression; build or infrastructure failure is not reproduction")
          if "password-cpu: served Login burst must not starve the runtime timer" not in log:
              raise SystemExit("baseline failed for another reason")
          print("Original served Login burst reproduced runtime timer starvation.")
          PY
          git diff --exit-code -- src/runtime/service/auth_service/authn/login.rs src/runtime/service/auth_service/authn/core.rs
      - name: Require the same serving regression on corrected source
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib runtime::service::auth_service::tests::password_cpu_live::live_password_cpu_burst_preserves_served_read_deadline_and_timer -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee password-cpu-proof/corrected.log
          grep -Fq 'test result: ok. 1 passed; 0 failed;' password-cpu-proof/corrected.log
      - name: Preserve original and corrected actual serving results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-cpu-scheduling-proof
          path: password-cpu-proof/
          if-no-files-found: warn
          retention-days: 14
