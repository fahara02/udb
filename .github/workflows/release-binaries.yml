name: Release · binaries

# Builds the `udb` broker/CLI binary for Windows, Linux, and macOS
# and attaches each as a RAW binary to the GitHub Release for a SemVer tag.
#
# Asset names match the contract the example scripts download by
# (examples/*/scripts/udb.ps1, run-udb-linux.sh, docker-compose.yml):
#
#   udb-linux-amd64
#   udb-windows-amd64.exe
#   udb-darwin-arm64
#   udb-darwin-amd64
#   udb-linux-amd64-full
#
# (os ∈ linux|windows|darwin, arch ∈ amd64|arm64; NOT archived, so the scripts'
# `-notmatch "\.(zip|tar\.gz)$"` asset filter selects them.)
#
# Feature set:
#   - unsuffixed assets are the PORTABLE subset of `default` plus the full auth
#     surface. They drop native-C backends that are painful on Windows/macOS
#     runners (kafka/rdkafka, cassandra/scylla, mssql/tiberius, memcached) while
#     keeping the common surface (postgres, qdrant, s3, redis, mongodb-native
#     [rustls, pure-Rust — local mongod dev], the REST backends, otel).
#   - `-full` currently ships for Linux amd64 only and keeps default features
#     plus OIDC/WebAuthn. SDK launchers can select it with UDB_BIN_VARIANT=full.
# A disabled backend's RPCs return FailedPrecondition rather than disappearing.
#
# Trigger: this is a `workflow_call` REUSABLE — `release.yml` (the tag-driven
# orchestrator) invokes it as the FIRST publish stage; every other publisher
# `needs:` it. It also keeps `workflow_dispatch` for a build-only dry run.
# It deliberately has NO tag trigger: `release.yml` is the sole tag entrypoint,
# otherwise the same release assets and manifest are produced twice.
# The Chapter-15 single-artifact-system: this workflow is the SOLE producer of the
# release binaries; docker + bench consume the published RELEASE ASSET, never
# rebuild the broker.

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PORTABLE_FEATURES: >-
    postgres,mysql,sqlite,qdrant,s3,mongodb-native,neo4j,clickhouse,redis,elasticsearch,weaviate,pinecone,azureblob,gcs,otel,runtime-logging,http-client,oidc,webauthn
  FULL_FEATURES: >-
    oidc,webauthn

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate the whole release on version consistency: the `v<x.y.z>` tag must equal
  # the crate version in versions.json, and every manifest/protocol constant must
  # match. No binary is built or attached otherwise. Node is set up first because
  # the version-guard composite runs `check-versions.mjs` and reads versions.json
  # with Node (it does not install Node itself, by design).
  version-guard:
    name: Version guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: 'true'
      - uses: ./.github/actions/version-guard
        with:
          component: udb

  vendored-ffmpeg:
    name: Vendored ffmpeg guard
    needs: version-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest vendored ffmpeg verifier
        run: python scripts/check-vendored-ffmpeg.py --selftest
      - name: Install ffmpeg package
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Smoke ffmpeg transcode executor
        run: python scripts/ffmpeg_transcode_smoke.py --ffmpeg-bin "$(command -v ffmpeg)" --artifact-dir ffmpeg-transcode-smoke
      - name: Upload ffmpeg transcode smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-transcode-smoke
          path: ffmpeg-transcode-smoke
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build (${{ matrix.asset }})
    needs: vendored-ffmpeg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # target_cpu = the per-OS micro-arch floor the shipped binary is tuned for.
          # x86-64-v2 (Nehalem/2009+: SSE4.2 + POPCNT) is universally safe on any modern
          # CPU — a real uplift over the generic baseline with ZERO SIGILL risk. Bump to
          # `x86-64-v3` (Haswell/2013+: AVX2/FMA/BMI2) ONLY for a known-modern fleet.
          # apple-m1 is 100% safe for Apple Silicon (every arm64 Mac is >= M1).
          # Pin ubuntu-22.04 (glibc 2.35), NOT ubuntu-latest. GitHub flipped
          # `ubuntu-latest` to 24.04 (glibc 2.39), which bumped the binary's glibc
          # floor (to GLIBC_2.38/2.39) so it no longer runs on Debian bookworm
          # (glibc 2.36) / Ubuntu 22.04 — the container then dies at exec with a
          # `version GLIBC_2.x not found` loader error. 22.04 keeps the floor at
          # glibc 2.34 (verified) and is the env that built the last-known-good
          # 0.3.6 binary. (TLS is unaffected: a 24.04-built binary still completes
          # the Neon/SNI handshake — confirmed by build-probe — so this pin is
          # purely about the glibc floor, not Postgres connectivity.)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: udb-linux-amd64
            ext: ''
            target_cpu: x86-64-v2
            variant: portable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: udb-windows-amd64.exe
            ext: '.exe'
            target_cpu: x86-64-v2
            variant: portable
          - os: macos-14
            target: aarch64-apple-darwin
            asset: udb-darwin-arm64
            ext: ''
            target_cpu: apple-m1
            variant: portable
          # Intel macOS (x86_64). macos-13 is retired; macos-15-intel is the
          # standard GitHub-hosted Intel label while x64 macOS remains available.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: udb-darwin-amd64
            ext: ''
            target_cpu: x86-64-v2
            variant: portable
          # Full-feature Linux build. This intentionally stays Linux-only for now:
          # the native-C backend set is what makes full Windows/macOS release
          # binaries brittle, while Docker already covers full Linux deployments.
          - os: ubuntu-22.04   # glibc 2.35 floor + known-good toolchain (see portable note above)
            target: x86_64-unknown-linux-gnu
            asset: udb-linux-amd64-full
            ext: ''
            target_cpu: x86-64-v2
            variant: full

    steps:
      - uses: actions/checkout@v4

      # Rust toolchain + Swatinem cache (keyed per target) + per-platform native
      # build deps (cmake/NASM/Perl/MSVC) — the single-source setup-rust composite.
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_TARGET_CPU: ${{ matrix.target_cpu }}
          MATRIX_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS_NAME}" = "Windows" ]; then
            msvc_bin="$(cygpath -u "${VCToolsInstallDir}bin\\Hostx64\\x64")"
            export PATH="${msvc_bin}:/c/Strawberry/perl/bin:/c/Program Files/NASM:${PATH}"
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="${msvc_bin}/link.exe"
          fi
          # Tune the SHIPPED artifact to this target's safe micro-arch floor (applies to
          # the whole dep graph). `dist` profile = fat LTO + 1 codegen unit + symbol strip.
          export RUSTFLAGS="-C target-cpu=${MATRIX_TARGET_CPU} ${RUSTFLAGS:-}"
          if [ "${MATRIX_VARIANT}" = "full" ]; then
            cargo build --profile dist --locked --target "${MATRIX_TARGET}" \
              --bin udb \
              --features "${FULL_FEATURES}"
          else
            cargo build --profile dist --locked --target "${MATRIX_TARGET}" \
              --bin udb \
              --no-default-features --features "${PORTABLE_FEATURES}"
          fi

      - name: Stage asset + checksum
        id: stage
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_ASSET: ${{ matrix.asset }}
          MATRIX_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # `--profile dist` outputs under target/<target>/dist/ (distinct from this ./dist staging dir).
          cp "target/${MATRIX_TARGET}/dist/udb${MATRIX_EXT}" "dist/${MATRIX_ASSET}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${MATRIX_ASSET}" > "${MATRIX_ASSET}.sha256"
          else
            shasum -a 256 "${MATRIX_ASSET}" > "${MATRIX_ASSET}.sha256"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

      - name: Guard tag still points at this commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ref_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [ "${ref_type}" = "tag" ]; then
            tag_sha="${ref_sha}"
            ref_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.type')"
            ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          if [ "${ref_type}" != "commit" ] || [ "${ref_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::${GITHUB_REF_NAME} now points at ${ref_type} ${ref_sha}, not this workflow commit ${GITHUB_SHA}; refusing to publish stale binary asset."
            exit 1
          fi

      - name: Attach to GitHub Release (kept DRAFT until every asset lands)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Attach to a DRAFT release so a consumer polling the Releases API can
          # never observe a published release with only some platforms' binaries.
          # The final `manifest` job flips draft:false once all binaries + the
          # manifest are present, so the release appears atomically-complete or not
          # at all. A failed platform leaves the release a draft (never a partial
          # publish).
          draft: true
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          fail_on_unmatched_files: true

  # ── Per-release manifest.json: the single asset contract (name/os/arch/tier/
  #    sha256/size) that the SDK launchers + the conformance gate resolve from,
  #    instead of each of the six SDKs reconstructing asset names by hand (which
  #    is exactly what silently drifted into three broken schemes). Runs after
  #    every platform's binary is attached.
  manifest:
    name: Release manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-toolchains
        with:
          node: 'true'
      - name: Selftest release manifest generator
        run: node scripts/gen-release-manifest.mjs --selftest
      - name: Guard tag still points at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ref_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [ "${ref_type}" = "tag" ]; then
            tag_sha="${ref_sha}"
            ref_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.type')"
            ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          if [ "${ref_type}" != "commit" ] || [ "${ref_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::${GITHUB_REF_NAME} now points at ${ref_type} ${ref_sha}, not this workflow commit ${GITHUB_SHA}; refusing to publish stale release manifest."
            exit 1
          fi
      - name: Download the published binaries + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --dir dist --pattern 'udb-*'
      - name: Generate manifest.json
        run: |
          node scripts/gen-release-manifest.mjs dist > dist/manifest.json
          ( cd dist && sha256sum manifest.json > manifest.json.sha256 )
          echo "── manifest.json ──"; cat dist/manifest.json
      - name: Attach manifest and PUBLISH the release atomically
        uses: softprops/action-gh-release@v2
        with:
          # This is the LAST asset. Flipping draft:false here publishes the release
          # only now that every platform binary, its checksum, and the manifest are
          # all attached — so a consumer's Releases-API poll never sees a published
          # release with a partial asset set.
          draft: false
          files: |
            dist/manifest.json
            dist/manifest.json.sha256
          fail_on_unmatched_files: true
