name: Release · binaries

# Builds the `udb` broker/CLI binary for Windows, Linux, and macOS
# and attaches each as a RAW binary to the GitHub Release for a SemVer tag.
#
# Asset names match the contract the example scripts download by
# (examples/*/scripts/udb.ps1, run-udb-linux.sh, docker-compose.yml):
#
#   udb-linux-amd64
#   udb-windows-amd64.exe
#   udb-darwin-arm64
#   udb-darwin-amd64
#   udb-linux-amd64-full
#
# (os ∈ linux|windows|darwin, arch ∈ amd64|arm64; NOT archived, so the scripts'
# `-notmatch "\.(zip|tar\.gz)$"` asset filter selects them.)
#
# Feature set:
#   - unsuffixed assets are the PORTABLE subset of `default` plus the full auth
#     surface. They drop native-C backends that are painful on Windows/macOS
#     runners (kafka/rdkafka, cassandra/scylla, mssql/tiberius, memcached) while
#     keeping the common surface (postgres, qdrant, s3, redis, mongodb-native
#     [rustls, pure-Rust — local mongod dev], the REST backends, otel).
#   - `-full` currently ships for Linux amd64 only and keeps default features
#     plus OIDC/WebAuthn. SDK launchers can select it with UDB_BIN_VARIANT=full.
# A disabled backend's RPCs return FailedPrecondition rather than disappearing.
#
# Trigger: a pushed `v*.*.*` tag, or manual dispatch for a build-only dry run.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PORTABLE_FEATURES: >-
    postgres,mysql,sqlite,qdrant,s3,mongodb-native,neo4j,clickhouse,redis,elasticsearch,weaviate,pinecone,azureblob,gcs,otel,runtime-logging,http-client,oidc,webauthn
  FULL_FEATURES: >-
    oidc,webauthn

permissions:
  contents: write

jobs:
  # Gate the whole release on version consistency: the `v<x.y.z>` tag must equal
  # the crate version in Cargo.toml, and every manifest/protocol constant must
  # match versions.json. No binary is built or attached otherwise.
  version-guard:
    name: Version guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Versions consistent with versions.json
        run: node scripts/check-versions.mjs
      - name: Tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          crate="$(node -p "require('./versions.json').components.udb.version")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag}" != "${crate}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match udb crate version ${crate}" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.asset }})
    needs: version-guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # target_cpu = the per-OS micro-arch floor the shipped binary is tuned for.
          # x86-64-v2 (Nehalem/2009+: SSE4.2 + POPCNT) is universally safe on any modern
          # CPU — a real uplift over the generic baseline with ZERO SIGILL risk. Bump to
          # `x86-64-v3` (Haswell/2013+: AVX2/FMA/BMI2) ONLY for a known-modern fleet.
          # apple-m1 is 100% safe for Apple Silicon (every arm64 Mac is >= M1).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: udb-linux-amd64
            ext: ''
            target_cpu: x86-64-v2
            variant: portable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: udb-windows-amd64.exe
            ext: '.exe'
            target_cpu: x86-64-v2
            variant: portable
          - os: macos-14
            target: aarch64-apple-darwin
            asset: udb-darwin-arm64
            ext: ''
            target_cpu: apple-m1
            variant: portable
          # Intel macOS (x86_64). macos-13 is retired; macos-15-intel is the
          # standard GitHub-hosted Intel label while x64 macOS remains available.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: udb-darwin-amd64
            ext: ''
            target_cpu: x86-64-v2
            variant: portable
          # Full-feature Linux build. This intentionally stays Linux-only for now:
          # the native-C backend set is what makes full Windows/macOS release
          # binaries brittle, while Docker already covers full Linux deployments.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: udb-linux-amd64-full
            ext: ''
            target_cpu: x86-64-v2
            variant: full

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Native build deps. aws-lc-sys (s3) needs cmake + NASM; WebAuthn pulls
      # vendored OpenSSL and requires a platform-native Perl plus compiler tools.
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang perl nasm ninja-build pkg-config libssl-dev

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake nasm ninja

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --no-progress -y
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure MSVC build tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            msvc_bin="$(cygpath -u "${VCToolsInstallDir}bin\\Hostx64\\x64")"
            export PATH="${msvc_bin}:/c/Strawberry/perl/bin:/c/Program Files/NASM:${PATH}"
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="${msvc_bin}/link.exe"
          fi
          # Tune the SHIPPED artifact to this target's safe micro-arch floor (applies to
          # the whole dep graph). `dist` profile = fat LTO + 1 codegen unit + symbol strip.
          export RUSTFLAGS="-C target-cpu=${{ matrix.target_cpu }} ${RUSTFLAGS:-}"
          if [ "${{ matrix.variant }}" = "full" ]; then
            cargo build --profile dist --locked --target ${{ matrix.target }} \
              --bin udb \
              --features "${FULL_FEATURES}"
          else
            cargo build --profile dist --locked --target ${{ matrix.target }} \
              --bin udb \
              --no-default-features --features "${PORTABLE_FEATURES}"
          fi

      - name: Stage asset + checksum
        id: stage
        shell: bash
        run: |
          mkdir -p dist
          # `--profile dist` outputs under target/<target>/dist/ (distinct from this ./dist staging dir).
          cp "target/${{ matrix.target }}/dist/udb${{ matrix.ext }}" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          fail_on_unmatched_files: true

  # ── Per-release manifest.json: the single asset contract (name/os/arch/tier/
  #    sha256/size) that the SDK launchers + the conformance gate resolve from,
  #    instead of each of the six SDKs reconstructing asset names by hand (which
  #    is exactly what silently drifted into three broken schemes). Runs after
  #    every platform's binary is attached.
  manifest:
    name: Release manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download the published binaries + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --dir dist --pattern 'udb-*'
      - name: Generate manifest.json
        run: |
          node scripts/gen-release-manifest.mjs dist > dist/manifest.json
          ( cd dist && sha256sum manifest.json > manifest.json.sha256 )
          echo "── manifest.json ──"; cat dist/manifest.json
      - name: Attach manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/manifest.json
            dist/manifest.json.sha256
          fail_on_unmatched_files: true
