name: Regen artifacts (0.4.17)

# One-shot: build udb on a fast Linux runner, regenerate every generated
# artifact from the current protos/descriptor, and commit the result back to
# the branch. Offloads the slow local (disk-bound) compile. The `if` guard
# stops the regen commit from re-triggering this workflow.

on:
  push:
    branches:
      - fix/auth-catalog-0417

permissions:
  contents: write

jobs:
  regen:
    if: ${{ !contains(github.event.head_commit.message, 'regenerate all derived artifacts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-catalog-0417
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.65.0'
      - name: Build udb
        run: cargo build --locked -q --bin udb
      - name: Regenerate all artifacts
        run: |
          set -x
          ./target/debug/udb native manifest > docs/generated/udb-native-contract.json
          ./target/debug/udb native docs > docs/generated/native-services.md
          buf generate --include-imports
          node scripts/openapi-postprocess.mjs
          node scripts/check-openapi-api-rules.mjs
          node scripts/sdk-codegen-postprocess.mjs
          ./target/debug/udb sdk generate
          node scripts/gen-bench-bodies-json.mjs
          node scripts/gen-bench-bodies-skeleton.mjs
          node scripts/gen-sdk-benchmark-docs.mjs
          node scripts/generate-authn-authz-inventory.mjs
          python3 scripts/generate-codebase-map.py
      - name: Commit regenerated artifacts (fahara02)
        run: |
          git config user.name 'fahara02'
          git config user.email 'info@labaidinsuretech.com'
          if git diff --quiet; then
            echo "no artifact drift — nothing to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore(0.4.17): regenerate all derived artifacts (native-contract, swagger, typed clients, bench docs, inventory, codebase-map)"
          git push origin HEAD:fix/auth-catalog-0417
