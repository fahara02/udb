apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: udbbrokers.udb.io
spec:
  group: udb.io
  scope: Namespaced
  names:
    plural: udbbrokers
    singular: udbbroker
    kind: UdbBroker
    shortNames: [udbb]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image, configRef]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                configRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: database.yaml
                reloadStrategy:
                  type: string
                  enum: [ShadowValidateThenSwap, Restart]
                  default: ShadowValidateThenSwap
                credentialRotation:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    secretRefs:
                      type: array
                      items:
                        type: string
                healthGates:
                  type: object
                  properties:
                    requireConnectedBackends:
                      type: boolean
                      default: true
                    grpcurlReflection:
                      type: boolean
                      default: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                endpoint:
                  type: string
                activeConfigChecksum:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
---
