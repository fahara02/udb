apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: udbbackendinstances.udb.io
spec:
  group: udb.io
  scope: Namespaced
  names:
    plural: udbbackendinstances
    singular: udbbackendinstance
    kind: UdbBackendInstance
    shortNames: [udbbi]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [backend, instanceName, role, secretRef]
              properties:
                backend:
                  type: string
                  enum: [postgres, redis, qdrant, s3, mongodb, neo4j, clickhouse, kafka]
                instanceName:
                  type: string
                role:
                  type: string
                  enum: [read, write, read_write, admin, cache, projection, cdc]
                projectSelector:
                  type: object
                  additionalProperties:
                    type: string
                secretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    dsnKey:
                      type: string
                      default: dsn
                connectionBudget:
                  type: object
                  properties:
                    maxConnections:
                      type: integer
                      minimum: 1
                    safetyFactor:
                      type: string
                      default: "0.8"
            status:
              type: object
              properties:
                connected:
                  type: boolean
                lastProbeUnixMs:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
---
