syntax = "proto3";

// Placeholder project schema so the stack boots as shipped. Replace this
// directory with your own protos: the broker serves whatever is mounted at
// /srv/proto (see docker-compose.yml) and creates the tables they describe.
package app.v1;

// The broker embeds the UDB annotation contract, so this import resolves
// without copying UDB's protos next to yours.
import "udb/core/common/v1/db.proto";

// A tenant-scoped table: `tenant_column` makes the broker enforce tenant
// isolation on every read and write.
message Note {
  option (udb.core.common.v1.table) = {
    table_name: "notes"
    schema_name: "app"
    migration_order: 10
    is_table: true
    comment: "Placeholder table for the UDB docker compose deployment"
  };

  string note_id = 1 [(udb.core.common.v1.column) = {
    column_name: "note_id"
    sql_type: "UUID"
    primary_key: true
    default_value: "gen_random_uuid()"
  }];

  string tenant_id = 2 [(udb.core.common.v1.column) = {
    column_name: "tenant_id"
    sql_type: "UUID"
    tenant_column: true
    not_null: true
  }];

  string body = 3 [(udb.core.common.v1.column) = {
    column_name: "body"
    sql_type: "TEXT"
    not_null: true
  }];

  string created_at = 4 [(udb.core.common.v1.column) = {
    column_name: "created_at"
    sql_type: "TIMESTAMPTZ"
    not_null: true
    default_value: "now()"
    exclude_from_insert: true
    exclude_from_update: true
  }];
}
