# U28 — udb-portable: the WASM/edge-safe subset of the UDB stack.
#
# This crate is the planner/client surface: AST types, deterministic
# checksum, proto lexer, and a source-based parser API. It has zero
# native networking, zero TLS, zero database drivers, and zero async
# runtime — so it builds for both native targets and
# `wasm32-unknown-unknown` (browser) and `wasm32-wasi` (edge).
#
# Source files are NOT duplicated. The crate's lib.rs uses `#[path =
# "../../src/…"]` to include the existing portable modules from the
# main `udb/` source tree. That way there's exactly one definition of
# `ProtoSchema`, the lexer, the checksum, and the parser submodules —
# the server crate and the WASM crate share bytes.
#
# Only files that are truly portable (no fs::read_dir, no fs::read in
# the public API, no tokio/sqlx/reqwest/tonic) are included. The
# main crate's `parser/mod.rs` exposes `parse_directory` and
# `parse_file` that touch `std::fs::read_dir` — those are NOT
# re-exported here. WASM consumers call `parse_proto_source` with
# bytes/strings they fetched themselves (browser fetch, edge KV, etc).
[package]
name = "udb-portable"
version = "0.1.0"
edition = "2024"
description = "WASM/edge-safe subset of UDB: AST, lexer, deterministic checksum, source-based parser"
license = "Apache-2.0"
# Crates.io cannot publish this — its source files are `#[path =
# "../../src/..."]` includes into the parent crate, which doesn't
# exist after extraction from the registry tarball. The portable
# subset is consumed via `path = "crates/udb-portable"` inside the
# workspace; never via `cargo publish`.
publish = false

[lib]
name = "udb_portable"
path = "src/lib.rs"

[dependencies]
# Only crates that are wasm32-unknown-unknown clean. No tokio, no
# reqwest, no sqlx, no rdkafka, no aws-*, no tonic. Versions match the
# parent crate so we don't double-link.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `tracing` is a wasm-clean facade (no runtime). The manifest builder +
# DDL renderers call `tracing::warn!` at a few unsafe-input drop sites;
# including the dep keeps the `#[path]`-shared source byte-identical to
# the server build (no cfg-gating of the shared files needed).
tracing = "0.1"
# IR → backend query compiler deps (both wasm32-unknown-unknown clean):
#   base64 — cache_key fingerprints (URL_SAFE_NO_PAD) + the JSON compilers'
#            `$binary` rendering (STANDARD) in ir::compile::util.
#   chrono — ir::value::LogicalValue::Timestamp carries DateTime<Utc>. The IR
#            never calls Utc::now (timestamps are passed in), so the system-clock
#            `wasmbind` feature is NOT required — only serde.
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
# Descriptor / RPC-contract decode (`descriptor_manifest.rs`): hand-decodes the
# embedded `FileDescriptorSet` bytes (prost only — NOT prost-types, which drops
# the unknown UDB option extensions). wasm32-unknown-unknown clean.
prost = "0.13"

[features]
# Every IR backend compiler is a pure string renderer (no native deps), so the
# default enables them all — a browser/edge target gets the FULL multi-backend
# query compiler. `ir/compile/mod.rs` gates each backend module on a feature of
# the same name (mirroring the parent `udb` crate's backend feature flags); here
# they are no-op switches that just turn the pure modules on. `postgres` is
# always compiled (ungated upstream).
default = ["all-compilers"]
all-compilers = [
    "mysql", "sqlite", "mssql", "mongodb", "neo4j", "clickhouse", "qdrant",
    "elasticsearch", "memcached", "weaviate", "pinecone", "cassandra",
    "azureblob", "gcs", "redis", "s3",
]
mysql = []
sqlite = []
mssql = []
mongodb = []
neo4j = []
clickhouse = []
qdrant = []
elasticsearch = []
memcached = []
weaviate = []
pinecone = []
cassandra = []
azureblob = []
gcs = []
redis = []
s3 = []
